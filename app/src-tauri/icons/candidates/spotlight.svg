    </linearGradient>
    <linearGradient id="sp-cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cbeff" stop-opacity="0"/><stop offset="1" stop-color="#8cbeff" stop-opacity=".4"/>
    </linearGradient>
    <linearGradient id="sp-line" x1="0" y1="0" x2="1" y2="0">
