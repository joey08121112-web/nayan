      <path d="M198 0 L314 0 L364 312 L148 312 Z" fill="url(#sp-cone)" filter="url(#sp-blur)"/>
      <rect x="138" y="286" width="236" height="46" rx="23" fill="#4d8dff" opacity=".5" filter="url(#sp-blur)"/>
      <rect x="150" y="296" width="212" height="32" rx="16" fill="url(#sp-line)"/>
