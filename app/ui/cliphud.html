<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>剪贴板收录</title>
<style>
  /* 剪贴板被动收录 HUD：玻璃小卡，12 秒无操作自动消失 */
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
  #card{position:fixed;inset:10px;border-radius:16px;padding:14px 16px 12px;
    background:rgba(26,28,34,.78);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 18px 50px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.09);
    color:rgba(255,255,255,.92);display:flex;flex-direction:column;gap:9px;
    opacity:0;transform:translateY(10px) scale(.98);
    transition:opacity .28s ease,transform .32s cubic-bezier(.05,.7,.1,1)}
  #card.show{opacity:1;transform:none}
  .head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650}
  .dot{width:8px;height:8px;border-radius:50%;background:#f09464;box-shadow:0 0 8px #f09464}
  .src{color:rgba(255,255,255,.45);font-size:11.5px;font-weight:400;margin-left:auto}
  #prev{flex:1;overflow-y:auto;font-size:12.5px;line-height:1.6;color:rgba(255,255,255,.8);
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.1);border-radius:10px;
    padding:8px 11px;user-select:text;-webkit-user-select:text;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .row{display:flex;gap:8px;align-items:center}
  .btn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:rgba(255,255,255,.85);
    border-radius:999px;padding:6px 14px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:all .2s}
  .btn:hover{border-color:rgba(255,255,255,.32)}
  .btn.primary{background:linear-gradient(135deg,#f09464,#e87f4b);border-color:transparent;color:#fff;
    font-weight:600;box-shadow:0 5px 16px rgba(240,148,100,.3)}
  .btn.primary:hover{box-shadow:0 7px 20px rgba(240,148,100,.42)}
  .keys{font-size:11px;color:rgba(255,255,255,.4);margin-left:auto}
  .keys b{font-family:"SF Mono",Menlo,monospace;font-weight:500;color:rgba(255,255,255,.65);
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:4px;
    padding:0 5px;margin:0 1px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="card">
  <div class="head"><span class="dot"></span>剪贴板 · 收进纳言？<span class="src">来自复制</span></div>
  <div id="prev"></div>
  <div class="row">
    <button class="btn primary" id="saveBtn">⏎ 直接入箱</button>
    <button class="btn" id="editBtn">E 编辑</button>
    <span class="keys"><b>⏎</b>收进 <b>E</b>编辑 <b>Esc</b>忽略</span>
  </div>
</div>
<script>
var TAPI = (window.__TAURI__ && window.__TAURI__.core) ? window.__TAURI__.core : null;
var text = '', hideTimer = null;

window.__clip = function (p) {
  text = (p && p.text) || '';
  document.getElementById('prev').textContent = text;
  document.getElementById('card').classList.add('show');
  var b = document.getElementById('saveBtn');
  b.disabled = false;
  // 12 秒无操作自动消失
  clearTimeout(hideTimer);
  hideTimer = setTimeout(dismiss, 12000);
  setTimeout(function () { document.getElementById('saveBtn').focus(); }, 80);
};

function save() {
  if (!text || !TAPI) return;
  var b = document.getElementById('saveBtn');
  b.disabled = true; b.textContent = '收入中…';
  TAPI.invoke('clip_save', { text: text }).then(function () { reset(); }).catch(function (e) {
    b.disabled = false; b.textContent = '⏎ 直接入箱';
    document.getElementById('prev').textContent = '✗ 入箱失败：' + e;
  });
}
function edit() {
  if (!TAPI || !text) return;
  TAPI.invoke('clip_edit', { text: text }).catch(function () {});
  reset();
}
function dismiss() {
  document.getElementById('card').classList.remove('show');
  if (TAPI) TAPI.invoke('clip_dismiss').catch(function () {});
  text = '';
}
function reset() {
  document.getElementById('card').classList.remove('show');
  text = '';
}

document.getElementById('saveBtn').addEventListener('click', save);
document.getElementById('editBtn').addEventListener('click', edit);
document.addEventListener('keydown', function (e) {
  if (!text) return;
  if (e.key === 'Enter') { e.preventDefault(); save(); }
  else if (e.key === 'e' || e.key === 'E') { e.preventDefault(); edit(); }
  else if (e.key === 'Escape') { e.preventDefault(); dismiss(); }
});
</script>
</body>
</html>
