<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纳言 · 建议收件箱</title>
<style>
/* ============ 纳言 · 三栏工作台（侧栏项目树 / 中列条目 / 右栏详情） ============ */
:root{
  --bg:#f5f5f7; --panel:#ffffff; --panel2:rgba(120,120,128,.08);
  --line:rgba(0,0,0,.10); --hair:rgba(0,0,0,.06);
  --ink:#1d1d1f; --sub:#86868b; --faint:#aeaeb2;
  --accent:#0071e3; --doing:#7d5aff; --ok:#1d9a52; --warn:#b25e09; --fire:#f56300;
  --hover:rgba(0,0,0,.045); --sel:rgba(0,0,0,.06);
  --field:rgba(120,120,128,.09); --ring:rgba(0,113,227,.22);
  --shadow:0 0 0 .5px rgba(0,0,0,.05), 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --r-lg:14px; --r-md:10px; --r-sm:7px;
}
body.dark{
  --bg:#0c0c0e; --panel:#17171a; --panel2:rgba(120,120,128,.14);
  --line:rgba(255,255,255,.12); --hair:rgba(255,255,255,.07);
  --ink:#f5f5f7; --sub:#98989f; --faint:#6c6c70;
  --accent:#0a84ff; --doing:#9d7bff; --ok:#30d158; --warn:#ff9f0a; --fire:#ff9f0a;
  --hover:rgba(255,255,255,.06); --sel:rgba(255,255,255,.10);
  --field:rgba(255,255,255,.08); --ring:rgba(10,132,255,.35);
  --shadow:0 0 0 .5px rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.45);
}
*{ box-sizing:border-box; }
html{ height:100%; }
body{ margin:0; min-height:100vh; min-width:1020px; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; }
a{ color:var(--accent); text-decoration:none; }
button{ font:inherit; border:0; border-radius:var(--r-sm); padding:6px 12px; background:transparent;
  color:var(--ink); cursor:pointer; font-weight:500; transition:background .15s ease, color .15s ease; }
button:disabled{ opacity:.45; cursor:default; }
svg.ic{ width:16px; height:16px; flex-shrink:0; }
.icw{ width:18px; height:18px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }

::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:rgba(128,128,138,.35); border-radius:99px;
  border:2px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-track{ background:transparent; }

/* ---- 侧栏 · 访达式悬浮玻璃板（项目 → 来源软件 两级树） ---- */
.dragstrip{ position:fixed; top:0; left:0; right:0; height:30px; z-index:30; }
.sidebar{ position:fixed; left:10px; top:10px; bottom:10px; width:232px; z-index:5;
  display:flex; flex-direction:column; padding:0 2px 10px; border-radius:16px;
  overflow:hidden;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(40px) saturate(1.8); -webkit-backdrop-filter:blur(40px) saturate(1.8);
  box-shadow:0 0 0 .5px rgba(0,0,0,.05), 0 2px 6px rgba(0,0,0,.06),
    0 18px 48px rgba(0,0,0,.16), inset 0 0 0 .5px rgba(255,255,255,.45); }
body.dark .sidebar{ background:rgba(28,28,32,.55);
  box-shadow:0 0 0 .5px rgba(0,0,0,.5), 0 18px 48px rgba(0,0,0,.5), inset 0 0 0 .5px rgba(255,255,255,.12); }
.side-scroll{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; }
.brand{ display:flex; gap:9px; align-items:center; padding:48px 8px 12px; }
.logo{ width:24px; height:24px; border-radius:7px; background:linear-gradient(135deg,#0a84ff,#5e5ce6);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  box-shadow:0 1px 4px rgba(10,90,255,.30); }
.logo svg{ width:13px; height:13px; stroke:#fff; }
.bname{ font-weight:700; font-size:14px; letter-spacing:-.01em; line-height:1.25; }
.side-label{ font-size:11px; color:#8E8E93; padding:18px 8px 5px; font-weight:500;
  display:flex; align-items:center; }
.brand + .side-label{ padding-top:10px; }
.side-label .grow{ flex:1; }
.side-label .plus{ font-size:13px; color:var(--faint); width:18px; height:18px; border-radius:5px;
  display:flex; align-items:center; justify-content:center; line-height:1; }
.side-label .plus:hover{ background:var(--hover); color:var(--sub); }
.nav-item{ display:flex; align-items:center; gap:8px; height:30px; margin:0 8px; padding:0 8px;
  border-radius:6px; cursor:pointer; color:var(--ink); font-weight:400; font-size:13px;
  transition:background .12s ease; }
.nav-item svg.ic{ color:var(--sub); }
.nav-item:hover{ background:var(--hover); }
.nav-item.on{ font-weight:500; color:var(--accent); }
.nav-item.on svg.ic{ color:var(--accent); }
.nav-item .cnt{ margin-left:auto; font-size:11.5px; color:var(--sub);
  font-variant-numeric:tabular-nums; font-weight:500; }
/* 项目行的展开箭头 */
.nav-item .pchev{ width:14px; height:14px; flex-shrink:0; display:flex; align-items:center;
  justify-content:center; color:var(--faint); margin-left:-4px; transition:transform .3s var(--spring); }
.nav-item .pchev svg{ width:10px; height:10px; }
.nav-item .pchev.open{ transform:rotate(90deg); }
.nav-item .pchev:hover{ color:var(--sub); }
.nav-item.sub{ padding-left:14px; height:28px; font-size:12.5px; color:var(--sub); }
.nav-item.sub:hover{ color:var(--ink); }
.nav-item.sub.on{ color:var(--accent); }
.side-empty{ font-size:11.5px; color:var(--faint); padding:4px 16px; }
.side-grow{ flex:1; }
.bottombar{ display:flex; gap:4px; padding-top:8px; border-top:1px solid var(--hair); }
.bottombar .bbtn{ flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  height:30px; border-radius:var(--r-sm); color:var(--sub); font-size:12px; font-weight:500; }
.bottombar .bbtn:hover{ background:var(--hover); color:var(--ink); }

/* ---- 中列 · 条目列表 ---- */
.mcol{ position:fixed; left:254px; top:10px; bottom:10px; width:318px; z-index:4;
  overflow-y:auto; overflow-x:hidden; padding:36px 0 14px; }
.mhead{ display:flex; align-items:baseline; gap:8px; padding:0 14px 2px; }
.mhead h1{ margin:0; font-size:19px; font-weight:700; letter-spacing:-.02em; line-height:1.3; }
.mhead .cnt{ color:var(--sub); font-size:12px; font-variant-numeric:tabular-nums; }
.msub{ padding:0 14px; color:var(--faint); font-size:11.5px; margin:0 0 10px;
  font-variant-numeric:tabular-nums; }
.msearch{ position:relative; margin:0 12px 8px; }
.msearch svg{ position:absolute; left:9px; top:8px; width:14px; height:14px; color:var(--sub); }
.msearch input{ width:100%; height:31px; border:1px solid transparent; border-radius:8px;
  padding:0 10px 0 29px; font:inherit; font-size:13px; background:rgba(255,255,255,.65);
  backdrop-filter:blur(20px) saturate(1.4); -webkit-backdrop-filter:blur(20px) saturate(1.4);
  box-shadow:var(--shadow); color:var(--ink); outline:none; transition:border-color .15s ease; }
body.dark .msearch input{ background:rgba(23,23,27,.6); }
.msearch input:focus{ background:var(--panel); border-color:var(--accent);
  box-shadow:var(--shadow), 0 0 0 3.5px var(--ring); }

/* 快速记录 */
.quickadd{ display:flex; align-items:center; gap:8px; margin:0 12px 8px; height:38px;
  border-radius:11px; padding:0 8px 0 14px;
  background:rgba(255,255,255,.65); backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4); box-shadow:var(--shadow); }
body.dark .quickadd{ background:rgba(23,23,27,.6); }
.quickadd:focus-within{ box-shadow:var(--shadow), 0 0 0 3.5px var(--ring); }
.quickadd .plus{ color:var(--accent); font-weight:700; font-size:15px; }
.quickadd input{ flex:1; min-width:0; border:0; outline:none; background:transparent; font:inherit;
  font-size:13px; color:var(--ink); }
.quickadd input::placeholder{ color:var(--faint); }
.quickadd .more{ color:var(--faint); width:26px; height:26px; border-radius:6px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.quickadd .more:hover{ background:var(--hover); color:var(--sub); }
.quickadd .more svg{ width:13px; height:13px; transition:transform .15s ease; }
.quickadd .more.open svg{ transform:rotate(180deg); }

/* 今日专注条 */
.focusstrip{ display:flex; align-items:center; gap:10px; margin:0 12px 8px; padding:8px 8px 8px 13px;
  border-radius:12px; background:linear-gradient(135deg,#0a84ff,#5e5ce6); color:#fff;
  box-shadow:0 6px 18px rgba(10,90,240,.25); }
.focusstrip .fdot{ width:8px; height:8px; border-radius:50%; background:#fff;
  box-shadow:0 0 0 0 rgba(255,255,255,.6); animation:pulse 2s ease-out infinite; flex-shrink:0; }
@keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(255,255,255,.55);} 70%{ box-shadow:0 0 0 7px rgba(255,255,255,0);} 100%{ box-shadow:0 0 0 0 rgba(255,255,255,0);} }
.focusstrip .ftitle{ font-weight:600; font-size:12.5px; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; flex-shrink:1; min-width:0; }
.focusstrip .fprog{ font-size:11px; opacity:.85; font-variant-numeric:tabular-nums; flex-shrink:0; }
.focusstrip .fgrow{ flex:1; }
.focusstrip .fbtn{ background:rgba(255,255,255,.2); color:#fff; border-radius:7px;
  font-size:11.5px; padding:3px 9px; flex-shrink:0; }
.focusstrip .fbtn:hover{ background:rgba(255,255,255,.32); }
.focusstrip.quiet{ background:var(--panel2); color:var(--sub); box-shadow:none; padding:6px 8px 6px 13px; }
.focusstrip.quiet .fdot{ display:none; }
.focusstrip.quiet .fbtn{ background:transparent; color:var(--accent); font-weight:600; }
.focusstrip.quiet .fbtn:hover{ background:var(--hover); }

/* 闲时任务重置条 */
.resetbar{ display:none; align-items:center; gap:8px; flex-wrap:wrap; margin:0 12px 8px;
  padding:7px 12px; border-radius:10px; font-size:12px; color:var(--ink);
  background:rgba(255,149,0,.10); }
.resetbar.show{ display:flex; }
.resetbar b{ color:var(--fire); }
.resetbar input[type=date]{ border:1px solid transparent; border-radius:7px; padding:2px 7px;
  font:inherit; font-size:11.5px; background:var(--field); color:var(--ink); outline:none; }
.resetbar .days{ font-size:13px; font-weight:800; color:var(--fire); font-variant-numeric:tabular-nums; }
.resetbar .grow{ flex:1; }
.resetbar .tip{ font-size:11px; color:var(--sub); }

/* 条目卡片 */
.datehead{ display:flex; align-items:baseline; gap:8px; margin:14px 14px 6px; }
.datehead b{ font-size:12px; font-weight:600; color:var(--sub); }
.datehead span{ font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums; }
.card{ background:rgba(255,255,255,.66); backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-radius:12px; padding:9px 12px 8px; margin:0 12px 7px; cursor:pointer;
  border:1px solid transparent; position:relative; overflow:hidden;
  box-shadow:0 0 0 .5px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.05);
  transition:border-color .15s ease, box-shadow .15s ease, transform .18s var(--spring),
    opacity .28s ease, margin .3s var(--easeout), max-height .3s var(--easeout), padding .3s var(--easeout); }
body.dark .card{ background:rgba(28,28,32,.55); }
.card:hover{ transform:translateY(-1px); }
.card.sel{ border-color:var(--accent);
  box-shadow:0 0 0 3px var(--ring), 0 1px 3px rgba(0,0,0,.05); }
.card.done, .card.dropped{ opacity:.55; }
.ctitle{ display:flex; align-items:flex-start; gap:7px; font-weight:600; font-size:13.5px;
  line-height:1.4; letter-spacing:-.005em; word-break:break-word; }
.cdot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:5px; }
.cdot.s-inbox{ background:transparent; border:1.5px dashed var(--faint); }
.cdot.s-todo{ background:var(--faint); }
.cdot.s-doing{ background:var(--doing); }
.cdot.s-done{ background:var(--ok); }
.cdot.s-dropped{ background:transparent; border:1.5px solid var(--faint); }
.cmeta{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin:3px 0 0 15px;
  font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums; }
.tchip{ background:var(--panel2); color:var(--sub); border-radius:5px; padding:1px 6px;
  font-weight:500; }
.cmeta .ktag{ color:var(--fire); font-weight:600; }
.cmeta .okn{ color:var(--ok); font-weight:600; }
.cmeta .grow{ flex:1; }

.mfoot{ text-align:center; color:var(--faint); font-size:10.5px; padding:18px 0 6px; }

/* ---- 右栏 · 详情 / 新建 / 设置 ---- */
.detail{ position:fixed; left:584px; right:10px; top:10px; bottom:10px; z-index:3;
  overflow-y:auto; padding:44px 0 70px; }
.dwrap{ max-width:700px; margin:0 auto; padding:0 12px; }
.dtitle{ margin:0; font-size:24px; font-weight:700; letter-spacing:-.02em; line-height:1.3;
  outline:none; border-radius:6px; padding:2px 4px; margin-left:-4px; word-break:break-word; }
.dtitle:hover{ background:var(--hover); }
.dtitle:focus{ background:var(--panel); box-shadow:0 0 0 3.5px var(--ring); }
.dmeta{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin:8px 0 0;
  font-size:12px; color:var(--sub); font-variant-numeric:tabular-nums; }
.mchip{ display:inline-flex; align-items:center; gap:5px; background:var(--panel2);
  border-radius:6px; padding:2px 8px; font-size:11.5px; color:var(--sub); font-weight:500; }
button.mchip{ cursor:pointer; }
button.mchip:hover{ color:var(--ink); background:var(--line); }
.mchip svg{ width:12px; height:12px; }
.dmeta .sep::before{ content:'·'; color:var(--faint); }
.dmeta a{ font-weight:500; }

.dtoprow{ display:flex; align-items:center; gap:10px; margin:16px 0 4px; flex-wrap:wrap; }
.seg{ display:flex; gap:2px; background:var(--field); border-radius:9px; padding:2px; position:relative; }
.seg button{ position:relative; z-index:1; border-radius:7px; padding:5px 12px; font-size:12px; font-weight:500;
  color:var(--sub); background:transparent; }
.seg button:hover{ color:var(--ink); }
.seg button.on{ color:var(--ink); font-weight:600; }

.dblock{ margin-top:18px; }
.dlabel{ font-size:11px; color:var(--faint); font-weight:600; margin:0 2px 6px; }
.dlabel .grow{ float:right; font-weight:400; }
.dta{ width:100%; border:1px solid transparent; border-radius:10px; background:var(--field);
  padding:9px 12px; font:inherit; font-size:13px; color:var(--ink); resize:vertical;
  min-height:42px; outline:none; caret-color:var(--accent); line-height:1.65;
  transition:background .15s ease, border-color .15s ease, box-shadow .15s ease; }
.dta:focus{ background:var(--panel); border-color:var(--accent); box-shadow:0 0 0 3.5px var(--ring); }
/* AI 原文卡：像 Wispal 的回复卡，带头部来源 */
.aiquote{ background:rgba(255,255,255,.72); border-radius:13px; overflow:hidden;
  backdrop-filter:blur(24px) saturate(1.5); -webkit-backdrop-filter:blur(24px) saturate(1.5);
  box-shadow:var(--shadow); }
body.dark .aiquote{ background:rgba(23,23,27,.72); }
.aihead{ display:flex; align-items:center; gap:7px; padding:8px 13px; font-size:12px;
  font-weight:600; color:var(--sub); border-bottom:1px solid var(--hair); }
.aihead .icw svg{ width:14px; height:14px; color:var(--sub); }
.aihead .fgrow{ flex:1; }
.aihead .cp{ font-size:11px; color:var(--sub); padding:2px 8px; border-radius:5px; }
.aihead .cp:hover{ background:var(--panel2); color:var(--ink); }
.aibody{ padding:12px 15px 13px; font-size:13px; line-height:1.7; white-space:pre-wrap;
  word-break:break-word; }
.dsrc{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-top:8px;
  font-size:12px; color:var(--sub); }

/* 步骤清单（带序号 + 执行结果） */
.steps{ margin-top:6px; }
.sprogress{ display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--sub);
  margin-bottom:5px; font-variant-numeric:tabular-nums; }
.sprogress .bar{ flex:1; max-width:220px; height:4px; background:var(--panel2); border-radius:99px; overflow:hidden; }
.sprogress .bar i{ display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .55s var(--spring); }
.step{ display:flex; align-items:flex-start; gap:7px; padding:7px 8px; border-radius:9px; line-height:1.5; }
.step:hover{ background:var(--hover); }
.step .ck{ flex-shrink:0; width:16px; height:16px; margin-top:2px; border:1.5px solid var(--line);
  border-radius:5px; cursor:pointer; position:relative; background:transparent;
  transition:background .12s ease, border-color .12s ease; }
.step .ck:hover{ border-color:var(--accent); }
.step.done .ck{ background:var(--accent); border-color:var(--accent); }
.step .sidx{ flex-shrink:0; min-width:16px; text-align:right; margin-top:2px; font-size:11px;
  color:var(--faint); font-variant-numeric:tabular-nums; font-weight:600; }
.step .smain{ flex:1; min-width:0; }
.step .stext{ display:block; font-size:13px; word-break:break-all; white-space:pre-wrap; }
.step.done .stext{ color:var(--faint); }
.step .stext.cmd{ font-family:ui-monospace,'SF Mono',Menlo,monospace; font-size:11.5px;
  background:rgba(0,113,227,.08); padding:3px 8px; border-radius:6px; color:var(--accent); font-weight:500; }
body.dark .step .stext.cmd{ background:rgba(10,132,255,.14); }
.step .sresult{ display:block; width:100%; margin-top:4px; border:1px dashed var(--line);
  border-radius:7px; padding:4px 9px; font:inherit; font-size:12px; background:transparent;
  color:var(--ink); outline:none; transition:border-color .15s ease, background .15s ease; }
.step .sresult::placeholder{ color:var(--faint); }
.step .sresult:focus{ border-color:var(--accent); border-style:solid; background:var(--panel);
  box-shadow:0 0 0 3px var(--ring); }
.step .cp{ flex-shrink:0; opacity:0; font-size:11px; color:var(--sub); padding:2px 6px;
  border-radius:5px; margin-top:1px; }
.step:hover .cp{ opacity:1; }
.step .cp:hover{ background:var(--panel2); color:var(--ink); }
.sadd{ display:flex; gap:6px; margin-top:5px; }
.sadd input{ flex:1; border:1px dashed var(--line); border-radius:7px; padding:5px 9px;
  font:inherit; font-size:12px; background:transparent; color:var(--ink); outline:none; }
.sadd input:focus{ border-color:var(--accent); }
.sadd .dbtn{ font-size:11.5px; padding:3px 9px; }

.dacts{ display:flex; gap:6px; margin-top:20px; flex-wrap:wrap; }
.dbtn{ font-size:12px; font-weight:500; padding:5px 11px; border-radius:7px;
  background:var(--panel2); color:var(--sub); }
.dbtn:hover{ color:var(--ink); background:var(--line); }
.dbtn.accent{ background:var(--accent); color:#fff; font-weight:600; }
.dbtn.accent:hover{ filter:brightness(1.08); }
.dbtn.warn{ color:var(--warn); }
.dbtn.danger:hover{ color:#ff3b30; }

/* 新建 / 设置面板（右栏） */
.fpanel{ max-width:700px; margin:0 auto; padding:0 12px; }
.fpanel .inner{ border-radius:14px; padding:16px 18px 18px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(30px) saturate(1.5); -webkit-backdrop-filter:blur(30px) saturate(1.5);
  box-shadow:var(--shadow); }
body.dark .fpanel .inner{ background:rgba(23,23,27,.72); }
.fpanel h2{ margin:0 0 2px; font-size:17px; letter-spacing:-.01em; }
.fpanel .hint{ font-size:12px; color:var(--sub); line-height:1.7; margin:4px 0 2px; }
.flabel{ display:block; font-size:11.5px; font-weight:600; color:var(--sub); margin:12px 2px 5px; }
.fpanel input, .fpanel textarea, .fpanel select{
  width:100%; border:1px solid transparent; border-radius:8px; padding:8px 11px;
  font:inherit; font-size:13px; margin-bottom:2px; background:var(--field); color:var(--ink);
  outline:none; caret-color:var(--accent); transition:background .15s ease, border-color .15s ease, box-shadow .15s ease; }
.fpanel input:focus, .fpanel textarea:focus, .fpanel select:focus{
  background:var(--panel); border-color:var(--accent); box-shadow:0 0 0 3.5px var(--ring); }
.fpanel textarea{ min-height:54px; resize:vertical; }
.addrow{ display:flex; gap:8px; }
.addrow select{ flex:0 0 180px; }
.addrow input{ flex:1; min-width:0; }
.fpanel .primary{ background:var(--accent); color:#fff; font-weight:600;
  padding:7px 16px; border-radius:8px; margin-top:12px; }
.fpanel .primary:hover{ filter:brightness(1.08); }
.fpanel .sec{ background:var(--panel2); font-weight:500; padding:7px 16px; border-radius:8px; margin-top:12px; }
.fpanel .sec:hover{ color:var(--ink); }

<style id="fx">
/* ============ 动效层（16 项微交互，全部 vanilla CSS/JS，WKWebView 兼容） ============ */
:root{ --spring:cubic-bezier(.34,1.56,.64,1); --easeout:cubic-bezier(.22,1,.36,1); }
button:active{ transform:scale(.96); }
.nav-item:active{ transform:scale(.985); }

/* ⑨ 数字翻滚 */
.roll{ display:inline-flex; overflow:hidden; height:1.3em; line-height:1.3em; position:relative; vertical-align:bottom; }
.roll i{ font-style:normal; display:block; }
.roll .r-old{ animation:rollUp .38s var(--easeout) both; }
.roll .r-new{ position:absolute; left:0; top:100%; animation:rollIn .38s var(--easeout) both; }
@keyframes rollUp{ to{ transform:translateY(-100%); } }
@keyframes rollIn{ from{ transform:translateY(-100%); } to{ transform:translateY(0); } }

/* ③ 侧栏选中滑块 */
#navPill{ position:absolute; left:8px; right:8px; border-radius:6px; background:var(--sel);
  z-index:0; pointer-events:none; opacity:0;
  transition:top .38s var(--spring), height .25s var(--spring), opacity .2s; }

/* ④ 来源树弹性折叠 */
.subwrap{ overflow:hidden; transition:max-height .42s var(--spring), opacity .28s ease; max-height:600px; opacity:1; }
.subwrap.fold{ max-height:0; opacity:0; }

/* ⑤ 分段 Tab 滑块（白色滑块弹簧滑动，按钮本底透明） */
.seg{ position:relative; }
.seg .slider{ position:absolute; top:2px; bottom:2px; border-radius:7px; background:var(--panel);
  box-shadow:0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04);
  transition:left .32s var(--spring), width .32s var(--spring); }
body.dark .seg .slider{ box-shadow:0 1px 3px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.08); }

/* ①②⑥⑦⑧ 卡片动效 */
.card.in{ animation:cardIn .5s var(--spring) both; }
@keyframes cardIn{ 0%{ opacity:0; transform:translateY(16px) scale(.965); } 62%{ opacity:1; transform:translateY(-2px) scale(1.004); } 100%{ opacity:1; transform:none; } }
.card.new{ animation:cardNew .55s var(--spring) both; }
@keyframes cardNew{ 0%{ opacity:0; transform:translateY(-20px) scale(.94); } 55%{ opacity:1; transform:translateY(3px) scale(1.012); } 100%{ opacity:1; transform:none; } }
.card.flash::after{ content:''; position:absolute; inset:0; border-radius:12px; pointer-events:none;
  animation:flashRing .9s var(--easeout) both; }
@keyframes flashRing{ 0%{ box-shadow:0 0 0 0 rgba(0,113,227,.4); } 100%{ box-shadow:0 0 0 14px rgba(0,113,227,0); } }
.card.pop{ animation:selPop .3s var(--spring); }
@keyframes selPop{ 0%{ transform:scale(.985); } 100%{ transform:scale(1); } }
.card.jelly{ animation:jelly .55s var(--spring); }
@keyframes jelly{ 0%{ transform:scale(1,1); } 28%{ transform:scale(1.035,.93); } 48%{ transform:scale(.975,1.035); } 68%{ transform:scale(1.012,.988); } 100%{ transform:scale(1,1); } }
.card.bye{ opacity:0!important; transform:translateX(64px) rotate(1.6deg)!important; max-height:0!important; margin-bottom:0!important;
  padding-top:0!important; padding-bottom:0!important; border-width:0!important;
  transition:all .34s cubic-bezier(.5,0,.75,.4); }
.cdot.morph{ animation:dotPop .45s var(--spring); }
@keyframes dotPop{ 0%{ transform:scale(.3); } 60%{ transform:scale(1.4); } 100%{ transform:scale(1); } }

/* ⑦ 步骤勾选：✓ 描画 + 删除线从左扫过 */
.step .ck svg{ position:absolute; inset:0; width:100%; height:100%; }
.step .ck svg polyline{ fill:none; stroke:#fff; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:16; stroke-dashoffset:0; }
.step.fx-done-on .ck svg polyline{ animation:drawIn .3s var(--easeout) .05s both; }
@keyframes drawIn{ from{ stroke-dashoffset:16; } to{ stroke-dashoffset:0; } }
.step .stext{ position:relative; width:fit-content; max-width:100%; }
.step .stext::after{ content:''; position:absolute; left:0; top:54%; height:1.5px; width:100%; background:var(--faint);
  transform:scaleX(0); transform-origin:0 50%; transition:transform .32s var(--easeout) .05s; }
.step.done .stext::after{ transform:scaleX(1); }
.step.fx-done-on .stext::after{ animation:sweepIn .34s var(--easeout) .05s both; }
@keyframes sweepIn{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
.step.stepin{ animation:rowIn .4s var(--spring) both; }
@keyframes rowIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

/* ⑩ 复制 morph（上下翻转出绿色已复制） */
.cp-morph{ position:relative; font-size:11px; color:var(--sub); padding:2px 8px; border-radius:5px; overflow:hidden; }
.cp-morph:hover{ background:var(--panel2); color:var(--ink); }
.cp-morph .l1,.cp-morph .l2{ display:block; transition:transform .28s var(--spring), opacity .2s; }
.cp-morph .l2{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--ok); font-weight:700; transform:translateY(120%); opacity:0; }
.cp-morph.ok .l1{ transform:translateY(-120%); opacity:0; }
.cp-morph.ok .l2{ transform:translateY(0); opacity:1; }
.okpop{ animation:okPop .4s var(--spring); }
@keyframes okPop{ 0%{ transform:scale(.6); } 60%{ transform:scale(1.25); } 100%{ transform:scale(1); } }

/* ⑪ 详情面板切换（选中变化时才播放，步骤刷新不打扰） */
.dwrap.panein{ animation:paneIn .34s var(--easeout); }
.fpanel.panein{ animation:paneIn .34s var(--easeout); }
@keyframes paneIn{ 0%{ opacity:0; transform:translateY(12px) scale(.99); filter:blur(3px); } 100%{ opacity:1; transform:none; filter:none; } }

/* ⑫ Toast 弹性出入场 */
.err.show{ display:flex; animation:toastIn .45s var(--spring); }
.err.hide{ animation:toastOut .3s ease both; }
@keyframes toastIn{ 0%{ opacity:0; transform:translate(-50%,26px) scale(.88); } 62%{ opacity:1; transform:translate(-50%,-3px) scale(1.015); } 100%{ opacity:1; transform:translate(-50%,0) scale(1); } }
@keyframes toastOut{ to{ opacity:0; transform:translate(-50%,16px) scale(.95); } }

/* ⑬ 深浅色圆形揭示 */
#veil{ position:fixed; inset:0; z-index:500; pointer-events:none; opacity:0; }

/* ⑭ 设置面板弹簧入场 + 分类切换淡化 + 分类滑块 */
#settingsScreen.open{ animation:panelIn .38s var(--spring); }
@keyframes panelIn{ 0%{ opacity:0; transform:scale(.965) translateY(10px); } 100%{ opacity:1; transform:none; } }
#ssPill{ position:absolute; left:0; right:0; border-radius:8px; background:var(--sel); z-index:0;
  pointer-events:none; opacity:0; transition:top .35s var(--spring), height .25s var(--spring), opacity .2s; }
#settingsScreen .ss-item{ position:relative; z-index:1; }
.ss-wrap.swapin{ animation:paneIn .3s var(--easeout); }

/* ⑮ AI 拆步 shimmer */
.dbtn.busy{ color:transparent!important; pointer-events:none; position:relative; overflow:hidden; }
.dbtn.busy::after{ content:'⏳ 拆解中…'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--sub); font-size:12px;
  background:linear-gradient(100deg,transparent 30%,rgba(125,90,255,.25) 50%,transparent 70%);
  background-size:220% 100%; animation:shimmer 1s linear infinite; }
@keyframes shimmer{ 0%{ background-position:120% 0; } 100%{ background-position:-120% 0; } }

/* ⑯ 空状态呼吸 + 快记果冻脉冲 */
.empty .big{ animation:floatY 3.2s ease-in-out infinite; }
@keyframes floatY{ 0%,100%{ transform:translateY(0) rotate(-2deg); } 50%{ transform:translateY(-7px) rotate(2deg); } }
.empty h2{ animation:rowIn .4s .05s var(--easeout) both; }
.empty .hint{ animation:rowIn .45s .16s var(--easeout) both; }
.quickadd.squish{ animation:squish .38s var(--spring); }
@keyframes squish{ 0%{ transform:scale(1); } 30%{ transform:scale(1.025,.92); } 60%{ transform:scale(.985,1.02); } 100%{ transform:scale(1); } }

/* 专注条形态切换滑入 */
.focusstrip.stripin{ animation:stripIn .45s var(--spring); }
@keyframes stripIn{ 0%{ opacity:0; transform:translateY(-10px) scale(.97); } 100%{ opacity:1; transform:none; } }

/* 系统开了「减弱动态效果」时全部降级为瞬时 */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
}
</style>

var state = { items: [], view: { t:'inbox' }, q: '', sel: 0, pane: { mode:'empty' },
  projOpen: {}, projOpen2: {}, snap: '', refocusStep: 0,
  fx: { flyIn:null, jelly:0, dotPop:0, stepFx:0, stepsIn:false, focusIn:false },
  lastPct: {}, paneKey: '', rollMem: {} };

function gid(id){ return document.getElementById(id); }
function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }
function escQ(s){ return esc(s).replace(/"/g,'&quot;'); }
/* ⑫ Toast：弹性弹起、走时滑落（旧版是瞬间闪现） */
function toast(m){
  var e=gid('err');
  e.textContent=m;
  e.classList.remove('show','hide'); void e.offsetWidth;
  e.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){
    e.classList.remove('show'); e.classList.add('hide');
    setTimeout(function(){ e.classList.remove('hide'); },320);
  },2400);
}
/* ⑨ 数字翻滚：值变化时旧数字上滚出、新数字落下（rollMem 跨重绘记住旧值） */
function rollTo(id, txt){
  var el=gid(id);
  var from=state.rollMem.hasOwnProperty(id)?state.rollMem[id]:(el?el.textContent:txt);
  state.rollMem[id]=txt;
  if(!el || String(from)===String(txt)) return;
  el.innerHTML='<span class="r-old">'+esc(from)+'</span><span class="r-new">'+esc(txt)+'</span>';
  el.classList.add('roll');
  setTimeout(function(){ el.textContent=txt; el.classList.remove('roll'); },420);
}
/* 右栏保存后的统一刷新（从 bindEntry 提升为全局，patchStatus 也要用） */
function refresh(p){ p.then(function(){ load(false); }).catch(function(e){ toast(e.message); }); }
/* ⑤⑥⑦⑧ 状态变更统一入口：状态点弹跳 / 完成果冻 / 专注条滑入 / 放弃侧滑退场 */
function patchStatus(it, st){
  var cardEl=document.querySelector('.card[data-id="'+it.id+'"]');
  state.fx.dotPop=it.id;
  if(st==='done') state.fx.jelly=it.id;
  if(st==='doing') state.fx.focusIn=true;
  if(st==='dropped' && cardEl && state.view.t!=='all'){
    // 非「全部记录」视图才侧滑退场；全部记录里放弃 = 原地变半透明
    cardEl.style.maxHeight=cardEl.offsetHeight+'px';
    void cardEl.offsetWidth;
    cardEl.classList.add('bye');
    setTimeout(function(){ refresh(api('PATCH','/api/suggestions/'+it.id,{status:st})); },380);
    return;
  }
  refresh(api('PATCH','/api/suggestions/'+it.id,{status:st}));
}
/* ⑤ 分段滑块定位（instant=true 首次摆放不做动画） */
function moveSeg(sliderId, btnSel, btn, instant){
  var sl=gid(sliderId); if(!sl) return;
  if(!btn){
    Array.prototype.forEach.call(document.querySelectorAll(btnSel),function(b){
      if(b.classList.contains('on')) btn=b;
    });
  }
  if(!btn) return;
  if(instant) sl.style.transition='none';
  sl.style.left=btn.offsetLeft+'px';
  sl.style.width=btn.offsetWidth+'px';
  if(instant){ void sl.offsetWidth; sl.style.transition=''; }
}
/* ③ 侧栏选中滑块跟随当前高亮行 */
function movePill(){
  var sc=document.querySelector('.side-scroll');
  var pill=gid('navPill');
  if(!sc||!pill) return;
  var on=sc.querySelector('.nav-item.on');
  if(!on){ pill.style.opacity='0'; return; }
  pill.style.opacity='1';
  pill.style.top=on.offsetTop+'px';
  pill.style.height=on.offsetHeight+'px';
}
window.addEventListener('resize', movePill);
/* 双运行时：打包成 App 时走 Tauri 原生命令；浏览器打开时走 HTTP（与旧版完全兼容） */
var TAPI = (window.__TAURI__ && window.__TAURI__.core) ? window.__TAURI__.core : null;
/* 诊断：脚本错误与关键事件写进纳言日志（nayan.log） */
window.addEventListener('error', function (e) {
  try { TAPI.invoke('js_log', { msg: 'JS错误: ' + e.message + ' @' + e.lineno }); } catch (_) {}
});
window.addEventListener('unhandledrejection', function (e) {
  try { TAPI.invoke('js_log', { msg: 'Promise拒绝: ' + String(e.reason) }); } catch (_) {}
});
try { TAPI.invoke('js_log', { msg: '页面脚本开始执行' }); } catch (_) {}
function api(method,url,body){
  if (TAPI) {
    return TAPI.invoke('api',{method:method,path:url,body:body||null}).catch(function(e){
      throw new Error(typeof e==='string'?e:((e&&e.message)||'未知错误'));
    });
  }
  var o={ method:method, headers:{'Content-Type':'application/json'} };
  if(body) o.body=JSON.stringify(body);
  return fetch(url,o).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if(!r.ok) throw new Error(d.error||('HTTP '+r.status));
      return d;
    });
  });
}
function load(silent, stagger){
  return api('GET','/api/suggestions').then(function(items){
    var snap=JSON.stringify(items);
    if(silent && snap===state.snap) return;      // 数据没变不重绘
    // 正在详情/表单里打字时跳过这轮自动刷新，4 秒后会再试
    var a=document.activeElement;
    if(silent && a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.isContentEditable) &&
       gid('detail').contains(a)) return;
    // ② 自动刷新发现新条目 → 让它飞进来（⌥⇧S / 剪贴板 / MCP 新收录都有入场感）
    if(silent && state.items.length){
      var known={}; state.items.forEach(function(x){ known[x.id]=1; });
      var fresh=items.filter(function(x){ return !known[x.id]; }).map(function(x){ return x.id; });
      if(fresh.length) state.fx.flyIn=fresh;
    }
    state.snap=snap; state.items=items; renderAll(!!stagger);
  }).catch(function(e){ if(!silent) toast(e.message); });
}
function kindOf(it){ return it.kind||'suggestion'; }
function todayKey(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function pad2(n){ return (n<10?'0':'')+n; }
function dayKey(s){ return String(s||'').slice(0,10); }
function dayLabel(key){
  var d=new Date();
  var tk=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  if(key===tk) return '今天';
  var y=new Date(d.getTime()-86400000);
  var yk=y.getFullYear()+'-'+pad2(y.getMonth()+1)+'-'+pad2(y.getDate());
  if(key===yk) return '昨天';
  var p=key.split('-');
  return Number(p[1])+'月'+Number(p[2])+'日';
}
function fmtDateTime(s){
  var k=dayKey(s), t=String(s||'').slice(11,16);
  return dayLabel(k)+(t?' · '+t:'');
}
function projOf(it){ return (it.workspace||'').trim(); }
function toolName(it){ return TOOL_LABEL[it.source_tool]||it.source_tool||'其他'; }
function findItem(id){ return state.items.filter(function(x){ return x.id===id; })[0] || null; }
function findStep(stepId){
  for (var i=0;i<state.items.length;i++){
    var ss=state.items[i].steps||[];
    for (var j=0;j<ss.length;j++) if(ss[j].id===stepId) return ss[j];
  }
  return null;
}
function looksCmd(t){
  t=String(t||'').trim();
  if(!t) return false;
  if(/^[$>]\s/.test(t)) return true;
  return /^(sudo|brew|port|cd|ls|npm|npx|pnpm|yarn|node|python3?|pip3?|apt|apt-get|git|curl|wget|docker|ssh|scp|mkdir|touch|rm|mv|cp|tar|zip|unzip|chmod|chown|source|export|open|defaults|launchctl|codesign|xcode-select|conda|cargo|go|echo|cat|df|du|ps|kill|which|ln|find|grep|sed|awk|make|cmake|systemctl|ufw|nano|vim|vi|less)\b/.test(t);
}
function viewTitle(v){
  if(v.t==='all') return '全部记录';
  if(v.t==='inbox') return '收件箱';
  if(v.t==='today') return '今天';
  if(v.t==='kind') return KIND_NAME[v.kind]||'';
  if(v.t==='tool') return (TOOL_LABEL[v.tool]||v.tool);
  if(v.t==='session') return sessLabel(v.session||'');
  return '';
}
function visibleItems(){
  var q=state.q.toLowerCase(); var v=state.view;
  return state.items.filter(function(it){
    if(v.t==='inbox' && it.status!=='inbox') return false;
    if(v.t==='today' && dayKey(it.created_at)!==todayKey()) return false;
    if(v.t==='kind' && kindOf(it)!==v.kind) return false;
    if(v.t==='tool' && (it.source_tool||'other')!==v.tool) return false;
    if(v.t==='session' && ((it.source_tool||'other')!==v.tool || (it.session_ref||'')!==v.session)) return false;
    if(q){
      var hay=((it.title||'')+' '+(it.quote||'')+' '+(it.my_note||'')+' '+(it.user_msg||'')).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
}
function renderAll(stagger){ renderNav(); renderList(stagger); renderFocus(); renderReset(); renderDetail(); }

/* ---------- 侧栏：计数 + 项目树 ---------- */
function bubbleSvg(){ return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.5-8.5 8.38 8.38 0 0 1 8.5 8.5z"/></svg>'; }
function folderSvg(){ return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>'; }
function chevRSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>'; }
function docSvg(){ return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'; }
function lastSeg(p){ var s=String(p||'').replace(/\/+$/,''); var i=s.lastIndexOf('/'); return i>=0? s.slice(i+1) : s; }
function sessLabel(sr){ return String(sr||'').replace(/^窗口：/,'').trim()||'未命名会话'; }
function fillToolIcons(){
  if(!TAPI) return;
  var names={};
  state.items.forEach(function(it){ var t=it.source_tool||'other'; if(!names[t]) names[t]=1; });
  Object.keys(names).forEach(function(t){
    var key='nayan-ic-'+t;
    var b64=null; try{ b64=localStorage.getItem(key); }catch(e){}
    if(b64){ paintIcon(t,b64); return; }
    TAPI.invoke('app_icon',{name:t}).then(function(d){
      if(!d) return;
      try{ localStorage.setItem(key,d); }catch(e){}
      paintIcon(t,d);
    }).catch(function(){});
  });
}
function paintIcon(tool,d){
  Array.prototype.forEach.call(document.querySelectorAll('[data-ic-tool]'),function(el){
    if(el.getAttribute('data-ic-tool')!==tool) return;
    el.innerHTML='<img src="'+d+'" style="width:15px;height:15px;border-radius:4px;display:block" alt="">';
  });
}

function renderNav(){
  var c={ all:state.items.length, inbox:0, today:0, suggestion:0, idle:0 };
  var tk=todayKey();
  state.items.forEach(function(it){
    if(it.status==='inbox') c.inbox++;
    if(dayKey(it.created_at)===tk) c.today++;
    c[kindOf(it)]++;
  });
  rollTo('cnt-inbox', c.inbox);
  rollTo('cnt-today', c.today);
  rollTo('cnt-all', c.all);
  rollTo('cnt-suggestion', c.suggestion||'');
  rollTo('cnt-idle', c.idle||'');

  var v=state.view;
  Array.prototype.forEach.call(document.querySelectorAll('.nav-item[data-view]'),function(el){
    el.classList.toggle('on', el.getAttribute('data-view')===v.t);
  });
  Array.prototype.forEach.call(document.querySelectorAll('.nav-item[data-kind]'),function(el){
    el.classList.toggle('on', v.t==='kind' && el.getAttribute('data-kind')===v.kind);
  });

  // 来源树：来源软件 → 会话窗口（目录不再是导航维度，只在卡片右侧显示）
  var tools={}, torder=[];
  state.items.forEach(function(it){
    var t=it.source_tool||'other';
    if(tools[t]==null){ tools[t]={ count:0, sess:{}, sorder:[] }; torder.push(t); }
    tools[t].count++;
    var sr=it.session_ref||'';
    if(sr.indexOf('窗口：')===0 && sr.length>3){
      if(tools[t].sess[sr]==null){ tools[t].sess[sr]={ n:0, ws:'' }; tools[t].sorder.push(sr); }
      tools[t].sess[sr].n++;
      var w=projOf(it);
      if(w && !tools[t].sess[sr].ws) tools[t].sess[sr].ws=w;
    }
  });
  torder.sort(function(a,b){ return tools[b].count - tools[a].count; });
  var h='';
  torder.forEach(function(t){
    var tg=tools[t];
    var tOpen=state.projOpen2['T|'+t]!==false;
    var tSel=(v.t==='tool'&&v.tool===t)||(v.t==='session'&&v.tool===t);
    var hasS=tg.sorder.length>=2; // 单会话时来源行即代表，不再展开重名的第三行
    h+='<div class="nav-item tool'+(tSel?' on':'')+'" data-tool="'+escQ(t)+'">'+
      (hasS?'<span class="pchev'+(tOpen?' open':'')+'" data-tgl2="T|'+escQ(t)+'">'+chevRSvg()+'</span>':'<span class="pchev"></span>')+
      '<span class="icw" data-ic-tool="'+escQ(t)+'">'+bubbleSvg()+'</span>'+
      '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(TOOL_LABEL[t]||t)+'</span>'+
      '<span class="cnt">'+tg.count+'</span></div>';
    if(tOpen){
      tg.sorder.sort(function(a,b){ return tools[t].sess[b].n - tools[t].sess[a].n; });
      h+='<div class="subwrap" data-sw="T|'+escQ(t)+'">';
      tg.sorder.forEach(function(sr){
        var se=tools[t].sess[sr];
        var sSel=(v.t==='session'&&v.tool===t&&v.session===sr);
        h+='<div class="nav-item sub2'+(sSel?' on':'')+'" data-tool="'+escQ(t)+'" data-session="'+escQ(sr)+'">'+
          '<span class="pchev"></span>'+
          '<span class="icw">'+docSvg()+'</span>'+
          '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(sessLabel(sr))+'</span>'+
          (se.ws?'<span style="color:var(--sub);font-size:11px;flex-shrink:0" title="'+escQ(se.ws)+'">📁 '+esc(lastSeg(se.ws))+'</span>':'')+
          '<span class="cnt">'+se.n+'</span></div>';
      });
      h+='</div>';
    }
  });
    if(!torder.length) h='<div class="side-empty">还没有来源——用 ⌥S/⌥Z 捕获后自动出现</div>';
  gid('projList').innerHTML=h;
  fillToolIcons();
  Array.prototype.forEach.call(gid('projList').querySelectorAll('.nav-item'),function(el){
    el.onclick=function(ev){
      var p=el.getAttribute('data-proj');
      var tgl=ev.target.closest?ev.target.closest('[data-tgl]'):null;
      if(tgl){ state.projOpen[p]=state.projOpen[p]===false; renderNav(); return; }
      var tgl2=ev.target.closest?ev.target.closest('[data-tgl2]'):null;
      if(tgl2){
        var k2=tgl2.getAttribute('data-tgl2');
        var willOpen=state.projOpen2[k2]===false;
        state.projOpen2[k2]=willOpen;
        if(willOpen){
          renderNav(); movePill();
          var sw2=null;
          Array.prototype.forEach.call(document.querySelectorAll('.subwrap'),function(x){
            if(x.getAttribute('data-sw')===k2) sw2=x;
          });
          if(sw2){ sw2.classList.add('fold'); void sw2.offsetWidth; sw2.classList.remove('fold'); }
          return;
        }
        // ④ 收起：先弹性塌合再重绘，展开则直接重绘（新行从 max-height 0 弹开）
        var sw=null;
        Array.prototype.forEach.call(document.querySelectorAll('.subwrap'),function(x){
          if(x.getAttribute('data-sw')===k2) sw=x;
        });
        if(sw){
          sw.style.maxHeight=sw.scrollHeight+'px';
          void sw.offsetWidth;
          sw.classList.add('fold');
          setTimeout(function(){ renderNav(); movePill(); },430);
        } else { renderNav(); movePill(); }
        return;
      }
      var sr=el.getAttribute('data-session');
      if(sr!=null){ state.view={ t:'session', tool:el.getAttribute('data-tool'), session:sr }; renderAll(true); return; }
      state.view = { t:'tool', tool:el.getAttribute('data-tool') };
      renderAll(true);
    };
  });

  // 项目 datalist（新建表单用）
  var dl='';
  var wsSet={};
  state.items.forEach(function(it){ var w=projOf(it); if(w) wsSet[w]=1; });
  Object.keys(wsSet).forEach(function(p){ dl+='<option value="'+escQ(p)+'">'; });
  gid('projOptions').innerHTML=dl;

  gid('vtitle').textContent=viewTitle(v);
  var n=visibleItems().length;
  var wk=['日','一','二','三','四','五','六'][new Date().getDay()];
  rollTo('vcount', n?n+' 条':'');
  gid('vsub').textContent=(new Date().getMonth()+1)+'月'+new Date().getDate()+'日 周'+wk;
  movePill();
}

/* ---------- 中列列表 ---------- */
function card(it, animCls, animDelay){
  var sel=state.sel===it.id?' sel':'';
  var steps=it.steps||[];
  var meta=[];
  meta.push('<span class="tchip">'+esc(toolName(it))+'</span>');
  if(KIND_TAG[kindOf(it)]) meta.push('<span class="ktag">'+KIND_TAG[kindOf(it)]+'</span>');
  if(steps.length){
    var dn=steps.filter(function(s){ return s.done; }).length;
    meta.push('<span class="okn">✓ '+dn+'/'+steps.length+'</span>');
  }
  meta.push('<span class="grow"></span>');
  meta.push('<span>'+esc(String(it.created_at||'').slice(11,16))+'</span>');
  // ⑥ 刚改过状态的卡片圆点弹跳变色；⑦ 刚完成的卡片果冻一下
  var dotCls='cdot s-'+it.status+(state.fx.dotPop===it.id?' morph':'');
  var jellyCls=state.fx.jelly===it.id?' jelly':'';
  return '<div class="card '+it.status+sel+jellyCls+(animCls?' '+animCls:'')+'" data-id="'+it.id+'"'+
    (animDelay?' style="animation-delay:'+animDelay+'ms"':'')+'>'+
    '<div class="ctitle"><span class="'+dotCls+'" title="'+STATUS_LABEL[it.status]+'"></span>'+
    '<span style="flex:1">'+esc(it.title)+'</span></div>'+
    '<div class="cmeta">'+meta.join('')+'</div>'+
    '</div>';
}
function renderList(stagger){
  var items=visibleItems().slice().sort(function(a,b){ return b.id-a.id; });
  var list=gid('list');
  rollTo('vcount', items.length?items.length+' 条':'');
  // ② 本轮要飞入的新条目
  var fly={};
  if(state.fx.flyIn){ state.fx.flyIn.forEach(function(id){ fly[id]=1; }); }
  state.fx.flyIn=null;
  if(!items.length){
    var allEmpty=!state.items.length;
    list.innerHTML='<div class="empty">'+
      '<div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></div>'+
      (allEmpty?'<h2>箱子是空的</h2><div class="hint">选中文字按 <kbd>⌥⇧S</kbd> 一键收进来<br>或者对 AI 说「<b>记到收件箱</b>」 · 也可以在上面输入框直接记</div>'
               :'<h2>这里没有内容</h2><div class="hint">换个视图或搜索词试试</div>')+
      '</div>';
    state.fx.jelly=0; state.fx.dotPop=0;
    return;
  }
  var html='', cur=null, buf=[], di=0, idx=0;
  function flush(){
    if(cur===null) return;
    // ① 日期头与卡片依次弹起
    html+='<div class="datehead"'+(stagger?' style="animation:rowIn .4s '+(di*40)+'ms var(--easeout) both"':'')+'><b>'+dayLabel(cur)+'</b><span>'+buf.length+' 条</span></div>'+
          buf.map(function(it){
            var extra='', delay=0;
            if(fly[it.id]){ extra='new flash'; }
            else if(stagger && idx<14){ extra='in'; delay=Math.min(430,idx*36)+(idx%3)*18; }
            idx++;
            return card(it, extra, delay);
          }).join('');
  }
  items.forEach(function(it){
    var k=dayKey(it.created_at);
    if(k!==cur){ flush(); cur=k; buf=[]; }
    buf.push(it);
  });
  flush();
  list.innerHTML=html;
  state.fx.jelly=0; state.fx.dotPop=0;
  Array.prototype.forEach.call(list.querySelectorAll('.card'),function(el){
    el.onclick=function(){
      state.sel=Number(el.getAttribute('data-id'));
      state.pane={ mode:'entry' };
      Array.prototype.forEach.call(list.querySelectorAll('.card'),function(c){
        var on=Number(c.getAttribute('data-id'))===state.sel;
        c.classList.toggle('sel', on);
        c.classList.remove('pop');
        if(on){ void c.offsetWidth; c.classList.add('pop'); }
      });
      renderDetail();
    };
  });
}

/* ---------- 今日专注条 / 闲时重置条 ---------- */
function renderFocus(){
  var doing=null, todos=[];
  state.items.forEach(function(it){
    if(it.status==='doing'&&!doing) doing=it;
    if(it.status==='todo') todos.push(it);
  });
  todos.sort(function(a,b){ return a.id-b.id; });
  var box=gid('focusStrip');
  if(doing){
    var steps=doing.steps||[];
    var done=steps.filter(function(s){ return s.done; }).length;
    box.style.display='flex';
    box.className='focusstrip'+(state.fx.focusIn?' stripin':'');
    state.fx.focusIn=false;
    box.innerHTML=
      '<span class="fdot"></span><span class="ftitle">'+esc(doing.title)+'</span>'+
      (steps.length?'<span class="fprog" id="fprog"></span>':'')+
      '<span class="fgrow"></span>'+
      '<button class="fbtn" data-fact="done">✓ 完成</button>'+
      '<button class="fbtn" data-fact="todo">放回</button>';
    if(steps.length) rollTo('fprog', done+'/'+steps.length+' 步');
    box.onclick=function(ev){
      var b=ev.target.closest?ev.target.closest('[data-fact]'):null;
      if(!b) return;
      patchStatus(doing, b.getAttribute('data-fact'));
    };
  } else if(todos.length && !state.q){
    box.style.display='flex';
    box.className='focusstrip quiet'+(state.fx.focusIn?' stripin':'');
    state.fx.focusIn=false;
    box.innerHTML=
      '<span class="ftitle">下一件事：'+esc(todos[0].title)+'</span>'+
      '<span class="fgrow"></span>'+
      '<button class="fbtn" data-fact="start">▶ 开始专注</button>';
    box.onclick=function(){
      patchStatus(todos[0], 'doing');
    };
  } else {
    box.style.display='none';
  }
}
function daysLeft(){
  try{
    var d=localStorage.getItem('inbox-reset-date');
    if(!d) return null;
    var ms=new Date(d+'T23:59:59')-new Date();
    return Math.max(0, Math.ceil(ms/86400000));
  }catch(e){ return null; }
}
function renderReset(){
  var idleView = state.view.t==='kind' && state.view.kind==='idle';
  var bar=gid('resetBar');
  bar.classList.toggle('show', idleView);
  if(!idleView) return;
  var n=daysLeft();
  gid('resetDays').innerHTML = n===null ? '<i style="color:var(--faint)">先设个重置日</i>'
    : '⏳ 还有 <span class="days">'+n+'</span> 天';
}
gid('resetDate').addEventListener('change',function(){
  try{ localStorage.setItem('inbox-reset-date', gid('resetDate').value); }catch(e){}
  renderReset();
});

function stepsBlock(it){
  var steps=it.steps||[];
  var done=steps.filter(function(s){ return s.done; }).length;
  var h='<div class="dblock"><div class="dlabel">执行步骤'+(steps.length?' · <span id="stepCnt">'+done+'/'+steps.length+'</span>':'')+
    '<span class="grow" style="float:right;font-weight:400">结果贴回给 AI 判断对错</span></div>';
  if(steps.length){
    var pct=Math.round(done*100/steps.length);
    h+='<div class="steps"><div class="sprogress"><span id="sprogTxt">'+done+'/'+steps.length+' 步</span><div class="bar"><i id="sprogBar" style="width:'+pct+'%"></i></div></div>'+
      steps.map(function(s,i){ return stepRow(s,i); }).join('')+
      '<div class="sadd"><input placeholder="自己加一步…" data-add="'+it.id+'"><button class="dbtn" data-act="addstep">＋ 加一步</button></div></div>';
  } else {
    h+='<div class="dta" style="min-height:0;padding:8px 12px;color:var(--faint);font-size:12px;background:transparent;border-style:dashed">还没有步骤 · 用下面的「按行拆步 / AI 拆步」把原文拆成可执行的清单</div>';
  }
  return h+'</div>';
}
function stepRow(s,idx){
  // ⑦ 刚勾完的那步播 ✓ 描画 + 删除线扫过；⑮ AI 拆步后整单逐条弹入
  var fxDone=state.fx.stepFx===s.id && s.done;
  return '<div class="step'+(s.done?' done':'')+(fxDone?' fx-done-on':'')+(state.fx.stepsIn?' stepin':'')+'" data-step="'+s.id+'"'+
    (state.fx.stepsIn?' style="animation-delay:'+idx*90+'ms"':'')+'>'+
    '<span class="ck" data-act="toggle" title="做完点这里">'+(s.done?'<svg viewBox="0 0 16 16"><polyline points="3.5 8.5 6.8 11.5 12.5 4.5"/></svg>':'')+'</span>'+
    '<span class="sidx">'+(idx+1)+'.</span>'+
    '<div class="smain"><span class="stext'+(s.is_cmd?' cmd':'')+'">'+esc(s.content)+'</span>'+
    '<input class="sresult" data-act="result" value="'+escQ(s.result||'')+'" placeholder="执行结果 / AI 检查结论…（⏎ 保存，自动跳下一条）"></div>'+
    '<button class="cp" data-act="copystep" title="复制这条">⧉</button>'+
    '<button class="cp" data-act="delstep" title="删除这一步">✕</button>'+
    '</div>';
}
function sessionLink(it){
  var sr=String(it.session_ref||'');
  if(!sr) return '';
  var i=sr.indexOf(' | ');
  var st=i>0?sr.slice(0,i):sr, su=i>0?sr.slice(i+3):'';
  if(su.indexOf('http')===0) return '<a href="'+escQ(su)+'" target="_blank">在来源中查看 ↗</a>';
  if(sr.indexOf('窗口：')===0) return '<span class="mchip">🪟 '+esc(sr.slice(3))+'</span><button class="mchip" data-act="jumps" title="回到来源窗口">↩ 回到来源</button>';
  return '<span class="mchip">🔗 '+esc(sr)+'</span>';
}

function nextStepIdAfter(it, stepId){
  var ss=it.steps||[];
  for(var i=0;i<ss.length;i++) if(ss[i].id===stepId) return ss[i+1]?ss[i+1].id:0;
  return 0;
}
function bindEntry(it){
  var box=gid('detail');
  var tEl=gid('dtitle');
  tEl.addEventListener('keydown',function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); tEl.blur(); } });
  tEl.addEventListener('blur',function(){
    var v=tEl.textContent.trim();
    if(v && v!==it.title) refresh(api('PATCH','/api/suggestions/'+it.id,{title:v}));
  });
  // ⑤ 状态 Tab：滑块先弹簧滑过去，后台再发请求
  Array.prototype.forEach.call(box.querySelectorAll('#segStatus button'),function(b){
    b.onclick=function(){
      moveSeg('segSlider', null, b, false);
      patchStatus(it, b.getAttribute('data-st'));
    };
  });
  moveSeg('segSlider', '#segStatus button', null, true);
  [['d-usermsg','user_msg'],['d-note','my_note']].forEach(function(pair){
    var el=gid(pair[0]);
    el.addEventListener('keydown',function(ev){
      if(ev.key==='Enter' && (ev.metaKey||ev.ctrlKey)) el.blur();
    });
    el.addEventListener('blur',function(){
      if(el.value!==(it[pair[1]]||'')) refresh(api('PATCH','/api/suggestions/'+it.id,(pair[1]==='user_msg'?{user_msg:el.value}:{my_note:el.value})));
    });
  });
  Array.prototype.forEach.call(box.querySelectorAll('[data-act]'),function(btn){
    btn.onclick=function(ev){
      var act=btn.getAttribute('data-act');
      if(act==='copyquote'){
        navigator.clipboard.writeText(it.quote||'').then(function(){
          btn.classList.add('ok');
          setTimeout(function(){ btn.classList.remove('ok'); },1100);
        });
        return;
      }
      var stepEl=btn.closest?btn.closest('.step'):null;
      var step=stepEl?findStep(Number(stepEl.getAttribute('data-step'))):null;
      if(act==='jumps'){
        if(!TAPI){ toast('仅桌面 App 支持'); return; }
        toast('正在切到来源窗口…');
        TAPI.invoke('jump_to_source',{sessionRef:it.session_ref||'',sourceTool:it.source_tool||''})
          .then(function(r){ toast('✓ 已切到来源窗口'); })
          .catch(function(e){ toast('✗ '+(e.message||'来源没找到')); });
        return;
      }
      if(act==='toggle'&&step){
        // ⑦ 勾上才播描画动画；重绘后该行带 fx-done-on 重放一次
        state.fx.stepFx=step.done?0:step.id;
        refresh(api('PATCH','/api/steps/'+step.id,{done:!step.done}));
      }
      else if(act==='copystep'&&step){
        navigator.clipboard.writeText(step.content).then(function(){
          btn.textContent='✓'; btn.classList.add('okpop');
          setTimeout(function(){ btn.textContent='⧉'; btn.classList.remove('okpop'); },900);
        });
      }
      else if(act==='delstep'&&step){ refresh(api('DELETE','/api/steps/'+step.id)); }
      else if(act==='addstep'){
        var input=box.querySelector('.sadd input[data-add="'+it.id+'"]');
        var v=(input&&input.value||'').trim();
        if(!v) return;
        input.value='';
        refresh(api('POST','/api/suggestions/'+it.id+'/steps',{mode:'append',steps:[{content:v,is_cmd:looksCmd(v)}]}));
      }
      else if(act==='linesplit'){
        var lines=String(it.quote||'').split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
        if(lines.length<2){ toast('原文不足两行，试试 AI 拆步'); return; }
        refresh(api('POST','/api/suggestions/'+it.id+'/steps',{steps:lines.map(function(l){ return {content:l,is_cmd:looksCmd(l)}; })}));
      }
      else if(act==='aisplit'){
        // ⑮ 按钮 label 沉降 + 流光 shimmer，拆完步骤逐条弹入
        btn.disabled=true; btn.classList.add('busy'); aiBusy=true;
        api('POST','/api/ai/split/'+it.id).then(function(){
          aiBusy=false; state.fx.stepsIn=true; load(false);
        }).catch(function(e){
          aiBusy=false; toast(e.message); btn.disabled=false; btn.classList.remove('busy');
        });
      }
      else if(act==='del'){
        // ⑧ 删除：卡片先侧滑塌合，再发请求
        var delCard=document.querySelector('.card[data-id="'+it.id+'"]');
        state.sel=0; state.pane={mode:'empty'};
        if(delCard){
          delCard.style.maxHeight=delCard.offsetHeight+'px';
          void delCard.offsetWidth;
          delCard.classList.add('bye');
          setTimeout(function(){ refresh(api('DELETE','/api/suggestions/'+it.id)); },340);
        } else { refresh(api('DELETE','/api/suggestions/'+it.id)); }
      }
      else if(act==='inbox'){ patchStatus(it,'inbox'); }
      else if(act==='dropped'){ patchStatus(it,'dropped'); }
    };
  });
  // 执行结果：⏎ 保存并跳下一步，失焦也保存
  Array.prototype.forEach.call(box.querySelectorAll('.sresult'),function(input){
    var stepEl=input.closest('.step');
    var stepId=Number(stepEl.getAttribute('data-step'));
    function save(){
      var step=findStep(stepId); if(!step) return;
      var v=input.value.trim();
      if(v===(step.result||'')) return;
      state.refocusStep=nextStepIdAfter(it, stepId);
      api('PATCH','/api/steps/'+stepId,{result:v}).then(function(){ load(false); })
        .catch(function(e){ toast(e.message); });
    }
    input.addEventListener('keydown',function(ev){
      if(ev.key==='Enter'){ ev.preventDefault(); input.blur(); }
    });
    input.addEventListener('blur',save);
  });
  // 保存结果后焦点跳到下一步的结果框（贴结果→执行→再贴 的循环）
  if(state.refocusStep){
    var el=box.querySelector('.step[data-step="'+state.refocusStep+'"] .sresult');
    state.refocusStep=0;
    if(el){ el.focus(); var L=el.value.length; try{ el.setSelectionRange(L,L); }catch(e){} }
  }
}

      title:t,

      load(false);
    }).catch(function(err){ toast(err.message); });
  });
  gid('f-title').focus();
}

      '<div class="ss-row"><div class="grow"><b>源码与反馈</b><div class="hint">GitHub 开源仓库</div></div><a href="https://github.com/joey08121112-web/nayan" target="_blank">github.com/joey08121112-web/nayan ↗</a></div>'+
    '</div>'+
    '<div class="ss-group">'+
      '<div class="ss-row"><div class="grow"><b>快捷键备忘</b><div class="hint">⌥S 划词捕获 · ⌥Z 框选捕获 · ⌘, 打开本设置</div></div></div>'+
    '</div>';
}

/* ---------- 设置全屏（System Settings 式） ---------- */
var ssCat='general';
var ssJustOpened=false;
function ssSetCat(c){
  try { TAPI.invoke('js_log', { msg: '[设置] 切换分类 → ' + c }); } catch (_) {}
  ssCat=c;
  ssRender();
}
function openSettings(){
  try { TAPI.invoke('js_log', { msg: '[设置] 打开设置页' }); } catch (_) {}
  ssJustOpened=true;
  gid('settingsScreen').classList.add('open');
  ssRender();
}
function closeSettings(){ gid('settingsScreen').classList.remove('open'); }
function toggleSettings(){
  gid('settingsScreen').classList.contains('open') ? closeSettings() : openSettings();
}
function ssRender(){
  Array.prototype.forEach.call(document.querySelectorAll('#settingsScreen .ss-item'),function(el){
    el.classList.toggle('on', el.getAttribute('data-ss')===ssCat);
  });
  // ⑭ 分类滑块：打开时先无动画摆到位，之后切换才弹簧滑动
  var pill=gid('ssPill');
  var onItem=document.querySelector('#settingsScreen .ss-item.on');
  if(pill && onItem){
    if(ssJustOpened){
      pill.style.transition='none';
      pill.style.top=onItem.offsetTop+'px';
      pill.style.height=onItem.offsetHeight+'px';
      void pill.offsetWidth;
      pill.style.transition='';
      pill.style.opacity='1';
      ssJustOpened=false;
    } else {
      pill.style.opacity='1';
      pill.style.top=onItem.offsetTop+'px';
      pill.style.height=onItem.offsetHeight+'px';
    }
  }
  // ⑭ 分类内容交叉淡化
  var c=gid('ssContent');
  c.classList.remove('swapin'); void c.offsetWidth; c.classList.add('swapin');
  if(ssCat==='general'){ c.innerHTML=generalHTML(); bindGeneral(); }
  else if(ssCat==='capture'){ c.innerHTML=captureHTML(); bindCapture(); }
  else if(ssCat==='ai'){ c.innerHTML=aiHTML(); bindAI(); }
  else if(ssCat==='about'){ c.innerHTML=aboutHTML(); fillVersion(); }
}
function fillVersion(){
  try {
    if (window.__TAURI__ && window.__TAURI__.app) {
      window.__TAURI__.app.getVersion().then(function(v){ var e=gid('ss-ver'); if(e) e.textContent='v'+v; });
    }
  } catch(e){}
}

function syncSeg(){
  var v=gid('s-provider').value;
  var onBtn=null;
  Array.prototype.forEach.call(document.querySelectorAll('#segProvider button'),function(b){
    var on=b.getAttribute('data-v')===v;
    b.classList.toggle('on', on);
    if(on) onBtn=b;
  });
  if(onBtn){
    var sl=gid('segProvSlider');
    // 首次摆放（还没定位过）不做动画；之后跟随切换弹簧滑动
    moveSeg('segProvSlider', null, onBtn, !(sl && sl.style.left));
  }
}
/* ---------- 设置分类绑定（按当前分类只绑自己的元素） ---------- */
function bindSettings(){
  bindGeneral(); bindCapture(); bindAI();
}
function bindGeneral(){
  if(!TAPI || !gid('s-autostart')) return;
  TAPI.invoke('autostart_status').then(function(v){ gid('s-autostart').checked=v; }).catch(function(){});
  gid('s-autostart').onchange=function(){
    TAPI.invoke('autostart_toggle').then(function(v){ gid('s-autostart').checked=v; toast(v?'已开启开机自启':'已关闭开机自启'); })
      .catch(function(e){ gid('s-autostart').checked=false; toast(e.message||String(e)); });
  };
  TAPI.invoke('perm_status').then(function(p){
    function row(ok,label,why,type){
      return '<div class="ss-row" style="border-bottom:none;padding:8px 0">'+
        '<div class="grow"><b>'+(ok?'✓ ':'⚠︎ ')+label+'</b><div class="hint">'+why+'</div></div>'+
        (ok?'<span style="color:#34c759;font-size:12.5px">已授权</span>'
           :'<button type="button" class="sec" data-perm="'+type+'">去授权</button>')+
        '</div>';
    }
    gid('permRows').innerHTML=row(p.ax,'辅助功能','划词直读 / 框选需要','ax')+
      row(p.screen,'屏幕录制','像素识别需要','screen');
    Array.prototype.forEach.call(gid('permRows').querySelectorAll('[data-perm]'),function(b){
      b.onclick=function(){
        TAPI.invoke(b.getAttribute('data-perm')==='ax'?'open_ax_settings':'open_screen_settings')
          .catch(function(e){ toast(e.message||String(e)); });
      };
    });
  }).catch(function(){});
}
function renderClipApps(list){
  window.__clipApps=(list||[]);
  var el=gid('clipApps'); if(!el) return;
  el.innerHTML=(list||[]).map(function(n){
    return '<span style="display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--hair);border-radius:999px;padding:3px 10px;font-size:12.5px">'+esc(n)+
      '<button type="button" data-app="'+escQ(n)+'" style="border:none;background:none;cursor:pointer;color:var(--sub);font-size:13px;padding:0;line-height:1">✕</button></span>';
  }).join('')||'<span class="hint">暂无——用 ⌥S 捕获过的 App 会自动加入</span>';
  Array.prototype.forEach.call(el.querySelectorAll('[data-app]'),function(b){
    b.onclick=function(){
      var name=b.getAttribute('data-app');
      var cur=(window.__clipApps||[]).filter(function(x){return x!==name;});
      api('POST','/api/settings',{clip_apps:cur}).then(function(){ renderClipApps(cur); }).catch(function(e){ toast(e.message); });
    };
  });
}
function bindCapture(){
  loadSettings();
  Array.prototype.forEach.call([1,2],function(slot){
    var btn=gid('hk-set-'+slot); if(!btn) return;
    var span=gid('hk-'+slot);
    btn.onclick=function(){
      btn.disabled=true; span.textContent='按下新快捷键…';
      TAPI.invoke('hotkey_capture_start',{slot:slot}).catch(function(){});
      var tries=0;
      var poll=function(){
        tries++;
        TAPI.invoke('hotkey_take',{slot:slot}).then(function(r){
          if(r.state==='waiting'){ if(tries<24){ setTimeout(poll,250); return; } }
          if(r.state==='ok'){ toast('✓ 快捷键已改为 '+fmtHotkey(r.combo)); }
          else if(r.state==='error'){ toast('✗ '+r.error); }
          else if(r.state==='cancelled'){ toast('已取消'); }
          btn.disabled=false; loadSettings();
        }).catch(function(){ btn.disabled=false; loadSettings(); });
      };
      setTimeout(poll,300);
    };
  });
  gid('s-clip-scope').onchange=function(){
    api('POST','/api/settings',{clip_scope:gid('s-clip-scope').value}).then(function(){ toast('监听范围已更新'); }).catch(function(e){ toast(e.message); });
  };
  gid('s-clip-addbtn').onclick=function(){
    var v=gid('s-clip-add').value.trim(); if(!v) return;
    var cur=window.__clipApps||[];
    if(cur.some(function(x){return x===v;})){ gid('s-clip-add').value=''; return; }
    api('POST','/api/settings',{clip_apps:cur.concat([v])}).then(function(){ gid('s-clip-add').value=''; loadSettings(); }).catch(function(e){ toast(e.message); });
  };
  gid('s-clip').onchange=function(){
    api('POST','/api/settings',{clipboard_watch:gid('s-clip').checked})
      .then(function(){ toast(gid('s-clip').checked?'剪贴板监听已开启':'剪贴板监听已关闭'); })
      .catch(function(e){ toast(e.message); });
  };
}
function bindAI(){
  if(!gid('s-provider')) return;
  loadSettings();
  Array.prototype.forEach.call(document.querySelectorAll('#segProvider button'),function(b){
    b.onclick=function(){
      gid('s-provider').value=b.getAttribute('data-v');
      moveSeg('segProvSlider', null, b, false);
      onProviderChange(); syncSeg();
    };
  });
  gid('saveSet').onclick=saveSettings;
  gid('testSet').onclick=testSettings;
}
function loadSettings(){
  api('GET','/api/settings').then(function(s){
    gid('s-provider').value=s.provider;
    gid('s-base').value=s.base_url||'';
    gid('s-model').value=s.model||'';
    gid('s-key').value='';
    gid('s-key').placeholder=s.has_key?'已保存 ✓（留空 = 不修改）':'OpenAI 兼容接口的 Key';
    if(gid('s-clip')) gid('s-clip').checked=(s.clipboard_watch!==false);
    if(gid('hk-1')) gid('hk-1').textContent=fmtHotkey(s.hotkey);
    if(gid('hk-2')) gid('hk-2').textContent=fmtHotkey(s.hotkey_box);
    if(gid('s-clip-scope')) gid('s-clip-scope').value=(s.clip_scope==='all')?'all':'watchlist';
    if(gid('clipApps')) renderClipApps(s.clip_apps||[]);
    syncSeg();
  }).catch(function(e){ toast(e.message); });
  /* 权限状态 */
  if(TAPI){
    TAPI.invoke('perm_status').then(function(p){
      function row(ok,label,why,type){
        return '<div style="display:flex;align-items:center;gap:8px;font-size:13px">'+
          (ok?'<span style="color:#34c759">✓</span>':'<span style="color:#ff9f0a">⚠︎</span>')+
          '<span>'+label+'</span><span style="color:var(--faint,rgba(0,0,0,.35));font-size:11.5px">'+why+'</span>'+
          '<span style="flex:1"></span>'+
          (ok?'<span style="color:#34c759;font-size:12px">已授权</span>'
             :'<button type="button" class="sec" data-perm="'+type+'" style="padding:3px 10px;font-size:12px">去授权</button>')+
          '</div>';
      }
      gid('permRows').innerHTML=row(p.ax,'辅助功能','划词直读 / 框选需要','ax')+row(p.screen,'屏幕录制','像素识别需要','screen');
      Array.prototype.forEach.call(gid('permRows').querySelectorAll('[data-perm]'),function(b){
        b.onclick=function(){
          TAPI.invoke(b.getAttribute('data-perm')==='ax'?'open_ax_settings':'open_screen_settings')
            .catch(function(e){ toast(e.message||String(e)); });
        };
      });
    }).catch(function(){});
    TAPI.invoke('autostart_status').then(function(v){ gid('s-autostart').checked=v; }).catch(function(){});
  }
}
function fmtHotkey(s){
  return String(s||'').split('+').map(function(p){
    return {alt:'⌥',shift:'⇧',ctrl:'⌃',cmd:'⌘'}[p.trim().toLowerCase()]||p.trim().toUpperCase();
  }).join('');
}
function onProviderChange(){
  var p=gid('s-provider').value;
  var preset={glm:'https://open.bigmodel.cn/api/paas/v4|glm-4.6',
    deepseek:'https://api.deepseek.com|deepseek-chat',
    openai:'https://api.openai.com/v1|gpt-4o-mini'}[p];
  if(preset){ var pp=preset.split('|'); gid('s-base').value=pp[0]; gid('s-model').value=pp[1]; }
  else { gid('s-base').value=''; gid('s-model').value=''; }
}
function saveSettings(){
  api('POST','/api/settings',{
    provider:gid('s-provider').value,
    base_url:gid('s-base').value.trim(),
    model:gid('s-model').value.trim(),
    api_key:gid('s-key').value.trim(),
    clipboard_watch:gid('s-clip').checked
  }).then(function(r){ toast('已保存（'+(r.has_key?'Key 已配置':'还没配 Key')+' · 剪贴板监听 '+(r.clipboard_watch?'开':'关')+'）'); loadSettings(); })
    .catch(function(e){ toast(e.message); });
}
function testSettings(){
  api('POST','/api/settings/test').then(function(r){ toast('✅ 连接正常：'+(r.reply||'')); })
    .catch(function(e){ toast('❌ 测试失败：'+e.message); });
}

/* ---------- 右栏调度 ---------- */
function renderDetail(){
  var box=gid('detail');
  var p=state.pane;
  // ⑪ 只有换卡片/换面板时才播入场动画；勾步骤等局部刷新不打扰
  var paneKey=state.sel+':'+p.mode;
  var paneNew=paneKey!==state.paneKey;
  state.paneKey=paneKey;
  if(p.mode==='add'){
    box.innerHTML=addPaneHTML();
    var fp=box.querySelector('.fpanel');
    if(fp && paneNew) fp.classList.add('panein');
    bindAdd(); return;
  }
  var it=findItem(state.sel);
  if(!it){
    box.innerHTML='<div class="dwrap'+(paneNew?' panein':'')+'"><div class="empty">'+
      '<div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="3"/><path d="M7 9h10M7 13h6"/></svg></div>'+
      '<h2>选中一条看详情</h2>'+
      '<div class="hint">左边列表点一条 → 这里看<b>完整原文、步骤和执行结果</b><br>AI 给的一串命令 / 建议，被聊天顶走也不怕，都收在这里</div>'+
      '</div></div>';
    return;
  }
  box.innerHTML=entryHTML(it);
  if(paneNew){
    var dw=box.querySelector('.dwrap');
    if(dw) dw.classList.add('panein');
  }
  bindEntry(it);
  // ⑨ 进度条从上次的量弹簧充能到新的量（勾步骤时才有）
  var bar=gid('sprogBar');
  if(bar){
    var steps=it.steps||[];
    var doneN=steps.filter(function(s){ return s.done; }).length;
    var pct=steps.length?Math.round(doneN*100/steps.length):0;
    var prev=state.lastPct[it.id];
    if(state.fx.stepFx && prev!=null && prev!==pct){
      bar.style.width=prev+'%'; void bar.offsetWidth; bar.style.width=pct+'%';
    }
    state.lastPct[it.id]=pct;
  }
  // ⑨ 计数翻滚（rollMem 记着旧值，重绘后也能从旧值滚到新值）
  var st2=it.steps||[];
  if(st2.length){
    var dn2=st2.filter(function(s){ return s.done; }).length;
    rollTo('sprogTxt', dn2+'/'+st2.length+' 步');
    rollTo('stepCnt', dn2+'/'+st2.length);
  }
  state.fx.stepFx=0; state.fx.stepsIn=false;
}

/* ---------- 侧栏 / 顶栏交互 ---------- */
Array.prototype.forEach.call(document.querySelectorAll('.nav-item[data-view]'),function(el){
  el.onclick=function(){ state.view={ t:el.getAttribute('data-view') }; renderAll(true); };
});
Array.prototype.forEach.call(document.querySelectorAll('.nav-item[data-kind]'),function(el){
  el.onclick=function(){
    var k=el.getAttribute('data-kind');
    state.view = (state.view.t==='kind'&&state.view.kind===k) ? { t:'all' } : { t:'kind', kind:k };
    renderAll(true);
  };
});
gid('moreBtn').onclick=function(){ state.pane={mode:'add'}; renderDetail();
  gid('detail').scrollTo({top:0,behavior:'smooth'}); };
try { TAPI.invoke('js_log', { msg: '页面脚本初始化完成（全部按钮已绑定）' }); } catch (_) {}
gid('setBtn').onclick=function(){ toggleSettings(); };
Array.prototype.forEach.call(document.querySelectorAll('#settingsScreen .ss-item'),function(el){
  el.onclick=function(){ ssSetCat(el.getAttribute('data-ss')); };
});
gid('ssBack').onclick=function(){ closeSettings(); };
if (window.__TAURI__ && window.__TAURI__.event) {
  window.__TAURI__.event.listen('open-settings', function () { openSettings(); });
}
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  var ss = document.getElementById('settingsScreen');
  if (ss && ss.classList.contains('open')) { e.preventDefault(); closeSettings(); }
});

/* 快输：回车收进当前视图（项目视图自动带上项目） */
gid('quickInput').addEventListener('keydown',function(ev){
  if(ev.key!=='Enter') return;
  ev.preventDefault();
  var t=gid('quickInput').value.trim();
  if(!t) return;
  gid('quickInput').value='';
  // ⑯ 输入框果冻脉冲一下再收
  var qa=gid('quickAdd');
  qa.classList.remove('squish'); void qa.offsetWidth; qa.classList.add('squish');
  var ws='';
  var kind=(state.view.t==='kind'&&state.view.kind==='idle')?'idle':'suggestion';
  api('POST','/api/suggestions',{ title:t, kind:kind, workspace:ws })
    .then(function(created){
      if(created&&created.id){
        state.fx.flyIn=[created.id];
        if(!state.sel){ state.sel=created.id; if(state.pane.mode==='empty') state.pane={mode:'entry'}; }
      }
      load(false);
    })
    .catch(function(err){ toast(err.message); });
});
var qTimer=null;
gid('q').addEventListener('input',function(){
  clearTimeout(qTimer);
  qTimer=setTimeout(function(){ state.q=gid('q').value.trim(); renderList(true); renderNav(); },200);
});

/* 主题 */
function applyTheme(t){
  document.body.classList.toggle('dark', t==='dark');
  gid('themeBtn').querySelector('span').textContent = t==='dark' ? '浅色' : '深色';
}
var theme='light';
try{ theme=localStorage.getItem('inbox-theme') || new URLSearchParams(location.search).get('theme') || 'light'; }catch(e){}
applyTheme(theme);
gid('themeBtn').onclick=function(ev){
  var next=document.body.classList.contains('dark') ? 'light' : 'dark';
  function justApply(){ applyTheme(next); try{ localStorage.setItem('inbox-theme',next); }catch(e){} }
  // ⑬ 从按钮位置圆形揭示换肤；Web Animations 不可用则直接切换
  try{
    var r=ev.currentTarget.getBoundingClientRect();
    var x=Math.round(r.left+r.width/2), y=Math.round(r.top+r.height/2);
    var veil=gid('veil');
    var R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y))+40;
    veil.style.background= next==='dark' ? '#0c0c0e' : '#f5f5f7';
    veil.getAnimations().forEach(function(a){ a.cancel(); });
    veil.style.opacity='1';
    var a=veil.animate(
      [{clipPath:'circle(0px at '+x+'px '+y+'px)'},{clipPath:'circle('+R+'px at '+x+'px '+y+'px)'}],
      {duration:450,easing:'cubic-bezier(.3,0,.2,1)'});
    a.onfinish=function(){
      justApply();
      var f=veil.animate([{opacity:1},{opacity:0}],{duration:220});
      f.onfinish=function(){ veil.style.opacity='0'; };
    };
  }catch(e){ justApply(); }
};

var aiBusy=false;
// 页面每 4 秒自动刷新：⌥⇧S 收进来的新条目不用手动刷新就能看到
setInterval(function(){
  if(aiBusy || document.visibilityState!=='visible') return;
  load(true);
}, 4000);
load(false, true);
