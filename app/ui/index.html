<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纳言 · 建议收件箱</title>
<style>
/* ============ 纳言 · 三栏工作台（侧栏项目树 / 中列条目 / 右栏详情） ============ */
:root{
  /* R1 · 暖纸令牌：纸感底色 + 沉稳墨水蓝（只用于选中/进度/勾选）；标题用系统宋体（App CSP 不允许外部字体） */
  --bg:#f8f7f4; --panel:#fffefc; --panel2:rgba(60,50,30,.06);
  --line:rgba(60,50,30,.13); --hair:rgba(60,50,30,.07);
  --ink:#1f1e1b; --sub:#6b675f; --faint:#8d887f;
  --accent:#3550c4; --doing:#6f6aa8; --ok:#1d8a4c; --warn:#9a6412; --fire:#c9530a;
  --hover:rgba(60,50,30,.05); --sel:rgba(60,50,30,.075);
  --field:rgba(60,50,30,.06); --ring:rgba(53,80,196,.22);
  --shadow:0 0 0 .5px rgba(60,50,30,.06), 0 1px 2px rgba(60,50,30,.05), 0 10px 28px rgba(60,50,30,.08);
  --serif:'Songti SC','STSong','Noto Serif SC',serif;
  --r-lg:16px; --r-md:12px; --r-sm:8px;
  /* 第四版（暖纸版）令牌：实色侧栏、细线、悬停、墨水蓝浅底、阅读正文与步骤 */
  --side:#f1efea; --ink2:#56534d; --line2:#e6e2da; --line3:#d4cfc4; --hov:#ebe8e1;
  --accentSoft:#eef0fb; --accentInk:#2a42a8; --accentLine:#c8d0f1;
  --prose:#2a2925; --codebg:#f2efe9; --stepHov:#f6f4ef; --stepNext:#f4f1ea; --boxLine:#bdb8ae;
  --doneTxt:#8d887f; --doneLine:#c4bfb5; --dashLine:#cfc9be; --kbdLine:#d8d3c9; --kbdInk:#3d3b36; --composerLine:#ddd8ce;
  --amber:#9a6412; --amberSoft:#fbf3e4; --amberLine:#efdfbf; --badgeBg:#f1eee7; --rowLine:#f0ede6;
}
body.dark{
  --bg:#141311; --panel:#1d1c19; --panel2:rgba(255,248,235,.08);
  --line:rgba(255,248,235,.13); --hair:rgba(255,248,235,.07);
  --ink:#f2efe8; --sub:#a39d92; --faint:#7d786e;
  --accent:#8fa3ff; --doing:#a9a4e6; --ok:#4cc27a; --warn:#e0a24a; --fire:#e8923a;
  --hover:rgba(255,248,235,.06); --sel:rgba(255,248,235,.10);
  --field:rgba(255,248,235,.08); --ring:rgba(143,163,255,.35);
  --shadow:0 0 0 .5px rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.45);
  --side:#1a1917; --ink2:#cdc7bb; --line2:rgba(255,248,235,.11); --line3:rgba(255,248,235,.22); --hov:rgba(255,248,235,.07);
  --accentSoft:rgba(143,163,255,.14); --accentInk:#c3ccff; --accentLine:rgba(143,163,255,.4);
  --prose:#e8e3da; --codebg:rgba(255,248,235,.06); --stepHov:rgba(255,248,235,.04); --stepNext:rgba(255,248,235,.07); --boxLine:rgba(255,248,235,.3);
  --doneTxt:#7d786e; --doneLine:#5d5950; --dashLine:rgba(255,248,235,.22); --kbdLine:rgba(255,248,235,.18); --kbdInk:#cdc7bb; --composerLine:rgba(255,248,235,.14);
  --amber:#e0a24a; --amberSoft:rgba(224,162,74,.12); --amberLine:rgba(224,162,74,.3); --badgeBg:rgba(255,248,235,.08); --rowLine:rgba(255,248,235,.07);
}
*{ box-sizing:border-box; }
html{ height:100%; }
body{ margin:0; min-height:100vh; min-width:960px; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Helvetica Neue',sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; }
a{ color:var(--accent); text-decoration:none; }
button{ font:inherit; border:0; border-radius:var(--r-sm); padding:6px 12px; background:transparent;
  color:var(--ink); cursor:pointer; font-weight:500; transition:background .15s ease, color .15s ease, transform .22s var(--spring-nav); }
button:disabled{ opacity:.45; cursor:default; }
svg.ic{ width:16px; height:16px; flex-shrink:0; }
.icw{ width:18px; height:18px; flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.icw > img{ width:15px; height:15px; border-radius:4px; display:block; object-fit:contain; flex-shrink:0; }

::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:rgba(128,128,138,.35); border-radius:99px;
  border:2px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-track{ background:transparent; }

/* ---- 侧栏 · 全高贴边玻璃（macOS 26/27 单层式：与窗口同角、红绿灯直接坐在玻璃上） ---- */
.dragstrip{ position:fixed; top:0; left:244px; right:0; height:30px; z-index:30; }
.sidebar{ position:fixed; left:0; top:0; bottom:0; width:232px; z-index:5;
  display:flex; flex-direction:column; padding:0 2px 10px; border-radius:20px 0 0 20px;
  overflow:hidden;
  background:rgba(243,240,233,.66);
  backdrop-filter:blur(40px) saturate(1.6); -webkit-backdrop-filter:blur(40px) saturate(1.6);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.45), inset -0.5px 0 0 rgba(0,0,0,.06),
    8px 0 24px rgba(0,0,0,.05); }
body.dark .sidebar{ background:rgba(28,28,32,.55);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.12), inset -0.5px 0 0 rgba(0,0,0,.45),
    8px 0 24px rgba(0,0,0,.35); }
.side-scroll{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; }
/* ---- 自绘窗控（macOS 26/27 单层化）：系统红绿灯已在 Rust 侧隐藏，此排灯与侧栏玻璃同一层 ---- */
.winctl{ display:flex; gap:8px; align-items:center; padding:15px 8px 6px 12px; flex-shrink:0; }

/* ---- UX-AI-CAPTURE-FIDELITY-01：代码块 chrome（所有来源共享；DOM 零文本=投影/复制零污染） ---- */
.nayan-codebar{ display:flex; align-items:center; gap:8px; margin:12px 0 -6px; padding:0 12px; }
.nayan-codelang::before{ content:attr(data-lang); font-size:10.5px; font-weight:600; color:var(--sub);
  letter-spacing:.05em; text-transform:lowercase; opacity:.85; }
.nayan-codelang[data-lang='']{ display:none; }
.nayan-codecopy{ margin-left:auto; padding:2px 9px; font-size:11px; border-radius:6px; background:var(--hover); }
.nayan-codecopy::before{ content:'⧉ 复制代码'; }
.nayan-codecopy:hover{ background:var(--sel); }
.nayan-codecopy.okpop::before{ content:'✓ 已复制'; }
.nayan-codecopy.okpop{ color:var(--accent); }

/* ---- UX-WORKBUDDY-READING-01 Step3：三模式布局（默认三栏 / 窄导航 / 专注阅读）----
   全部来源与条目通用；切换只改几何（CSS 变量），不重建正文、不触发重复读取；
   偏好记忆 localStorage nayan-layout；恢复入口永不放进被隐藏栏。 */
body{ --navw:232px; --listw:318px; }
body.nav-min{ --navw:56px; }
body.list-off{ --listw:0px; }
.sidebar{ width:var(--navw); transition:width .28s var(--spring-nav,ease); }
.dragstrip{ left:calc(var(--navw) + 12px); transition:left .28s var(--spring-nav,ease); }
.mcol{ left:calc(var(--navw) + 12px); width:var(--listw); transition:left .28s var(--spring-nav,ease), width .28s var(--spring-nav,ease); }
body.list-off .mcol{ display:none; }
.detail{ left:calc(var(--navw) + var(--listw) + 24px); transition:left .28s var(--spring-nav,ease); }
body.list-off .detail{ left:calc(var(--navw) + 36px); }
/* 窄导航：只留图标（窗控/品牌 logo/导航图标/底栏图标），文字与计数隐藏 */
body.nav-min .sidebar{ padding:0 0 10px; }
body.nav-min .bname, body.nav-min .side-label, body.nav-min .nav-item,
body.nav-min .cnt, body.nav-min .miniseg, body.nav-min .side-grow{ display:none; }
body.nav-min .side-scroll{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 0; }
body.nav-min .railnav{ display:flex; }
body.nav-min .brand{ justify-content:center; padding:6px 0 2px; }
body.nav-min .bottombar{ flex-direction:column; align-items:center; gap:2px; padding:8px 0; }
body.nav-min .bottombar .bbtn span{ display:none; }
body.nav-min .bbtn{ padding:7px; }
.railnav{ display:none; }
.railnav .rn{ width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  border-radius:8px; color:var(--ink); cursor:pointer; }
.railnav .rn:hover{ background:var(--hover); }
.railnav .rn.on{ background:var(--sel); }
/* 恢复/模式入口 */
.navtoggle{ padding:2px 7px; font-size:12px; border-radius:6px; background:var(--hover); flex-shrink:0; }
.navtoggle:hover{ background:var(--sel); }
#navExpand{ display:none; margin:2px auto 4px; }
body.nav-min #navExpand{ display:flex; }
.mtools{ margin-left:auto; display:flex; gap:4px; align-items:center; }
.mtool{ padding:3px 8px; font-size:12px; border-radius:6px; background:transparent; }
.mtool:hover{ background:var(--hover); }
#listRestore{ position:fixed; left:calc(var(--navw) + 12px); top:38px; z-index:40; display:none;
  padding:4px 10px; font-size:12px; border-radius:999px; border:1px solid var(--line);
  background:var(--panel); box-shadow:0 2px 10px rgba(0,0,0,.08); }
body.list-off #listRestore{ display:inline-flex; }
#focusExit{ position:fixed; top:38px; right:26px; z-index:40; display:none;
  padding:5px 14px; font-size:12px; border-radius:999px; border:1px solid var(--line);
  background:var(--panel); box-shadow:0 2px 10px rgba(0,0,0,.08); }
body.focus-read #focusExit{ display:inline-flex; }
@media (prefers-reduced-motion: reduce){ .sidebar,.mcol,.detail,.dragstrip{ transition:none; } }
.wl{ width:12px; height:12px; border-radius:50%; padding:0; position:relative; flex-shrink:0; cursor:default;
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.16); }
.wl svg{ position:absolute; left:2px; top:2px; width:8px; height:8px; opacity:0; transition:opacity .12s ease; }
.winctl:hover .wl svg{ opacity:.6; }
.wl.close{ background:#ff5f57; } .wl.min{ background:#febc2e; } .wl.zoom{ background:#28c840; }
body.win-inactive .wl{ background:#c9c9ce !important; }

.brand{ display:flex; gap:9px; align-items:center; padding:8px 8px 12px; }
.logo{ width:24px; height:24px; border-radius:7px; background:linear-gradient(135deg,#3550c4,#5a6fd6);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;
  box-shadow:0 1px 4px rgba(10,90,255,.30); }
.logo svg{ width:13px; height:13px; stroke:#fff; }
/* P1-B06-REPAIR-01：图标尺寸由类规则兜底（不再唯一依赖 inline style 属性——
   CSP style-src 一旦含 hash/nonce，'unsafe-inline' 被忽略会使 style 属性失效，
   img 将按 naturalWidth（own_icon 可达 1024px）溢出成巨图，见批次修前证据 D 形态）*/
.logo > img{ width:24px; height:24px; border-radius:7px; display:block; object-fit:contain; flex-shrink:0; }
.bname{ font-weight:700; font-size:14px; letter-spacing:-.01em; line-height:1.25; }
.side-label{ font-size:11px; color:#8E8E93; padding:18px 8px 5px; font-weight:500;
  display:flex; align-items:center; }
.brand + .side-label{ padding-top:10px; }
.side-label .grow{ flex:1; }
.side-label .plus{ font-size:13px; color:var(--faint); width:18px; height:18px; border-radius:5px;
  display:flex; align-items:center; justify-content:center; line-height:1; }
.side-label .plus:hover{ background:var(--hover); color:var(--sub); }
.nav-item{ display:flex; align-items:center; gap:8px; height:30px; margin:0 8px; padding:0 8px;
  border-radius:6px; cursor:pointer; color:var(--ink); font-weight:400; font-size:13px;
  transition:background .12s ease, transform .18s var(--spring-nav); }
.nav-item svg.ic{ color:var(--sub); }
.nav-item:hover{ background:var(--hover); }
.nav-item.on{ font-weight:500; color:var(--accent); }
.nav-item.on svg.ic{ color:var(--accent); }
.nav-item .cnt{ margin-left:auto; font-size:11.5px; color:var(--sub);
  font-variant-numeric:tabular-nums; font-weight:500; }
/* 项目行的展开箭头 */
.nav-item .pchev{ width:14px; height:14px; flex-shrink:0; display:flex; align-items:center;
  justify-content:center; color:var(--faint); margin-left:-4px; transition:transform .3s var(--spring); }
.nav-item .pchev svg{ width:10px; height:10px; }
.nav-item .pchev.open{ transform:rotate(90deg); }
.nav-item .pchev:hover{ color:var(--sub); }
.nav-item.sub{ padding-left:14px; height:28px; font-size:12.5px; color:var(--sub); }
.nav-item.sub:hover{ color:var(--ink); }
.nav-item.sub.on{ color:var(--accent); }
.side-empty{ font-size:11.5px; color:var(--faint); padding:4px 16px; }
/* 来源组：软件/项目 双维度迷你分段（ZCode 式，滑块弹簧滑动） */
.srcmode-row .grow{ flex:1 }
.miniseg{ position:relative; display:flex; gap:2px; background:var(--field); border-radius:8px; padding:2px; margin-left:6px }
.miniseg .slider{ position:absolute; top:2px; bottom:2px; border-radius:6px; background:var(--panel);
  box-shadow:0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04);
  transition:left .32s var(--spring-nav), width .32s var(--spring-nav) }
body.dark .miniseg .slider{ box-shadow:0 1px 3px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.08) }
.miniseg button{ position:relative; z-index:1; border-radius:6px; padding:2px 9px; font-size:11px; font-weight:500; color:var(--sub) }
.miniseg button.on{ color:var(--ink); font-weight:600 }
@keyframes treeIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }
#projList.treefade{ animation:treeIn .28s var(--easeout); }
.side-grow{ flex:1; }
.bottombar{ display:flex; gap:4px; padding-top:8px; border-top:1px solid var(--hair); }
.bottombar .bbtn{ flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
  height:30px; border-radius:var(--r-sm); color:var(--sub); font-size:12px; font-weight:500; }
.bottombar .bbtn:hover{ background:var(--hover); color:var(--ink); }

/* ---- 中列 · 条目列表 ---- */
.mcol{ position:fixed; left:244px; top:0; bottom:0; width:318px; z-index:4;
  overflow-y:auto; overflow-x:hidden; padding:36px 0 14px; }
.mhead{ display:flex; align-items:baseline; gap:8px; padding:0 14px 2px; }
.mhead h1{ margin:0; font-family:var(--serif); font-size:21px; font-weight:600; letter-spacing:0; line-height:1.3; }
.mhead .cnt{ color:var(--sub); font-size:12px; font-variant-numeric:tabular-nums; }
.msub{ padding:0 14px; color:var(--faint); font-size:11.5px; margin:0 0 10px;
  font-variant-numeric:tabular-nums; }
.msearch{ position:relative; margin:0 12px 8px; }
.msearch svg{ position:absolute; left:9px; top:8px; width:14px; height:14px; color:var(--sub); }
.msearch input{ width:100%; height:31px; border:1px solid transparent; border-radius:8px;
  padding:0 10px 0 29px; font:inherit; font-size:13px; background:rgba(255,254,252,.7);
  backdrop-filter:blur(20px) saturate(1.3); -webkit-backdrop-filter:blur(20px) saturate(1.4);
  box-shadow:var(--shadow); color:var(--ink); outline:none; transition:border-color .15s ease; }
body.dark .msearch input{ background:rgba(23,23,27,.6); }
.msearch input:focus{ background:var(--panel); border-color:var(--accent);
  box-shadow:var(--shadow), 0 0 0 3.5px var(--ring); }

/* 快速记录 */
.quickadd{ display:flex; align-items:center; gap:8px; margin:0 12px 8px; height:38px;
  border-radius:11px; padding:0 8px 0 14px;
  background:rgba(255,255,255,.65); backdrop-filter:blur(20px) saturate(1.4);
  -webkit-backdrop-filter:blur(20px) saturate(1.4); box-shadow:var(--shadow); }
body.dark .quickadd{ background:rgba(23,23,27,.6); }
.quickadd:focus-within{ box-shadow:var(--shadow), 0 0 0 3.5px var(--ring); }
.quickadd .plus{ color:var(--accent); font-weight:700; font-size:15px; }
.quickadd input{ flex:1; min-width:0; border:0; outline:none; background:transparent; font:inherit;
  font-size:13px; color:var(--ink); }
.quickadd input::placeholder{ color:var(--faint); }
.quickadd .more{ color:var(--faint); width:26px; height:26px; border-radius:6px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.quickadd .more:hover{ background:var(--hover); color:var(--sub); }
.quickadd .more svg{ width:13px; height:13px; transition:transform .15s ease; }
.quickadd .more.open svg{ transform:rotate(180deg); }

/* 今日专注条 */
.focusstrip{ display:flex; align-items:center; gap:10px; margin:0 12px 8px; padding:8px 8px 8px 13px;
  border-radius:12px; background:linear-gradient(135deg,#34386a,#3550c4); color:#fff;
  box-shadow:0 6px 18px rgba(53,80,196,.22); }
.focusstrip .fdot{ width:8px; height:8px; border-radius:50%; background:#fff;
  box-shadow:0 0 0 0 rgba(255,255,255,.6); animation:pulse 2s ease-out infinite; flex-shrink:0; }
@keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(255,255,255,.55);} 70%{ box-shadow:0 0 0 7px rgba(255,255,255,0);} 100%{ box-shadow:0 0 0 0 rgba(255,255,255,0);} }
.focusstrip .ftitle{ font-weight:600; font-size:12.5px; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; flex-shrink:1; min-width:0; }
.focusstrip .fprog{ font-size:11px; opacity:.85; font-variant-numeric:tabular-nums; flex-shrink:0; }
.focusstrip .fgrow{ flex:1; }
.focusstrip .fbtn{ background:rgba(255,255,255,.2); color:#fff; border-radius:7px;
  font-size:11.5px; padding:3px 9px; flex-shrink:0; }
.focusstrip .fbtn:hover{ background:rgba(255,255,255,.32); }
.focusstrip.quiet{ background:var(--panel2); color:var(--sub); box-shadow:none; padding:6px 8px 6px 13px; }
.focusstrip.quiet .fdot{ display:none; }
.focusstrip.quiet .fbtn{ background:transparent; color:var(--accent); font-weight:600; }
.focusstrip.quiet .fbtn:hover{ background:var(--hover); }

/* 闲时任务重置条 */
.resetbar{ display:none; align-items:center; gap:8px; flex-wrap:wrap; margin:0 12px 8px;
  padding:7px 12px; border-radius:10px; font-size:12px; color:var(--ink);
  background:rgba(255,149,0,.10); }
.resetbar.show{ display:flex; }
.resetbar b{ color:var(--fire); }
.resetbar input[type=date]{ border:1px solid transparent; border-radius:7px; padding:2px 7px;
  font:inherit; font-size:11.5px; background:var(--field); color:var(--ink); outline:none; }
.resetbar .days{ font-size:13px; font-weight:800; color:var(--fire); font-variant-numeric:tabular-nums; }
.resetbar .grow{ flex:1; }
.resetbar .tip{ font-size:11px; color:var(--sub); }

/* 条目卡片 */
.datehead{ display:flex; align-items:baseline; gap:8px; margin:14px 14px 6px; }
.datehead b{ font-size:12px; font-weight:600; color:var(--sub); }
.datehead span{ font-size:11px; color:var(--faint); font-variant-numeric:tabular-nums; }
.card{ background:rgba(255,254,252,.78); backdrop-filter:blur(20px) saturate(1.3);
  -webkit-backdrop-filter:blur(20px) saturate(1.4);
  border-radius:12px; padding:9px 12px 8px; margin:0 12px 7px; cursor:pointer;
  border:1px solid transparent; position:relative; overflow:hidden;
  box-shadow:0 0 0 .5px rgba(0,0,0,.045), 0 1px 2px rgba(0,0,0,.06), 0 5px 14px rgba(0,0,0,.07);
  transition:border-color .15s ease, box-shadow .18s ease, transform .18s var(--spring),
    opacity .28s ease, margin .3s var(--easeout), max-height .3s var(--easeout), padding .3s var(--easeout); }
body.dark .card{ background:rgba(28,28,32,.55);
  box-shadow:0 0 0 .5px rgba(255,255,255,.07), 0 1px 2px rgba(0,0,0,.3), 0 5px 14px rgba(0,0,0,.25); }
.card:hover{ transform:translateY(-1px);
  box-shadow:0 0 0 .5px rgba(0,0,0,.05), 0 2px 6px rgba(0,0,0,.08), 0 14px 30px rgba(0,0,0,.10); }
.card:active{ transform:translateY(0) scale(.988); }
.card.sel{ border-color:var(--accent);
  box-shadow:0 0 0 3px var(--ring), 0 6px 18px rgba(0,0,0,.10); }
.card.done, .card.dropped{ opacity:.55; }
.ctitle{ display:flex; align-items:flex-start; gap:7px; font-weight:600; font-size:13.5px;
  line-height:1.4; letter-spacing:-.005em; word-break:break-word; }
.cdot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; margin-top:5px; }
.cdot.s-inbox{ background:transparent; border:1.5px dashed var(--faint); }
.cdot.s-todo{ background:var(--faint); }

/* ============ 动效层（16 项微交互，全部 vanilla CSS/JS，WKWebView 兼容） ============ */
:root{ --spring:cubic-bezier(.34,1.56,.64,1); --spring-nav:cubic-bezier(.32,.72,0,1); --easeout:cubic-bezier(.22,1,.36,1); }
button:active{ transform:scale(.96); }
.nav-item:active{ transform:scale(.985); }

/* ⑨ 数字翻滚 */
.roll{ display:inline-flex; overflow:hidden; height:1.3em; line-height:1.3em; position:relative; vertical-align:bottom; }
.roll i{ font-style:normal; display:block; }
.roll .r-old{ animation:rollUp .38s var(--easeout) both; }
.roll .r-new{ position:absolute; left:0; top:100%; animation:rollIn .38s var(--easeout) both; }
@keyframes rollUp{ to{ transform:translateY(-100%); } }
@keyframes rollIn{ from{ transform:translateY(-100%); } to{ transform:translateY(0); } }

/* ③ 侧栏选中滑块 */
#navPill{ position:absolute; left:8px; right:8px; border-radius:6px; background:var(--sel);
  z-index:0; pointer-events:none; opacity:0;
  transition:top .38s var(--spring-nav), height .25s var(--spring-nav), opacity .2s; }

/* ④ 来源树弹性折叠 */
.subwrap{ overflow:hidden; transition:max-height .42s var(--spring-nav), opacity .28s ease; max-height:600px; opacity:1; }
.subwrap.fold{ max-height:0; opacity:0; }

/* ⑤ 分段 Tab 滑块（白色滑块弹簧滑动，按钮本底透明） */
.seg{ position:relative; }
.seg .slider{ position:absolute; top:2px; bottom:2px; border-radius:7px; background:var(--panel);
  box-shadow:0 1px 3px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04);
  transition:left .32s var(--spring-nav), width .32s var(--spring-nav); }
body.dark .seg .slider{ box-shadow:0 1px 3px rgba(0,0,0,.5), 0 0 0 .5px rgba(255,255,255,.08); }

/* ①②⑥⑦⑧ 卡片动效 */
.card.in{ animation:cardIn .5s var(--spring) both; }
@keyframes cardIn{ 0%{ opacity:0; transform:translateY(16px) scale(.965); } 62%{ opacity:1; transform:translateY(-2px) scale(1.004); } 100%{ opacity:1; transform:none; } }
.card.new{ animation:cardNew .55s var(--spring) both; }
@keyframes cardNew{ 0%{ opacity:0; transform:translateY(-20px) scale(.94); } 55%{ opacity:1; transform:translateY(3px) scale(1.012); } 100%{ opacity:1; transform:none; } }
.card.flash::after{ content:''; position:absolute; inset:0; border-radius:12px; pointer-events:none;
  animation:flashRing .9s var(--easeout) both; }
@keyframes flashRing{ 0%{ box-shadow:0 0 0 0 rgba(53,80,196,.4); } 100%{ box-shadow:0 0 0 14px rgba(53,80,196,0); } }
.card.pop{ animation:selPop .3s var(--spring); }
@keyframes selPop{ 0%{ transform:scale(.985); } 100%{ transform:scale(1); } }
.card.jelly{ animation:jelly .55s var(--spring); }
@keyframes jelly{ 0%{ transform:scale(1,1); } 28%{ transform:scale(1.035,.93); } 48%{ transform:scale(.975,1.035); } 68%{ transform:scale(1.012,.988); } 100%{ transform:scale(1,1); } }
.card.bye{ opacity:0!important; transform:translateX(64px) rotate(1.6deg)!important; max-height:0!important; margin-bottom:0!important;
  padding-top:0!important; padding-bottom:0!important; border-width:0!important;
  transition:all .34s cubic-bezier(.5,0,.75,.4); }
.cdot.morph{ animation:dotPop .45s var(--spring); }
@keyframes dotPop{ 0%{ transform:scale(.3); } 60%{ transform:scale(1.4); } 100%{ transform:scale(1); } }

/* ⑦ 步骤勾选：✓ 描画 + 删除线从左扫过 */
.step .ck svg{ position:absolute; inset:0; width:100%; height:100%; }
.step .ck svg polyline{ fill:none; stroke:#fff; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:16; stroke-dashoffset:0; }
.step.fx-done-on .ck svg polyline{ animation:drawIn .3s var(--easeout) .05s both; }
@keyframes drawIn{ from{ stroke-dashoffset:16; } to{ stroke-dashoffset:0; } }
.step .stext{ position:relative; width:fit-content; max-width:100%; }
.step .stext::after{ content:''; position:absolute; left:0; top:54%; height:1.5px; width:100%; background:var(--faint);
  transform:scaleX(0); transform-origin:0 50%; transition:transform .32s var(--easeout) .05s; }
.step.done .stext::after{ transform:scaleX(1); }
.step.fx-done-on .stext::after{ animation:sweepIn .34s var(--easeout) .05s both; }
@keyframes sweepIn{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
.step.stepin{ animation:rowIn .4s var(--spring) both; }
@keyframes rowIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

/* ⑩ 复制 morph（上下翻转出绿色已复制） */
.cp-morph{ position:relative; font-size:11px; color:var(--sub); padding:2px 8px; border-radius:5px; overflow:hidden; }
.cp-morph:hover{ background:var(--panel2); color:var(--ink); }
.cp-morph .l1,.cp-morph .l2{ display:block; transition:transform .28s var(--spring), opacity .2s; }
.cp-morph .l2{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--ok); font-weight:700; transform:translateY(120%); opacity:0; }
.cp-morph.ok .l1{ transform:translateY(-120%); opacity:0; }
.cp-morph.ok .l2{ transform:translateY(0); opacity:1; }
/* P1-T07 S03：源区间复制芯片（hover 惰性挂载——渲染路径零成本，测量试跑无鼠标事件） */
.nayan-chipped{ position:relative; }
.nayan-srccp{ position:absolute; top:3px; right:3px; z-index:3; font-size:10px; line-height:1;
  padding:3px 7px; border-radius:6px; border:1px solid var(--hair); background:var(--panel);
  color:var(--sub); opacity:0; transition:opacity .15s; cursor:pointer; }
.nayan-srccp+.nayan-srccp{ right:auto; margin-left:2px; }
.nayan-chipped:hover .nayan-srccp{ opacity:1; }
.nayan-srccp:hover{ color:var(--ink); }
.nayan-srccp.ok{ color:var(--ok); }
.okpop{ animation:okPop .4s var(--spring); }
@keyframes okPop{ 0%{ transform:scale(.6); } 60%{ transform:scale(1.25); } 100%{ transform:scale(1); } }

/* ⑪ 详情面板切换（选中变化时才播放，步骤刷新不打扰） */
.dwrap.panein{ animation:paneIn .34s var(--easeout); }
.fpanel.panein{ animation:paneIn .34s var(--easeout); }
@keyframes paneIn{ 0%{ opacity:0; transform:translateY(12px) scale(.99); filter:blur(3px); } 100%{ opacity:1; transform:none; filter:none; } }

/* ⑫ Toast 弹性出入场 */
.err.show{ display:flex; animation:toastIn .45s var(--spring); }
.err.hide{ animation:toastOut .3s ease both; }
@keyframes toastIn{ 0%{ opacity:0; transform:translate(-50%,26px) scale(.88); } 62%{ opacity:1; transform:translate(-50%,-3px) scale(1.015); } 100%{ opacity:1; transform:translate(-50%,0) scale(1); } }
@keyframes toastOut{ to{ opacity:0; transform:translate(-50%,16px) scale(.95); } }

/* ⑬ 深浅色圆形揭示 */
#veil{ position:fixed; inset:0; z-index:500; pointer-events:none; opacity:0; }

/* ⑭ 设置面板弹簧入场 + 分类切换淡化 + 分类滑块 */
#settingsScreen.open{ animation:panelIn .38s var(--spring-nav); }
#settingsScreen.closing{ display:grid; animation:panelOut .26s var(--spring-nav) both; }
@keyframes panelIn{ 0%{ opacity:0; transform:scale(.965) translateY(10px); } 100%{ opacity:1; transform:none; } }
@keyframes panelOut{ to{ opacity:0; transform:scale(.965) translateY(10px); } }
#ssPill{ position:absolute; left:0; right:0; border-radius:8px; background:var(--sel); z-index:0;
  pointer-events:none; opacity:0; transition:top .35s var(--spring-nav), height .25s var(--spring-nav), opacity .2s; }
#settingsScreen .ss-item{ position:relative; z-index:1; }
.ss-wrap.swapin{ animation:paneIn .3s var(--easeout); }

/* ⑮ AI 拆步 shimmer */
.dbtn.busy{ color:transparent!important; pointer-events:none; position:relative; overflow:hidden; }
.dbtn.busy::after{ content:'⏳ 拆解中…'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--sub); font-size:12px;
  background:linear-gradient(100deg,transparent 30%,rgba(125,90,255,.25) 50%,transparent 70%);
  background-size:220% 100%; animation:shimmer 1s linear infinite; }
@keyframes shimmer{ 0%{ background-position:120% 0; } 100%{ background-position:-120% 0; } }

/* ⑯ 空状态呼吸 + 快记果冻脉冲 */
.empty .big{ animation:floatY 3.2s ease-in-out infinite; }
@keyframes floatY{ 0%,100%{ transform:translateY(0) rotate(-2deg); } 50%{ transform:translateY(-7px) rotate(2deg); } }
.empty h2{ animation:rowIn .4s .05s var(--easeout) both; }
.empty .hint{ animation:rowIn .45s .16s var(--easeout) both; }
.quickadd.squish{ animation:squish .38s var(--spring); }
@keyframes squish{ 0%{ transform:scale(1); } 30%{ transform:scale(1.025,.92); } 60%{ transform:scale(.985,1.02); } 100%{ transform:scale(1); } }

/* 专注条形态切换滑入 */
.focusstrip.stripin{ animation:stripIn .45s var(--spring-nav); }
@keyframes stripIn{ 0%{ opacity:0; transform:translateY(-10px) scale(.97); } 100%{ opacity:1; transform:none; } }

/* 键盘可达：Tab 聚焦环（鼠标点击不显示） */
button:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--ring); }
.sw input:focus-visible + .sl{ box-shadow:0 0 0 3px var(--ring) }

/* 系统开了「减弱动态效果」时全部降级为瞬时 */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.001s !important; }
}

/* ---- R1 · 暖纸：阅读正文宋体（仅 rich 段落/列表；plain 与代码保持原样不动） ---- */
#aibody.rich p, #aibody.rich li, #aibody.rich blockquote{ font-family:var(--serif); font-size:15px; line-height:1.85; }
#aibody.rich h1, #aibody.rich h2, #aibody.rich h3{ font-family:var(--serif); font-size:16px; font-weight:600; }
#aibody.rich strong{ font-weight:700; }

/* ============ R2 · 侧栏与列表 / R3 · 钉板与阅读整理（按暖纸版第四版对齐） ============ */
/* 第四版：纸色平底、实色侧栏、细线代替阴影；不要氛围光 */
.ambient{ display:none; }
body{ --navw:264px; }
.sidebar{ background:var(--side); border-right:1px solid var(--line2); box-shadow:none;
  backdrop-filter:none; -webkit-backdrop-filter:none; padding:0 0 12px; }
body.dark .sidebar{ background:var(--side); box-shadow:none; }
body .winctl{ gap:8px; padding:16px 0 0 16px; }
body .side-scroll{ padding:46px 12px 4px; display:flex; flex-direction:column; gap:2px; scrollbar-width:none; }
.side-scroll > *{ flex-shrink:0; }
.side-scroll::-webkit-scrollbar, .board::-webkit-scrollbar, .detail::-webkit-scrollbar{ width:0; height:0; }
#recentList{ display:flex; flex-direction:column; gap:2px; }
/* 第四版的度量用浏览器默认行高（原型未设 line-height）；正文、步骤等另有明确行高 */
.sidebar, .board, .bdock, .rbar, .dfoot, .dmeta, .me, .spanel .ph, .adds, .menu{ line-height:normal; }
.dragstrip{ left:var(--navw); }
/* 第四版侧栏只有：记一条 / 钉板·收件箱·归档 / 最近待看 / 我·设置——旧视图入口与窄栏开关不出现（代码与数据保留） */
#navPill, #navCollapse, #navExpand, .morebtn, #moreNav, .railnav{ display:none !important; }
.brand{ gap:9px; padding:0 6px 14px; }
.brand .logo{ width:26px; height:26px; border-radius:7px; background:#fffefc; border:1px solid #ddd8ce; box-shadow:none; }
.brand .logo i{ display:block; width:11px; height:3px; border-radius:2px; background:var(--accent); }
body.dark .brand .logo{ background:#2a2925; border-color:#3a3833; }
.bname{ font-family:var(--serif); font-size:17px; font-weight:500; letter-spacing:.14em; line-height:1.3; }
.newbtn{ display:flex; align-items:center; gap:8px; width:100%; height:36px; margin:0 0 10px; padding:0 10px;
  border-radius:10px; border:1px solid var(--line2); background:var(--panel); box-shadow:none; color:var(--ink); font-weight:500; font-size:13.5px; }
.newbtn:hover{ border-color:var(--line3); }
.newbtn .plus{ width:20px; height:20px; border-radius:50%; background:var(--ink); color:var(--panel); display:flex;
  align-items:center; justify-content:center; flex-shrink:0; }
.nav-item{ min-height:34px; height:auto; margin:0; padding:0 10px; gap:10px; border-radius:9px; color:var(--ink2); font-size:13.5px; font-weight:400; }
.nav-item svg.ic{ width:15px; height:15px; color:currentColor; }
.nav-item > .icw{ width:15px; height:15px; }
.nav-item:hover{ background:var(--hov); color:var(--ink); }
.nav-item.on{ background:var(--hov); color:var(--ink); font-weight:600; }
.nav-item.on svg.ic{ color:currentColor; }
.nav-item .cnt{ font-size:12px; color:var(--sub); font-weight:400; }
.side-label{ font-size:12px; color:var(--sub); font-weight:400; padding:18px 10px 6px; }
.recent-head select{ border:0; background-color:transparent; color:var(--sub); font:inherit; font-size:12px; padding:0 16px 0 0;
  background-position:right 2px center; cursor:pointer; outline:none; max-width:120px; text-overflow:ellipsis; }
.recent-head .grow{ flex:1; }
.recent{ display:block; width:100%; margin:0; height:auto; padding:7px 10px; border-radius:9px; font-weight:400; font-size:13.5px; line-height:1.4;
  color:var(--ink2); text-align:left; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.recent:hover, .recent.on{ background:var(--hov); color:var(--ink); }
.recent .pin{ color:var(--accent); margin-right:6px; }
.recent-empty{ font-size:12px; color:var(--sub); padding:4px 10px; }
/* 侧栏底部：我 · 本机 · 设置 */
.me{ display:flex; align-items:center; gap:10px; margin:0 12px; padding:10px 8px 2px; border-top:1px solid var(--line2); }
.meav{ width:26px; height:26px; border-radius:50%; background:#2c2b28; color:#f8f7f4; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
body.dark .meav{ background:#e9e5dc; color:#1d1c19; }
.me .metxt{ flex:1; min-width:0; color:var(--ink2); font-size:13.5px; line-height:1.4; }
.ghostbtn{ height:30px; padding:0 10px; border-radius:8px; background:transparent; color:var(--ink2); font-weight:400; font-size:13.5px; flex-shrink:0; }
.ghostbtn:hover{ background:var(--hov); color:var(--ink); }

/* 来源字母头像（第四版：彩色小方块 + 首字母；没列到的来源取首字、灰底） */
.av{ flex:0 0 auto; width:20px; height:20px; border-radius:6px; color:#fffefc; font-size:10.5px; font-weight:600; line-height:1;
  display:inline-flex; align-items:center; justify-content:center; background:#8d887f; }
.av.lg{ width:30px; height:30px; border-radius:9px; font-size:12.5px; }
.av.s-claude{ background:#a8664a; } .av.s-zcode{ background:#3a3f4b; } .av.s-obsidian{ background:#6e5bb8; }
.av.s-workbuddy{ background:#2e8277; } .av.s-chatgpt{ background:#3f7d6b; } .av.s-antigravity{ background:#4a6fb0; } .av.s-nayan{ background:#2c2b28; }

/* 通用小件：细边按钮 / 幽灵按钮 / 图标按钮 / 胶囊 / 菜单 */
.tb{ height:30px; padding:0 12px; border-radius:9px; border:1px solid var(--line2); background:var(--panel); color:var(--ink); font-weight:400; font-size:13.5px;
  display:inline-flex; align-items:center; justify-content:center; white-space:nowrap; text-decoration:none; flex-shrink:0; }
.tb:hover{ border-color:var(--line3); }
.tb.on{ border-color:var(--accentLine); background:var(--accentSoft); color:var(--accentInk); }
.lk{ height:30px; padding:0 10px; border-radius:8px; background:transparent; color:var(--ink2); font-weight:400; font-size:13.5px; }
.lk:hover{ background:var(--hov); color:var(--ink); }
.iconb{ width:30px; height:30px; padding:0; border-radius:8px; background:transparent; color:var(--ink2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.iconb:hover{ background:var(--hov); color:var(--ink); }
.iconb.ring1{ border:1px solid var(--line2); background:var(--panel); }
.chip{ height:28px; padding:0 10px; border-radius:14px; border:1px solid var(--line2); background:transparent; color:var(--ink2); font-size:12.5px; font-weight:400; white-space:nowrap; }
.chip:hover{ border-color:var(--line3); color:var(--ink); }
.menu{ position:absolute; z-index:20; width:250px; max-height:320px; overflow-y:auto; background:var(--panel); border:1px solid var(--line2); border-radius:14px; padding:6px;
  box-shadow:0 18px 40px -16px rgba(40,34,24,.35); display:flex; flex-direction:column; }
.mi{ display:flex; align-items:center; gap:8px; width:100%; min-height:36px; padding:0 10px; border-radius:9px; background:transparent; text-align:left;
  font-weight:400; font-size:13.5px; color:var(--ink); white-space:nowrap; }
.mi:hover, .mi.on{ background:var(--hov); }
.mi span{ font-size:11.5px; color:var(--sub); margin-left:auto; }
.mi.danger{ color:#a2412f; }
.mi .ldot{ margin:0 3px 0 0; }
.menu[hidden]{ display:none; }
/* 设置页的输入框和按钮（原来只在 .fpanel 里有样式，设置页里是浏览器默认样子） */
.ss-wrap input:not([type=checkbox]):not([type=date]){ display:block; width:100%; height:34px; padding:0 10px; border-radius:9px; border:1px solid transparent;
  background:var(--field); color:var(--ink); font:inherit; font-size:13px; outline:none; }
.ss-wrap input:not([type=checkbox]):not([type=date]):focus{ background:var(--panel); border-color:var(--accent); box-shadow:0 0 0 3.5px var(--ring); }
.ss-wrap .primary{ height:34px; padding:0 16px; border-radius:10px; background:var(--ink); color:var(--panel); font-weight:500; font-size:13px; margin-top:12px; }
.ss-wrap .sec{ height:32px; padding:0 12px; border-radius:9px; border:1px solid var(--line2); background:var(--panel); color:var(--ink); font-weight:400; font-size:13px; flex-shrink:0; }
.ss-wrap .addrow .sec{ margin-top:12px; height:34px; }
.ss-wrap .sec:hover{ border-color:var(--line3); }
/* 设置 › AI 来源 */
#segSource button.soon{ color:var(--faint); }
#segSource button small{ font-size:10.5px; font-weight:400; margin-left:3px; }
.aiprivacy{ display:flex; gap:10px; margin:6px 0 0; padding:12px 14px; border-radius:12px; background:var(--amberSoft); border:1px solid var(--amberLine); font-size:13px; color:var(--ink2); line-height:1.6; }
.aiprivacy:empty{ display:none; }
/* 第一次用 AI 的提示 */
.aiconsent-veil{ position:fixed; inset:0; z-index:400; background:rgba(30,26,20,.18); display:flex; align-items:center; justify-content:center; padding:16px; }
.aiconsent{ width:420px; max-width:100%; background:var(--panel); border:1px solid var(--line2); border-radius:16px; padding:18px 18px 14px; box-shadow:0 18px 40px -16px rgba(40,34,24,.4); line-height:1.6; }
.aiconsent h3{ font-family:var(--serif); font-weight:500; font-size:18px; margin:0 0 6px; }
.aiconsent p{ margin:0 0 14px; color:var(--ink2); font-size:13.5px; }
.aiconsent .row{ display:flex; gap:8px; justify-content:flex-end; }
/* ---- 搜索（侧栏「搜索 ⌘F」→ 整页搜索 → 结果里逐条读） ---- */
.nav-item .navkbd{ margin-left:auto; font-size:11.5px; color:var(--sub); font-weight:400; letter-spacing:.04em; }
.sbox{ display:flex; align-items:center; gap:10px; height:46px; padding:0 16px; margin:0 0 14px; border-radius:14px; border:1px solid var(--line2); background:var(--panel); }
.sbox:focus-within{ border-color:var(--line3); box-shadow:0 0 0 3.5px var(--ring); }
.sbox svg{ color:var(--sub); flex-shrink:0; }
.sbox input{ flex:1; min-width:0; height:100%; padding:0; border:0; background:transparent; outline:none; box-shadow:none; color:var(--ink); font:inherit; font-size:15px; }
.sbox .scount{ font-size:12.5px; color:var(--sub); white-space:nowrap; font-variant-numeric:tabular-nums; }
.schips{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 6px; }
.schip{ height:28px; padding:0 12px; border-radius:14px; border:1px solid var(--line2); background:transparent; color:var(--ink2); font-size:12.5px; font-weight:400;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.schip:hover{ border-color:var(--line3); color:var(--ink); }
.schip i{ font-style:normal; color:var(--sub); font-variant-numeric:tabular-nums; }
.schip.on{ background:var(--ink); border-color:var(--ink); color:var(--panel); }
.schip.on i{ color:inherit; opacity:.65; }
.srow .bt1{ display:flex; align-items:center; gap:8px; }
.srow .bt1 .tt{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.srow .bt1 .badge{ margin-left:0; flex-shrink:0; vertical-align:0; }

.spanel{ margin-top:28px; background:var(--panel); border:1px solid var(--line2); border-radius:16px; padding:14px 18px 8px; }
.spanel .ph{ display:flex; font-size:12px; color:var(--sub); margin-bottom:4px; font-variant-numeric:tabular-nums; }

.adds{ display:flex; gap:8px; flex-wrap:wrap; margin-top:22px; }

/* 底栏：铺满窗口底部，左边键位、右边主操作 */
.dfoot{ position:sticky; bottom:-70px; margin:26px -12px 0; padding:12px 12px 14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap;

/* 专注阅读（「···」里进入）：侧栏收起；退出钮放在顶栏中间，不压住右侧按钮 */

.mtool{ white-space:nowrap; }

/* ⑫ Toast：弹性弹起、走时滑落（旧版是瞬间闪现） */
function toast(m, undo, actionLabel){

  if(undo){
    var b=document.createElement('button'); b.type='button'; b.className='undo'; b.textContent=actionLabel||'撤销'; b.id=actionLabel?'permissionSettings':'trashUndo';
    b.onclick=function(){ b.disabled=true; undo().catch(function(err){ toast(err.message); }); };
    e.appendChild(b);
  }
  e.classList.remove('show','hide'); void e.offsetWidth;
  e.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){
    e.classList.remove('show'); e.classList.add('hide');
    setTimeout(function(){ e.classList.remove('hide'); },320);
  },undo?8000:2400);
}
function permissionToast(p){

    function(){return TAPI.invoke(ax?'open_ax_settings':'open_screen_settings');},'打开系统设置');

        return api('POST','/api/suggestions/'+it.id+'/restore').then(function(){ return load(false); }).then(function(){ toast('已恢复'); });
      });

}
/* ⑨ 数字翻滚：值变化时旧数字上滚出、新数字落下（rollMem 跨重绘记住旧值） */
function rollTo(id, txt){
  var el=gid(id);
  var from=state.rollMem.hasOwnProperty(id)?state.rollMem[id]:(el?el.textContent:txt);
  state.rollMem[id]=txt;
  if(!el || String(from)===String(txt)) return;
  el.innerHTML='<span class="r-old">'+esc(from)+'</span><span class="r-new">'+esc(txt)+'</span>';
  el.classList.add('roll');
  setTimeout(function(){ el.textContent=txt; el.classList.remove('roll'); },420);
}
/* 右栏保存后的统一刷新（从 bindEntry 提升为全局，patchStatus 也要用） */
function refresh(p){ p.then(function(){ load(false); }).catch(function(e){ toast(e.message); }); }
/* ⑤⑥⑦⑧ 状态变更统一入口：状态点弹跳 / 完成果冻 / 专注条滑入 / 放弃侧滑退场 */
function patchStatus(it, st){
  var cardEl=document.querySelector('.card[data-id="'+it.id+'"]');
  state.fx.dotPop=it.id;
  if(st==='done') state.fx.jelly=it.id;
  if(st==='doing') state.fx.focusIn=true;
  if(st==='dropped' && cardEl && state.view.t!=='all'){
    // 非「全部记录」视图才侧滑退场；全部记录里放弃 = 原地变半透明
    cardEl.style.maxHeight=cardEl.offsetHeight+'px';
    void cardEl.offsetWidth;
    cardEl.classList.add('bye');
    setTimeout(function(){ refresh(api('PATCH','/api/suggestions/'+it.id,{status:st})); },380);
    return;
  }
  refresh(api('PATCH','/api/suggestions/'+it.id,{status:st}));
}
/* ⑤ 分段滑块定位（instant=true 首次摆放不做动画） */
function moveSeg(sliderId, btnSel, btn, instant){
  var sl=gid(sliderId); if(!sl) return;
  if(!btn){
    Array.prototype.forEach.call(document.querySelectorAll(btnSel),function(b){
      if(b.classList.contains('on')) btn=b;
    });
  }
  if(!btn) return;
  if(instant) sl.style.transition='none';
  sl.style.left=btn.offsetLeft+'px';
  sl.style.width=btn.offsetWidth+'px';
  if(instant){ void sl.offsetWidth; sl.style.transition=''; }
}
/* ③ 侧栏选中滑块跟随当前高亮行 */
function movePill(){
  var sc=document.querySelector('.side-scroll');
  var pill=gid('navPill');
  if(!sc||!pill) return;

  if(!on || !on.offsetParent){ pill.style.opacity='0'; return; }

  pill.style.height=on.offsetHeight+'px';
}
window.addEventListener('resize', movePill);
/* 双运行时：打包成 App 时走 Tauri 原生命令；浏览器打开时走 HTTP（与旧版完全兼容） */
var TAPI = (window.__TAURI__ && window.__TAURI__.core) ? window.__TAURI__.core : null;
/* 诊断：脚本错误与关键事件写进纳言日志（nayan.log） */
window.addEventListener('error', function (e) {
  try { TAPI.invoke('js_log', { msg: 'JS错误: ' + e.message + ' @' + e.lineno }); } catch (_) {}
});
window.addEventListener('unhandledrejection', function (e) {
  try { TAPI.invoke('js_log', { msg: 'Promise拒绝: ' + String(e.reason) }); } catch (_) {}
});

/* 品牌位：第四版白瓷小方块 + 蓝缝（纯 CSS，不再取真实 App 图标） */
function api(method,url,body){
  if (TAPI) {
    return TAPI.invoke('api',{method:method,path:url,body:body||null}).catch(function(e){
      throw new Error(typeof e==='string'?e:((e&&e.message)||'未知错误'));
    });
  }
  var o={ method:method, headers:{'Content-Type':'application/json'} };
  if(body) o.body=JSON.stringify(body);
  return fetch(url,o).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(d){
      if(!r.ok){
        /* READER-CONTRACT-REPAIR-01：保留 HTTP status/body 为错误元数据（message 语义不变），
           供详情 reader 兼容分类做可判定判断；其他调用方只读 message，不受影响。 */
        var er=new Error(d&&d.error?d.error:('HTTP '+r.status));
        er.status=r.status; er.body=d;
        throw er;
      }
      return d;
    });
  });
}
/* 复制出口（测试接缝）：测试实例由外部注入 window.__NAYAN_TEST_CLIP_SINK__ 记录载荷，

function copyTextOut(s){
  if(typeof window.__NAYAN_TEST_CLIP_SINK__==='function'){
    try{ window.__NAYAN_TEST_CLIP_SINK__(s); return Promise.resolve(true); }
    catch(e){ return Promise.reject(e); }
  }
  return navigator.clipboard.writeText(s);
}
function load(silent, stagger){

  return Promise.all([api('GET','/api/suggestions'), api('GET','/api/lists').catch(function(){ return null; }), api('GET','/api/compare-groups').catch(function(){ return null; }), api('GET','/api/suggestions?trash=1').catch(function(){ return null; })]).then(function(res){
    var items=res[0], lists=Array.isArray(res[1])?res[1]:[], groups=Array.isArray(res[2])?res[2]:[];
    var trash=Array.isArray(res[3])?res[3].filter(function(it){ return !!it.deleted_at; }):[];
    var snap=JSON.stringify(items)+'|'+JSON.stringify(lists)+'|'+JSON.stringify(groups)+'|'+JSON.stringify(trash);
    if(silent && snap===state.snap) return;      // 数据没变不重绘
    // 正在详情/表单里打字时跳过这轮自动刷新，4 秒后会再试（整页区 #board 也算：对比页的补充和问题、清单改名会被重画冲掉；搜索框的壳不重建，照常刷新）
    var a=document.activeElement;

    // ② 自动刷新发现新条目 → 让它飞进来（⌥⇧S / 剪贴板 / MCP 新收录都有入场感）
    if(silent && state.items.length){

      if(fresh.length) state.fx.flyIn=fresh;
    }
    state.snap=snap; state.items=items; state.trash=trash; state.lists=lists; state.groups=groups; renderAll(!!stagger);
  }).catch(function(e){ if(!silent) toast(e.message); });
}
function kindOf(it){ return it.kind||'suggestion'; }
function todayKey(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function pad2(n){ return (n<10?'0':'')+n; }
function dayKey(s){ return String(s||'').slice(0,10); }
function dayLabel(key){
  var d=new Date();
  var tk=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  if(key===tk) return '今天';
  var y=new Date(d.getTime()-86400000);
  var yk=y.getFullYear()+'-'+pad2(y.getMonth()+1)+'-'+pad2(y.getDate());
  if(key===yk) return '昨天';
  var p=key.split('-');
  return Number(p[1])+'月'+Number(p[2])+'日';
}
function fmtDateTime(s){
  var k=dayKey(s), t=String(s||'').slice(11,16);
  return dayLabel(k)+(t?' · '+t:'');
}
function projOf(it){ return (it.workspace||'').trim(); }

function bodyText(it){ return (it && (it.quote || it.body_text)) || ''; }

function findItem(id){ return state.items.filter(function(x){ return x.id===id; })[0] || null; }
function findStep(stepId){
  for (var i=0;i<state.items.length;i++){
    var ss=state.items[i].steps||[];
    for (var j=0;j<ss.length;j++) if(ss[j].id===stepId) return ss[j];

}
function looksCmd(t){

  return /^(sudo|brew|port|cd|ls|npm|npx|pnpm|yarn|node|python3?|pip3?|apt|apt-get|git|curl|wget|docker|ssh|scp|mkdir|touch|rm|mv|cp|tar|zip|unzip|chmod|chown|source|export|open|defaults|launchctl|codesign|xcode-select|conda|cargo|go|echo|cat|df|du|ps|kill|which|ln|find|grep|sed|awk|make|cmake|systemctl|ufw|nano|vim|vi|less)\b/.test(t);

function viewTitle(v){
  if(v.t==='all') return '全部记录';
  if(v.t==='board') return '收件箱';       // 钉板下隐藏的列表沿用收件箱口径
  if(v.t==='triage') return '整理';
  if(v.t==='lread' || v.t==='list'){ var l0=listById(v.list); return l0?l0.name:'清单'; }
  if(v.t==='single') return '归档';
  if(v.t==='search' || v.t==='sread') return '搜索';
  if(v.t==='archive') return '归档';
  if(v.t==='inbox') return '收件箱';
  if(v.t==='today') return '今天';
  if(v.t==='kind') return KIND_NAME[v.kind]||'';
  if(v.t==='tool') return (TOOL_LABEL[v.tool]||v.tool);
  if(v.t==='proj') return v.proj?lastSeg(v.proj):'未归属';
  if(v.t==='projtool') return (TOOL_LABEL[v.tool]||v.tool);
  if(v.t==='session') return sessDisplay(v.tool, v.session||'', v.wid||0);
  return '';
}
function visibleItems(){
  var q=state.q.toLowerCase(); var v=state.view;
  if(v.t==='sread') return searchResults();   // 从搜索结果进来读：上下条就在结果里走
  return state.items.filter(function(it){
    if(v.t==='single' && it.id!==state.sel) return false;
    if(v.t==='board' && !isInbox(it)) return false;
    if(v.t==='triage' && (['inbox','todo','doing'].indexOf(it.status)<0 || inList(it) || (isInbox(it) && groupedIds()[it.id]))) return false;
    if(v.t==='lread' && !(inList(it) && it.list_id===v.list)) return false;
    if(v.t==='archive' && it.status!=='done' && it.status!=='dropped') return false;
    if(v.t==='inbox' && !isInbox(it)) return false;
    if(v.t==='today' && dayKey(it.created_at)!==todayKey()) return false;
    if(v.t==='kind' && kindOf(it)!==v.kind) return false;
    if(v.t==='tool' && (it.source_tool||'other')!==v.tool) return false;
    if(v.t==='session' && ((it.source_tool||'other')!==v.tool || (it.session_ref||'')!==v.session || (it.window_id||0)!==(v.wid||0))) return false;
    if(v.t==='proj' && projOf(it)!==v.proj) return false;
    if(v.t==='projtool' && (projOf(it)!==v.proj || (it.source_tool||'other')!==v.tool)) return false;
    if(q){
      var hay=((it.title||'')+' '+bodyText(it)+' '+(it.my_note||'')+' '+(it.user_msg||'')).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
}

function bubbleSvg(){ return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 8.5-8.5 8.38 8.38 0 0 1 8.5 8.5z"/></svg>'; }
function folderSvg(){ return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>'; }
function chevRSvg(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>'; }
function docSvg(){ return '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>'; }
function lastSeg(p){ var s=String(p||'').replace(/\/+$/,''); var i=s.lastIndexOf('/'); return i>=0? s.slice(i+1) : s; }
function sessLabel(sr){ return String(sr||'').replace(/^窗口：/,'').trim()||'未命名会话'; }
/* ---------- 会话别名（B 进阶：同 App 多窗口靠 window_id 区分，名字靠手填别名） ---------- */
function akey(app,sr,wid){ return app+'\u0001'+sr+'\u0001'+(wid||0); }
function aliasFor(app,sr,wid){ return state.aliasMap[akey(app,sr,wid||0)]||''; }
/* 同 App 同标题当前有几个并行窗口组（>1 时未命名的组带短编号区分） */
function widDup(tool,sr){
  var seen={};
  state.items.forEach(function(x){
    if((x.source_tool||'other')===tool && (x.session_ref||'')===sr) seen[x.window_id||0]=1;
  });
  return Object.keys(seen).length;
}
function sessDisplay(tool,sr,wid){
  var a=aliasFor(tool,sr,wid||0);
  if(a) return a;
  var base=sessLabel(sr);
  return widDup(tool,sr)>1 ? base+' ·'+String(wid||0).slice(-3) : base;
}
function loadAliases(){
  api('GET','/api/session-aliases').then(function(rows){
    var m={};
    (rows||[]).forEach(function(r){ if(r && r.alias) m[akey(r.app,r.session_ref,r.window_id||0)]=r.alias; });
    state.aliasMap=m;
    renderAll(false);
  }).catch(function(){});
}
function fillToolIcons(){
  if(!TAPI) return;
  var names={};
  state.items.forEach(function(it){ var t=it.source_tool||'other'; if(!names[t]) names[t]=1; });
  Object.keys(names).forEach(function(t){
    var key='nayan-ic-v2-'+t;
    var b64=null; try{ b64=localStorage.getItem(key); }catch(e){}

    TAPI.invoke('app_icon',{name:t}).then(function(d){

function paintIcon(tool,d){

function renderNav(){
  var c={ all:state.items.length, inbox:0, today:0, suggestion:0, idle:0 };
  var tk=todayKey();
  state.items.forEach(function(it){
    if(isInbox(it)) c.inbox++;

    c[kindOf(it)]++;
  });
  rollTo('cnt-inbox', inboxSingles().length+inboxGroups().length);   // 同题对比的一组算一条
  rollTo('cnt-today', c.today);
  rollTo('cnt-all', c.all);
  rollTo('cnt-suggestion', c.suggestion||'');
  rollTo('cnt-idle', c.idle||'');
  var nbd=0, nar=0;

    var t=it.source_tool||'other';
    if(tools[t]==null){ tools[t]={ count:0, sess:{}, sorder:[] }; torder.push(t); }
    tools[t].count++;
    var sr=it.session_ref||'';

      var sk=sr+'\u0002'+(it.window_id||0);
      if(tools[t].sess[sk]==null){ tools[t].sess[sk]={ n:0, ws:'', sr:sr, wid:it.window_id||0 }; tools[t].sorder.push(sk); }
      tools[t].sess[sk].n++;
      var w=projOf(it);
      if(w && !tools[t].sess[sk].ws) tools[t].sess[sk].ws=w;
    }
  });
  torder.sort(function(a,b){ return tools[b].count - tools[a].count; });
  var projs={}, porder=[];
  state.items.forEach(function(it){
    var w=projOf(it)||'';
    if(projs[w]==null){ projs[w]={ count:0, tools:{}, torder:[] }; porder.push(w); }
    var P=projs[w]; P.count++;
    var t=it.source_tool||'other';
    if(P.tools[t]==null){ P.tools[t]={ n:0, sess:{}, sorder:[] }; P.torder.push(t); }
    var T=P.tools[t]; T.n++;
    var sr=it.session_ref||'';
    if(sr.indexOf('窗口：')===0 && sr.length>3){
      var sk2=sr+'\u0002'+(it.window_id||0);
      if(T.sess[sk2]==null){ T.sess[sk2]={ n:0, sr:sr, wid:it.window_id||0 }; T.sorder.push(sk2); }
      T.sess[sk2].n++;
    }
  });
  porder.sort(function(a,b){ return projs[b].count - projs[a].count; });
  // 互通：软件维度正看某个会话时，切到项目模式能点亮它归属的项目
  var sessProj='';
  if(v.t==='session'){
    for(var si=0;si<state.items.length;si++){
      var sit=state.items[si];
      if((sit.source_tool||'other')===v.tool && (sit.session_ref||'')===v.session && projOf(sit)){ sessProj=projOf(sit); break; }
    }
  }
  var h='';
  if(state.sbMode==='proj'){
    porder.forEach(function(w){
      var P=projs[w];
      var wKey='P|'+w;
      var pOpen=state.treeOpen[wKey]!==false;
      var pSel=(v.t==='proj'&&v.proj===w)||(v.t==='projtool'&&v.proj===w)||(v.t==='session'&&sessProj===w);
      h+='<div class="nav-item'+(pSel?' on':'')+'" data-projrow="'+escQ(w)+'"'+(w?' title="'+escQ(w)+'"':'')+'>'+
        '<span class="pchev'+(pOpen?' open':'')+'" data-tglk="'+escQ(wKey)+'">'+chevRSvg()+'</span>'+
        '<span class="icw">'+folderSvg()+'</span>'+
        '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(w?lastSeg(w):'未归属')+'</span>'+
        '<span class="cnt">'+P.count+'</span></div>';
      if(pOpen){
        P.torder.sort(function(a,b){ return P.tools[b].n - P.tools[a].n; });
        h+='<div class="subwrap" data-sw="'+escQ(wKey)+'">';
        P.torder.forEach(function(t){
          var T=P.tools[t];
          var ptKey='PT|'+w+'|'+t;
          var ptOpen=state.treeOpen[ptKey]!==false;
          var ptSel=(v.t==='projtool'&&v.proj===w&&v.tool===t);
          var hasS=T.sorder.length>=2;
          h+='<div class="nav-item sub'+(ptSel?' on':'')+'" data-ptproj="'+escQ(w)+'" data-pttool="'+escQ(t)+'">'+
            (hasS?'<span class="pchev'+(ptOpen?' open':'')+'" data-tglk="'+escQ(ptKey)+'">'+chevRSvg()+'</span>':'<span class="pchev"></span>')+
            '<span class="icw" data-ic-tool="'+escQ(t)+'">'+bubbleSvg()+'</span>'+
            '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(TOOL_LABEL[t]||t)+'</span>'+
            '<span class="cnt">'+T.n+'</span></div>';
          if(ptOpen){
            T.sorder.sort(function(a,b){ return T.sess[b].n - T.sess[a].n; });
            h+='<div class="subwrap" data-sw="'+escQ(ptKey)+'">';
            T.sorder.forEach(function(sk){
              var se=T.sess[sk];
              var sSel=(v.t==='session'&&v.tool===t&&v.session===se.sr&&(v.wid||0)===se.wid);
              h+='<div class="nav-item sub2'+(sSel?' on':'')+'" data-sstool="'+escQ(t)+'" data-sess="'+escQ(se.sr)+'" data-wid="'+se.wid+'" title="'+escQ(aliasFor(t,se.sr,se.wid)?('别名 · 原会话：'+sessLabel(se.sr)):se.sr)+'">'+
                '<span class="pchev"></span>'+
                '<span class="icw">'+docSvg()+'</span>'+
                '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(sessDisplay(t, se.sr, se.wid))+'</span>'+
                '<span class="cnt">'+se.n+'</span></div>';
            });
            h+='</div>';
          }
        });
        h+='</div>';
      }
    });
    if(!porder.length) h='<div class="side-empty">还没有项目——收录时填上项目就会归到这里</div>';
  } else {
  torder.forEach(function(t){
    var tg=tools[t];
    var tOpen=state.projOpen2['T|'+t]!==false;
    var tSel=(v.t==='tool'&&v.tool===t)||(v.t==='session'&&v.tool===t);
    var hasS=tg.sorder.length>=2; // 单会话时来源行即代表，不再展开重名的第三行
    h+='<div class="nav-item tool'+(tSel?' on':'')+'" data-tool="'+escQ(t)+'">'+
      (hasS?'<span class="pchev'+(tOpen?' open':'')+'" data-tglk2="T|'+escQ(t)+'">'+chevRSvg()+'</span>':'<span class="pchev"></span>')+
      '<span class="icw" data-ic-tool="'+escQ(t)+'">'+bubbleSvg()+'</span>'+
      '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(TOOL_LABEL[t]||t)+'</span>'+
      '<span class="cnt">'+tg.count+'</span></div>';
    if(tOpen){
      tg.sorder.sort(function(a,b){ return tools[t].sess[b].n - tools[t].sess[a].n; });
      h+='<div class="subwrap" data-sw="T|'+escQ(t)+'">';
      tg.sorder.forEach(function(sk){
        var se=tools[t].sess[sk];
        var sSel=(v.t==='session'&&v.tool===t&&v.session===se.sr&&(v.wid||0)===se.wid);
        h+='<div class="nav-item sub2'+(sSel?' on':'')+'" data-tool="'+escQ(t)+'" data-session="'+escQ(se.sr)+'" data-wid="'+se.wid+'" title="'+escQ(aliasFor(t,se.sr,se.wid)?('别名 · 原会话：'+sessLabel(se.sr)):se.sr)+'">'+
          '<span class="pchev"></span>'+
          '<span class="icw">'+docSvg()+'</span>'+
          '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(sessDisplay(t, se.sr, se.wid))+'</span>'+
          (se.ws?'<span style="color:var(--sub);font-size:11px;flex-shrink:0" title="'+escQ(se.ws)+'">📁 '+esc(lastSeg(se.ws))+'</span>':'')+
          '<span class="cnt">'+se.n+'</span></div>';
      });
      h+='</div>';
    }
  });
    if(!torder.length) h='<div class="side-empty">还没有来源——用 ⌥S/⌥Z 捕获后自动出现</div>';
  }
  gid('projList').innerHTML=h;
  fillToolIcons();
  // 树折叠：展开键按前缀路由到各自模式的展开状态表（T|=软件维度，P|/PT|=项目维度）
  function treeToggle(k){
    var map=(k.indexOf('T|')===0)?state.projOpen2:state.treeOpen;
    var willOpen=map[k]===false;
    map[k]=willOpen;
    if(willOpen){
      renderNav(); movePill();
      var sw2=null;
      Array.prototype.forEach.call(document.querySelectorAll('.subwrap'),function(x){
        if(x.getAttribute('data-sw')===k) sw2=x;
      });
      if(sw2){ sw2.classList.add('fold'); void sw2.offsetWidth; sw2.classList.remove('fold'); }
      return;
    }
    // ④ 收起：先弹性塌合再重绘，展开则直接重绘（新行从 max-height 0 弹开）
    var sw=null;
    Array.prototype.forEach.call(document.querySelectorAll('.subwrap'),function(x){
      if(x.getAttribute('data-sw')===k) sw=x;
    });
    if(sw){
      sw.style.maxHeight=sw.scrollHeight+'px';
      void sw.offsetWidth;
      sw.classList.add('fold');
      setTimeout(function(){ renderNav(); movePill(); },430);
    } else { renderNav(); movePill(); }
  }
  Array.prototype.forEach.call(gid('projList').querySelectorAll('.nav-item'),function(el){
    el.onclick=function(ev){
      var tk=ev.target.closest?ev.target.closest('[data-tglk]'):null;
      if(tk){ treeToggle(tk.getAttribute('data-tglk')); return; }
      var tk2=ev.target.closest?ev.target.closest('[data-tglk2]'):null;

      var pr=el.getAttribute('data-projrow');

      var ptp=el.getAttribute('data-ptproj');
      if(ptp!=null){ state.view={ t:'projtool', proj:ptp, tool:el.getAttribute('data-pttool') }; renderAll(true); return; }
      var pss=el.getAttribute('data-sess');
      if(pss!=null){ state.view={ t:'session', tool:el.getAttribute('data-sstool'), session:pss, wid:Number(el.getAttribute('data-wid')||0) }; renderAll(true); return; }
      var sr=el.getAttribute('data-session');
      if(sr!=null){ state.view={ t:'session', tool:el.getAttribute('data-tool'), session:sr, wid:Number(el.getAttribute('data-wid')||0) }; renderAll(true); return; }
      state.view = { t:'tool', tool:el.getAttribute('data-tool') };
      renderAll(true);

  });

  // 项目 datalist（新建表单用）
  var dl='';

  state.items.forEach(function(it){ var w=projOf(it); if(w) wsSet[w]=1; });

  gid('projOptions').innerHTML=dl;

  gid('vtitle').textContent=viewTitle(v);
  var n=visibleItems().length;

  rollTo('vcount', n?n+' 条':'');

  if((v.t==='proj'||v.t==='projtool') && v.proj) vsubTxt=v.proj+(v.t==='projtool'?' · '+(TOOL_LABEL[v.tool]||v.tool):'');
  gid('vsub').textContent=vsubTxt;
  renderRecents();
  movePill();
}

function card(it, animCls, animDelay){
  var sel=state.sel===it.id?' sel':'';
  var steps=it.steps||[];
  var meta=[];
  meta.push('<span class="tchip">'+esc(toolName(it))+'</span>');
  var pj=projOf(it); if(pj) meta.push('<span class="pj">'+esc(lastSeg(pj))+'</span>');
  var sm=sumOf(it,110);
  if(KIND_TAG[kindOf(it)]) meta.push('<span class="ktag">'+KIND_TAG[kindOf(it)]+'</span>');
  if(steps.length){
    var dn=steps.filter(function(s){ return s.done; }).length;
    meta.push('<span class="okn">✓ '+dn+'/'+steps.length+'</span>');
  }
  meta.push('<span class="grow"></span>');
  meta.push('<span>'+esc(String(it.created_at||'').slice(11,16))+'</span>');
  // ⑥ 刚改过状态的卡片圆点弹跳变色；⑦ 刚完成的卡片果冻一下
  var dotCls='cdot s-'+it.status+(state.fx.dotPop===it.id?' morph':'');
  var jellyCls=state.fx.jelly===it.id?' jelly':'';
  return '<div class="card '+it.status+sel+jellyCls+(animCls?' '+animCls:'')+'" data-id="'+it.id+'"'+
    (animDelay?' style="animation-delay:'+animDelay+'ms"':'')+'>'+
    '<div class="ctitle"><span class="'+dotCls+'" title="'+STATUS_LABEL[it.status]+'"></span>'+
    '<span style="flex:1">'+esc(it.title)+'</span></div>'+
    (sm?'<div class="csum">'+esc(sm)+'</div>':'')+
    '<div class="cmeta">'+meta.join('')+'</div>'+
    '</div>';
}

      if(act==='cview'){

        var q=gid('aiquote'), on=state.cleanView[it.id]!=='orig';
        if(q) q.classList.toggle('showclean', on);
        Array.prototype.forEach.call(box.querySelectorAll('[data-act="cview"]'),function(b){ var me=(b.getAttribute('data-v')==='clean')===on; b.classList.toggle('on',me); b.setAttribute('aria-pressed',String(me)); });
        if(!on){ var qb=gid('aibody'); if(q && qb && !qb.__nayanDecision && !it.quote) q.style.display=''; }
        return;
      }
      if(act==='copyquote' && aiCleanShown(it) && gid('aiquote') && gid('aiquote').classList.contains('showclean')){
        copyTextOut(aiCleanOf(it).text).then(function(){ btn.classList.add('ok'); setTimeout(function(){ btn.classList.remove('ok'); },1100); })
          .catch(function(e){ toast('复制失败：'+((e&&e.message)||String(e))); });
        return;
      }
      if(act==='copyquote'||act==='copyorig'){
        /* P1-T07：Copy Response / Copy Original——先过统一资格复核（槽代次/身份/
           decision 对象同一性/元素在文档/当前选择），再按合同分派载荷；失败给
           明确 toast 不显成功态、不吞 rejection；空字符串是合法成功结果。 */
        var cc=copyContextFor(it);
        if(act==='copyquote'){
          var pl=cc.ok?copyResponsePayload(cc.ctx.decision,cc.el):cc;
          if(!pl||pl.ok!==true){ toast((pl&&pl.reason)||'正文不可用'); return; }
          copyTextOut(pl.payload).then(function(){
            btn.classList.add('ok');
            setTimeout(function(){ btn.classList.remove('ok'); },1100);
          }).catch(function(e){ toast('复制失败：'+((e&&e.message)||String(e))); });
          return;
        }
        /* Copy Original：legacy=保存的原 quote（同步）；bytes=显式拒绝；信封 text/html=
           精简视图不带 original——按 T07 单从保留的完整 /content 取真实 original，
           三重复核（返回体 id、信封 request_id===identity.requestId、信封 canonical===
           decision.text 全文快照）。R1-SR-F03：发起时按值保存读代次/上下文对象/身份/
           decision，异步返回后逐项复核仍是**发起时**上下文（新上下文有效≠旧操作有效），
           换代/切换/重渲一律零写入。 */
        if(!cc.ok){ toast(cc.reason||'正文不可用'); return; }
        var ctxO=cc.ctx;
        /* canonicalText：发起时按值快照的全文标量（字符串不可变，对象后续原位变文/换 text
           都不影响此值）——响应处以它双核：当前文本仍等于发起全文 && 返回 canonical 等于发起全文 */
        var copOrigStart={read:ctxO.readSeq,ctx:ctxO,identity:ctxO.identity,decision:ctxO.decision,el:cc.el,item:it.id,canonicalText:ctxO.decision.text};
        /* 加载失败/不可渲染（且非 bytes 语义）：显式失败原因，不尝试取原文、不产出降级载荷 */
        if(ctxO.decision.renderable!==true){ toast(ctxO.failReason||ctxO.decision.reason||'正文不可用'); return; }
        if(ctxO.legacy||ctxO.originalKind==='bytes'){
          var po=ctxO.originalKind==='bytes'
            ?copyOriginalPayload({kind:'bytes'},'',true)   /* bytes 语义：显式拒绝（hasEnvelope=true 分支） */
            :copyOriginalPayload(null, it.quote||'', false); /* legacy：保存的原 quote */
          if(!po||po.ok!==true){ toast((po&&po.reason)||'无已保存原文'); return; }
          copyOriginalOk(btn,po.payload); return;
        }
        api('GET','/api/suggestions/'+it.id+'/content').then(function(body){
          var elNow=gid('aibody');
          if(state.sel!==copOrigStart.item || !elNow || !document.body.contains(elNow)
             || elNow!==copOrigStart.el
             || elNow.__nayanReaderRead!==copOrigStart.read
             || elNow.__nayanCopy!==copOrigStart.ctx
             || elNow.__nayanDecision!==copOrigStart.decision
             || elNow.__nayanIdentity!==copOrigStart.identity
             || elNow.__nayanDecision.text!==copOrigStart.canonicalText){ toast('复制取消：正文上下文已变化'); return; }
          if(!body||typeof body!=='object'||body.id!==it.id||body.legacy){ toast('原文读取失败：响应不符'); return; }
          var env2=null;
          try{ env2=JSON.parse(body.envelope_json||''); }catch(e){ env2=null; }
          if(!env2||!env2.original||env2.request_id!==copOrigStart.identity.requestId
             ||env2.canonical!==copOrigStart.canonicalText
             ||typeof env2.original.text!=='string'){ toast('原文校验失败：身份或全文不符'); return; }
          copyOriginalOk(btn,env2.original.text);
        }).catch(function(e){ toast('原文读取失败：'+((e&&e.message)||String(e))); });
        return;
      }
      /* P1-T06 回退开关：rich ↔ 源码就地切换（全局记忆；重渲不重新请求）。
         切到源码 = 存储源文本原样可读可复制；再切回 = 重新受限渲染。
         P1-B06-PERF-01：fillReaderBody 已取消在途旧任务；sidecar 由其完成回调
         就地重挂缓存（内容不变才挂得上），无需在此重复挂载。 */
      if(act==='togglerich'){
        var off;
        try{ off = localStorage.getItem('nayan-rich-disable')==='1'; }catch(e){ off=false; }
        try{ localStorage.setItem('nayan-rich-disable', off?'0':'1'); }catch(e){}
        var bEl=gid('aibody');
        if(bEl && bEl.__nayanDecision) fillReaderBody(bEl, bEl.__nayanDecision);
        return;
      }
      var stepEl=btn.closest?btn.closest('.step'):null;
      var step=stepEl?findStep(Number(stepEl.getAttribute('data-step'))):null;
      if(act==='jumps'){
        if(!TAPI){ toast('仅桌面 App 支持'); return; }
        toast('正在切到来源窗口…');
        TAPI.invoke('jump_to_source',{sessionRef:it.session_ref||'',sourceTool:it.source_tool||''})
          .then(function(r){ toast('✓ 已切到来源窗口'); })
          .catch(function(e){ toast('✗ '+(e.message||'来源没找到')); });
        return;
      }
      if(act==='goses'){
        state.view={ t:'session', tool:it.source_tool||'other', session:it.session_ref||'', wid:it.window_id||0 };
        renderAll(true); return;
      }
      if(act==='renses'){
        var slot=gid('sesSlot'), dm=btn.closest('details'); if(dm) dm.open=false;
        if(slot){ var sp=gid('sesSep'); if(sp) sp.hidden=false; startSesEdit(it, slot); }
        return;
      }
      if(act==='attadd'){
        if(!TAPI){ toast('仅桌面 App 支持选择文件'); return; }
        TAPI.invoke('pick_files').then(function(paths){
          if(paths && paths.length) addAtts(it, paths);
        }).catch(function(e){ toast(e.message||String(e)); });
        return;
      }
      /* 附件行的 👁/⌕/✕ 按钮在 renderAtts 里绑（那时才渲染出来） */
      if(act==='editproj'){ startProjEdit(it, btn); return; }
      if(act==='toggle'&&step){
        // ⑦ 勾上才播描画动画；重绘后该行带 fx-done-on 重放一次
        state.fx.stepFx=step.done?0:step.id;
        refresh(api('PATCH','/api/steps/'+step.id,{done:!step.done}));
      }
      else if(act==='copystep'&&step){
        copyTextOut(step.content).then(function(){
          btn.textContent='✓'; btn.classList.add('okpop');
          setTimeout(function(){ btn.textContent='⧉'; btn.classList.remove('okpop'); },900);
        });
      }
      else if(act==='delstep'&&step){ refresh(api('DELETE','/api/steps/'+step.id)); }
      else if(act==='addstep'){
        var input=box.querySelector('.sadd input[data-add="'+it.id+'"]');
        var v=(input&&input.value||'').trim();
        if(!v) return;
        input.value='';
        refresh(api('POST','/api/suggestions/'+it.id+'/steps',{mode:'append',steps:[{content:v,is_cmd:looksCmd(v)}]}));
      }
      else if(act==='linesplit'){
        var lines=bodyText(it).split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
        if(lines.length<2){ toast('原文不足两行，试试 AI 拆步'); return; }
        refresh(api('POST','/api/suggestions/'+it.id+'/steps',{steps:lines.map(function(l){ return {content:l,is_cmd:looksCmd(l)}; })}));
      }
      else if(act==='aisplit'){
        // 开了 AI（且同意过）用 AI 拆；没开 / 这次不用 / AI 失败 → 按行（一行就按句子）拆，不报错
        var localSplit=function(note){
          var ls=localSteps(it);
          if(ls.length<2){ toast('原文太短，拆不出两步'); return; }
          state.fx.stepsIn=true;
          refresh(api('POST','/api/suggestions/'+it.id+'/steps',{steps:ls.map(function(l){ return {content:l,is_cmd:looksCmd(l)}; })}));
          if(note) toast(note);
        };
        if(!aiOn('split')){ localSplit(''); return; }
        aiConsent('split').then(function(ok){
          if(!ok){ localSplit(''); return; }
          // ⑮ 按钮 label 沉降 + 流光 shimmer，拆完步骤逐条弹入
          btn.disabled=true; btn.classList.add('busy'); aiBusy=true;
          api('POST','/api/ai/split/'+it.id).then(function(r){
            aiBusy=false;
            if(r && r.no_steps){ btn.disabled=false; btn.classList.remove('busy'); toast('这一条没有要动手做的步骤，就不拆了'); return; }
            state.fx.stepsIn=true; load(false);
          }).catch(function(e){
            aiBusy=false; btn.disabled=false; btn.classList.remove('busy');
            localSplit('AI 拆步没成功（'+e.message+'），先按行拆开');
          });
        });
      }
      else if(act==='del'){
        // ⑧ 删除：卡片先侧滑塌合，再发请求
        var delCard=document.querySelector('.card[data-id="'+it.id+'"]');
        // 阅读模式：删除后接着看下一条；其他视图保持原行为（清空选择）
        var delNext=document.body.classList.contains('view-reader')?(adjId(it.id,1)||adjId(it.id,-1)):0;
        state.sel=delNext; state.pane=delNext?{mode:'entry'}:{mode:'empty'};
        if(delCard){
          delCard.style.maxHeight=delCard.offsetHeight+'px';
          void delCard.offsetWidth;
          delCard.classList.add('bye');
          setTimeout(function(){ moveToTrash(it); },340);
        } else { moveToTrash(it); }
      }
      else if(act==='inbox'){ patchStatus(it,'inbox'); }
      else if(act==='dropped'){ patchStatus(it,'dropped'); }
    };
  });
  // 执行结果：⏎ 保存并跳下一步，失焦也保存
  Array.prototype.forEach.call(box.querySelectorAll('.sresult'),function(input){
    var stepEl=input.closest('.step');
    var stepId=Number(stepEl.getAttribute('data-step'));
    function save(){
      var step=findStep(stepId); if(!step) return;
      var v=input.value.trim();
      if(v===(step.result||'')) return;
      state.refocusStep=nextStepIdAfter(it, stepId);
      api('PATCH','/api/steps/'+stepId,{result:v}).then(function(){ load(false); })
        .catch(function(e){ toast(e.message); });
    }
    input.addEventListener('keydown',function(ev){
      if(ev.key==='Enter'){ ev.preventDefault(); input.blur(); }
    });
    input.addEventListener('blur',save);
  });
  // 保存结果后焦点跳到下一步的结果框（贴结果→执行→再贴 的循环）
  if(state.refocusStep){
    var el=box.querySelector('.step[data-step="'+state.refocusStep+'"] .sresult');
    state.refocusStep=0;
    if(el){ el.closest('.step').classList.add('res-open'); el.focus(); var L=el.value.length; try{ el.setSelectionRange(L,L); }catch(e){} }
  }
}

function cancelHotkeyRecording(){
  var record=hotkeyRecording; if(!record)return;
  hotkeyRecording=null; clearTimeout(record.timer);
  if(TAPI)TAPI.invoke('hotkey_capture_cancel').catch(function(){});
  [1,2].forEach(function(slot){var b=gid('hk-set-'+slot);if(b)b.disabled=false;});
}
function bindCapture(){
  loadSettings();
  Array.prototype.forEach.call([1,2],function(slot){
    var btn=gid('hk-set-'+slot); if(!btn) return;
    var span=gid('hk-'+slot);
    btn.onclick=function(){
      if(!TAPI){toast('更改快捷键需要桌面版');return;}
      cancelHotkeyRecording();
      var record={timer:null};hotkeyRecording=record;
      [1,2].forEach(function(s){var b=gid('hk-set-'+s);if(b)b.disabled=true;});
      span.textContent='按下新快捷键…';
      var tries=0;
      var finish=function(cancel){
        if(hotkeyRecording!==record)return;
        if(cancel)cancelHotkeyRecording();else{hotkeyRecording=null;[1,2].forEach(function(s){var b=gid('hk-set-'+s);if(b)b.disabled=false;});}
        loadSettings();
      };
      var poll=function(){
        if(hotkeyRecording!==record)return;
        tries++;
        TAPI.invoke('hotkey_take',{slot:slot}).then(function(r){
          if(hotkeyRecording!==record)return;
          if(r.state==='waiting'){ if(tries<24){ record.timer=setTimeout(poll,250); return; } finish(true);toast('已取消');return; }
          if(r.state==='ok'){ toast('✓ 快捷键已改为 '+fmtHotkey(r.combo)); }
          else if(r.state==='error'){ toast('✗ '+r.error); }
          else if(r.state==='cancelled'){ toast('已取消'); }
          finish(false);
        }).catch(function(){finish(true);});
      };
      TAPI.invoke('hotkey_capture_start',{slot:slot}).then(function(){
        if(hotkeyRecording===record)record.timer=setTimeout(poll,300);
      }).catch(function(e){if(hotkeyRecording===record){finish(true);toast(e.message||String(e));}});
    };
  });
  gid('s-clip-scope').onchange=function(){
    api('POST','/api/settings',{clip_scope:gid('s-clip-scope').value}).then(function(){ toast('监听范围已更新'); }).catch(function(e){ toast(e.message); });

  };
  gid('s-clip').onchange=function(){
    var enabled=this.checked;
    api('POST','/api/settings',{clipboard_watch:enabled})
      .then(function(){ toast(enabled?'剪贴板监听已开启':'剪贴板监听已关闭'); })
      .catch(function(e){ toast(e.message); });

/* ---------- AI 来源：页面侧缓存 + 是否可用 + 第一次使用的提示 ---------- */
function setAiState(s){

}

  var on=AI_FEAT.filter(function(f){ return a.features[f[0]]; }).map(function(f){ return '「'+f[1]+'」'; }).concat(['「重起标题」（阅读页点了才发）']);
  gid('aiPrivacy').innerHTML=a.source!=='own'?'':('<span aria-hidden="true">⚠︎</span><span>'+(on.length?on.join('')+'会把<b>那一条的原文</b>发给 '+esc(a.host||'你填的接口')+(a.provider==='ollama'?'（本机，不出这台电脑）':'')+'。':'')+
    '关掉的功能完全在本机处理。纳言订阅上线后，内容经纳言的服务器转发，不保存。</span>');

/* 第一次用某个 AI 功能：告诉用户原文会发给谁；同意过的功能不再问。resolve(true)=用 AI，false=这次不用 */
function aiConsent(f, label){
  var a=state.ai; if(!a) return Promise.resolve(false);
  if(a.consent.indexOf(f)>=0) return Promise.resolve(true);
  var name=label||(AI_FEAT.filter(function(x){ return x[0]===f; })[0]||[f,f])[1];
  return new Promise(function(res){
    var v=document.createElement('div'); v.className='aiconsent-veil';
    v.innerHTML='<div class="aiconsent" role="dialog" aria-label="第一次用 AI"><h3>第一次用 AI '+esc(name)+'</h3>'+
      '<p>这段内容会发给 '+esc(a.host||'你填的接口')+' 整理。之后同一个功能不再问；随时可以在「设置 › AI」里关掉。</p>'+
      '<div class="row"><button type="button" class="lk" data-c="no">这次不用 AI</button><button type="button" class="cta" data-c="yes">好，发送</button></div></div>';
    document.body.appendChild(v);
    v.querySelector('[data-c="yes"]').focus();
    function done(ok){
      v.remove();
      if(!ok){ res(false); return; }
      api('POST','/api/settings',{ ai_consent:f }).then(function(r){ setAiState(r); res(true); }).catch(function(){ res(true); });
    }
    v.onclick=function(ev){ var b=ev.target.closest&&ev.target.closest('[data-c]'); if(b) done(b.getAttribute('data-c')==='yes'); else if(ev.target===v) done(false); };
    v.onkeydown=function(ev){ if(ev.key==='Escape'){ ev.preventDefault(); done(false); } };
  });
}
/* 不靠 AI 的拆步：多行按行拆；一行就按句子拆 */
function localSteps(it){
  var t=bodyText(it)||String(it.title||'');
  var lines=t.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
  if(lines.length<2) lines=t.split(/(?<=[。！？!?；;])\s*/).map(function(l){ return l.trim(); }).filter(Boolean);
  return lines.slice(0,30);
}
/* 钉板底部与「快捷键备忘」里的键位读真实设置（改了快捷键这里跟着变；没取到时保持默认 ⌥S/⌥Z） */
function paintHotkeyHints(s){
  var a=s&&s.hotkey?fmtHotkey(s.hotkey):'⌥S', b=s&&s.hotkey_box?fmtHotkey(s.hotkey_box):'⌥Z';
  var bh=gid('boardHotkeys'); if(bh) bh.textContent=a+' 划词'; var sc=gid('screenCapture'); if(sc) sc.textContent=b+' 框选';
  var memo=gid('hkMemo'); if(memo) memo.textContent=a+' 划词捕获 · '+b+' 框选捕获 · ⌘, 打开本设置';
  Array.prototype.forEach.call(document.querySelectorAll('.hkPair'),function(el){ el.textContent=a+'/'+b; });
}
function fmtHotkey(s){
  return String(s||'').split('+').map(function(p){
    return {alt:'⌥',shift:'⇧',ctrl:'⌃',cmd:'⌘'}[p.trim().toLowerCase()]||p.trim().toUpperCase();
  }).join('');
}
