function fitTextarea(el){
  var cs=getComputedStyle(el);
  var min=parseFloat(cs.minHeight)||64, max=parseFloat(cs.maxHeight)||240;
  var scroll=el.scrollTop;
  el.style.height='auto';
  var height=el.scrollHeight+(parseFloat(cs.borderTopWidth)||0)+(parseFloat(cs.borderBottomWidth)||0);
  el.style.height=Math.max(min,Math.min(max,height))+'px';
  el.scrollTop=scroll;
}
function fitDetailTextareas(){
  gid('detail').querySelectorAll('textarea').forEach(fitTextarea);
}
gid('detail').addEventListener('input',function(ev){
  if(ev.target.tagName==='TEXTAREA') fitTextarea(ev.target);
});
window.addEventListener('resize',fitDetailTextareas);
/* ---------- R2/R3：摘要 / 钉板 / 最近待看 / 阅读导航 ---------- */
function plainSnip(t,n){
  t=String(t||'').slice(0,n*4);
  t=t.replace(/```[\s\S]*?```/g,' ').replace(/!?\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/[`*_>#|~]/g,'').replace(/\s+/g,' ').trim();
  return t.slice(0,n);
}
function sumOf(it,n){
  var t=plainSnip(bodyText(it),n+60), ti=plainSnip(it.title,n);
  if(!t) return '';
  if(ti && t.indexOf(ti)===0) t=t.slice(ti.length).trim();     // 标题就是原文第一句时，摘要从后面接
  return t.slice(0,n);
}
function openItem(id){
  var it=findItem(id);
  state.view={ t:(it && (it.status==='done'||it.status==='dropped'))?'single':(it && inList(it)?'lread':'triage') };
  if(state.view.t==='lread') state.view.list=it.list_id;
  state.moveOpen=false; state.moveTarget=0;
  state.sel=id; state.pane={ mode:'entry' };
  renderAll(true);
}
/* 侧栏/窄栏切视图：收件箱直接进入阅读（第四版），其余按视图本身 */
function goView(t){
  if(t==='inbox'){
    var ins=inboxSingles();
    var cur=findItem(state.sel), gm=groupedIds();
    var keep=(cur && isInbox(cur) && !gm[cur.id])?cur.id:(ins[0]?ins[0].id:0);
    // 阅读模式统一用「整理」视图（收件箱+钉住）：阅读中钉住一条，它不会从翻页序列里消失
    state.view={ t:'triage' }; state.sel=keep; state.pane=keep?{ mode:'entry' }:{ mode:'empty' };
    renderAll(true); return;
  }
  if(t==='search'){ goSearch(); return; }
  state.view={ t:t }; renderAll(true);
}
function jumpSource(it){
  if(!TAPI){ toast('仅桌面 App 支持'); return; }
  toast('正在切到来源窗口…');
  TAPI.invoke('jump_to_source',{sessionRef:it.session_ref||'',sourceTool:it.source_tool||''})
    .then(function(){ toast('✓ 已切到来源窗口'); })
    .catch(function(e){ toast('✗ '+((e&&e.message)||'来源没找到')); });
}
function readNav(it, kind){
  if(kind==='back'){ state.view=state.view.t==='single'?{ t:'archive' }:(state.view.t==='lread'?{ t:'list', list:state.view.list }:(state.view.t==='sread'?{ t:'search' }:{ t:'board' })); renderAll(true); return; }
  if(kind==='board'){ state.view={ t:'board' }; renderAll(true); return; }
  if(kind==='pin'){ patchStatus(it, grpOf(it.status)==='todo'?'inbox':'todo'); return; }
  if(kind==='focus'){ LAYOUT.enterFocus(); return; }
  if(kind==='prev' || kind==='next'){
    var id=adjId(it.id, kind==='next'?1:-1);
    if(id){ state.sel=id; state.pane={ mode:'entry' }; renderAll(false); }
    return;
  }
  if(kind==='reopen'){ patchStatus(it,'inbox'); return; }
  if(kind==='archnext'){
    var nx=adjId(it.id,1)||adjId(it.id,-1);
    state.sel=nx; state.pane=nx?{ mode:'entry' }:{ mode:'empty' };
    patchStatus(it,'done');
    renderDetail();
  }
}
function bindReadNav(it, box){
  Array.prototype.forEach.call(box.querySelectorAll('[data-nav]'),function(b){
    if(b.getAttribute('data-nav')==='move') return;   // 移到清单由 bindMove 接管（菜单开合）
    b.onclick=function(){ var m=b.closest('details'); if(m) m.open=false; readNav(it, b.getAttribute('data-nav')); };
  });
  Array.prototype.forEach.call(box.querySelectorAll('[data-reveal]'),function(b){
    b.onclick=function(){
      var dm=b.closest('details'); if(dm) dm.open=false;
      var f=gid(b.getAttribute('data-reveal')); if(!f) return;
      f.classList.remove('is-hidden'); b.remove();
      var ta=f.querySelector('textarea'); if(ta){ fitTextarea(ta); ta.focus(); }
    };
  });
  bindMove(it, box);
}
/* ---------- v3：我的清单（用户自建；提醒方式 不提醒 / 每天回顾 / 到日期提醒） ---------- */
var MODE_TXT={ none:['不提醒','','留着备查，不会提醒你。'], daily:['每天回顾','每天','每天打开纳言时，钉板上会先给你看这里的内容。'],
  date:['到日期提醒','提醒','每条写清「等什么」，写的是日期的，到了日子会在钉板顶部提醒。'] };
function listById(id){ for(var i=0;i<state.lists.length;i++){ if(state.lists[i].id===id) return state.lists[i]; } return null; }
/* 在清单里 = 收件箱状态 + 有清单归属（清单已删或没取到清单时按收件箱算，不会「消失」） */
function inList(it){ return it.status==='inbox' && it.list_id!=null && !!listById(it.list_id); }
function isInbox(it){ return it.status==='inbox' && !inList(it); }
function listItems(l){ return state.items.filter(function(it){ return inList(it) && it.list_id===l.id; }).sort(function(a,b){ return b.id-a.id; }); }
/* 到日期提醒：等什么里写出了日期、且日子已到 */
function isDue(it){ var l=inList(it)?listById(it.list_id):null; return !!(l && l.mode==='date' && it.remind_on && it.remind_on<=todayKey()); }
/* 「等什么」里看得出日期才给提醒日（YYYY-MM-DD），看不出返回 null（只存原话、不自动提醒）。与 mcp-server.js 同口径。 */
function parseWaitDate(text, now){
  var t=String(text||'').trim(); if(!t) return null;
  now=now||new Date();
  function fmt(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
  var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  function addDays(n){ return fmt(new Date(today.getFullYear(),today.getMonth(),today.getDate()+n)); }
  function ymd(y,m,d){ var x=new Date(y,m-1,d); return (x.getMonth()===m-1 && x.getDate()===d)?x:null; }
  var m=t.match(/(\d{4})\s*[-/.年]\s*(\d{1,2})\s*[-/.月]\s*(\d{1,2})/);
  if(m){ var x0=ymd(+m[1],+m[2],+m[3]); return x0?fmt(x0):null; }
  m=t.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/);
  if(m){ var x1=ymd(today.getFullYear(),+m[1],+m[2]); if(x1 && x1<today) x1=ymd(today.getFullYear()+1,+m[1],+m[2]); return x1?fmt(x1):null; }
  m=t.match(/(\d{1,2})\s*月/);
  if(m && +m[1]>=1 && +m[1]<=12){ var x2=new Date(today.getFullYear(),+m[1]-1,1); if(x2<today) x2=new Date(today.getFullYear()+1,+m[1]-1,1); return fmt(x2); }
  m=t.match(/(\d+)\s*天[后以]/);
  if(m) return addDays(+m[1]);
  if(/明天/.test(t)) return addDays(1);
  if(/后天/.test(t)) return addDays(2);
  if(/下(个)?(周|星期|礼拜)|一周后/.test(t)) return addDays(7);
  if(/下(个)?月/.test(t)){ var x3=new Date(today.getFullYear(),today.getMonth()+1,today.getDate()); if(x3.getDate()!==today.getDate()) x3.setDate(0); return fmt(x3); }
  return null;
}
function dueDayLabel(day){ if(!day) return ''; var p=day.split('-'); return Number(p[1])+' 月 '+Number(p[2])+' 日'; }
function ldotHTML(l, big){ return '<span class="ldot'+(big?' big':'')+'" style="background:'+escQ(l.color||'#8d887f')+'" aria-hidden="true"></span>'; }

/* 侧栏「我的清单」：色块 + 名字 + 提醒方式简写 + 到期琥珀点 + 计数；末尾「＋ 新建清单」行内表单 */
function renderListNav(){
  var box=gid('listNav'); if(!box) return;
  var v=state.view, nl=state.newList;
  var h=state.lists.map(function(l){
    var items=listItems(l), due=l.mode==='date' && items.some(isDue);
    var on=(v.t==='list'||v.t==='lread') && v.list===l.id;
    return '<button type="button" class="nav-item lrow'+(on?' on':'')+'" data-list="'+l.id+'">'+ldotHTML(l)+
      '<span class="lname">'+esc(l.name)+'</span>'+(MODE_TXT[l.mode]&&MODE_TXT[l.mode][1]?'<span class="mode">'+MODE_TXT[l.mode][1]+'</span>':'')+
      (due?'<span class="due" role="img" aria-label="有到时候的"></span>':'')+'<span class="cnt">'+items.length+'</span></button>';
  }).join('');
  if(!nl.open){
    h+='<button type="button" class="addlist" id="addList"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>新建清单</button>';
  } else {
    h+='<div class="newform"><label class="nfl" for="newListName">清单名字</label>'+
      '<input id="newListName" type="text" maxlength="40" value="'+escQ(nl.name)+'" placeholder="例如：重要、灵感、每周复盘">'+
      '<div class="nfl">提醒方式</div><div class="modes" role="group" aria-label="提醒方式">'+
      ['none','daily','date'].map(function(k){ return '<button type="button" class="modechip'+(nl.mode===k?' on':'')+'" data-mode="'+k+'">'+MODE_TXT[k][0]+'</button>'; }).join('')+
      '</div><div class="nfrow"><button type="button" class="lk" id="newListCancel">取消</button><button type="button" class="tb" id="newListCreate">创建</button></div></div>';
  }
  box.innerHTML=h;
  Array.prototype.forEach.call(box.querySelectorAll('[data-list]'),function(b){
    b.onclick=function(){ state.view={ t:'list', list:Number(b.getAttribute('data-list')) }; renderAll(true); };
  });
  var add=gid('addList'); if(add) add.onclick=function(){ state.newList={ open:true, name:'', mode:'none' }; renderListNav(); var i=gid('newListName'); if(i) i.focus(); };
  var inp=gid('newListName');
  if(inp){
    inp.oninput=function(){ state.newList.name=inp.value; };
    inp.onkeydown=function(ev){ if(ev.key==='Enter' && !ev.isComposing && ev.keyCode!==229){ ev.preventDefault(); createList(); } else if(ev.key==='Escape'){ state.newList.open=false; renderListNav(); } };
    Array.prototype.forEach.call(box.querySelectorAll('[data-mode]'),function(b){
      b.onclick=function(){ state.newList.mode=b.getAttribute('data-mode'); renderListNav(); var i=gid('newListName'); if(i){ i.focus(); var L=i.value.length; i.setSelectionRange(L,L); } };
    });
    gid('newListCancel').onclick=function(){ state.newList.open=false; renderListNav(); };
    gid('newListCreate').onclick=createList;
  }
}
function createList(){
  var name=(state.newList.name||'').trim();
  if(!name){ toast('先给清单起个名字'); var i=gid('newListName'); if(i) i.focus(); return; }
  api('POST','/api/lists',{ name:name, mode:state.newList.mode }).then(function(l){
    state.newList={ open:false, name:'', mode:'none' };
    state.view={ t:'list', list:l.id };
    return load(false);
  }).catch(function(e){ toast(e.message); });
}

/* 清单页（第四版）：色块 + 名字 + N 条 ｜ 提醒方式 · 删除清单；每行 头像 + 标题 + 摘要（等什么/到时候了）+ 钉住 + 移回收件箱 */
function renderListPage(box){
  var l=listById(state.view.list);
  if(!l){ state.view={ t:'board' }; renderAll(true); return; }
  var items=listItems(l);
  var h='<div class="bwrap"><div class="lhead">'+ldotHTML(l,true)+
    '<h1><span class="lname-edit" id="listName" contenteditable spellcheck="false" title="点击改名，⏎ 保存">'+esc(l.name)+'</span><small>'+items.length+' 条</small></h1><span class="grow"></span>'+
    '<label class="lmode">提醒方式<select id="listMode">'+['none','daily','date'].map(function(k){ return '<option value="'+k+'"'+(l.mode===k?' selected':'')+'>'+MODE_TXT[k][0]+'</option>'; }).join('')+'</select></label>'+
    '<button type="button" class="lk" id="listDelete">删除清单</button></div>'+
    '<p class="lsub">'+esc((MODE_TXT[l.mode]||MODE_TXT.none)[2])+'</p>';
  items.forEach(function(it){
    var sm=sumOf(it,120), date=l.mode==='date';
    h+='<div class="brow">'+avHTML(it,true)+'<button type="button" class="bopen" data-lact="open" data-id="'+it.id+'"><span class="bt"><div class="bt1">'+esc(it.title)+'</div>'+
      '<div class="bt2">'+(date?'<span class="badge wait">⏳ 等：'+esc(it.wait_note||'以后再看')+(it.remind_on && !isDue(it)?' · '+dueDayLabel(it.remind_on):'')+'</span>':'')+
      (date && isDue(it)?'<span class="badge win">到时候了</span>':'')+esc(sm)+'</div></span></button>'+
      '<span class="bm" title="收录时间">'+esc(fullTime(it.created_at))+'</span>'+
      '<button type="button" class="tb" data-lact="pin" data-id="'+it.id+'">钉住</button>'+
      '<button type="button" class="lk" data-lact="back" data-id="'+it.id+'">移回收件箱</button></div>';
  });
  if(!items.length) h+='<p class="bempty">还是空的。整理收件箱时点「移到清单」，或者收录时直接选这个清单。</p>';
  h+='</div>';
  box.innerHTML=h;
  var nm=gid('listName');
  nm.onkeydown=function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); nm.blur(); } else if(ev.key==='Escape'){ nm.textContent=l.name; nm.blur(); } };
  nm.onblur=function(){
    var v=nm.textContent.trim();
    if(!v){ nm.textContent=l.name; return; }
    if(v!==l.name) refresh(api('PATCH','/api/lists/'+l.id,{ name:v }));
  };
  gid('listMode').onchange=function(){ refresh(api('PATCH','/api/lists/'+l.id,{ mode:gid('listMode').value })); };
  gid('listDelete').onclick=function(){
    api('DELETE','/api/lists/'+l.id).then(function(r){
      toast('已删除清单「'+l.name+'」'+(r && r.moved_to_inbox?'，'+r.moved_to_inbox+' 条回到收件箱':''));
      state.view={ t:'board' }; load(false);
    }).catch(function(e){ toast(e.message); });
  };
  box.onclick=function(ev){
    var b=ev.target&&ev.target.closest?ev.target.closest('[data-lact]'):null; if(!b) return;
    var it=findItem(Number(b.getAttribute('data-id'))); if(!it) return;
    var act=b.getAttribute('data-lact');
    if(act==='open') openItem(it.id);
    else if(act==='pin') patchStatus(it,'todo');
    else if(act==='back') refresh(api('PATCH','/api/suggestions/'+it.id,{ list_id:null }));
  };
  box.onkeydown=null;
}

/* 阅读页「移到清单 ▲」：到日期清单先问「等什么？」，放好后跳下一条 */
function moveMenuHTML(it){
  var others=state.lists.filter(function(l){ return !(inList(it) && it.list_id===l.id); });
  if(!others.length) return '';
  return '<div class="menu movemenu" id="moveMenu" role="menu" aria-label="移到清单"'+(state.moveOpen?'':' hidden')+'>'+others.map(function(l){
    return '<button type="button" class="mi" role="menuitem" data-move="'+l.id+'">'+ldotHTML(l)+esc(l.name)+'<span>'+MODE_TXT[l.mode][0]+'</span></button>';
  }).join('')+'</div>';
}
function laterBarHTML(){
  var l=listById(state.moveTarget); if(!l) return '';
  return '<div class="laterbar"><span aria-hidden="true">⏳</span><label><span class="lq">放进「'+esc(l.name)+'」，等什么？</span>'+
    '<input type="text" id="laterText" placeholder="例如：等同步功能做完 / 11 月再看" aria-label="等什么"></label>'+

function moveToList(it, l, wait){
  var nx=adjId(it.id,1)||adjId(it.id,-1);
  var body={ list_id:l.id };
  if(l.mode==='date'){ var w=(wait||'').trim()||'以后再看'; body.wait_note=w; body.remind_on=parseWaitDate(w); }
  else { body.wait_note=''; body.remind_on=null; }
  state.moveOpen=false; state.moveTarget=0;
  state.sel=nx; state.pane=nx?{ mode:'entry' }:{ mode:'empty' };
  api('PATCH','/api/suggestions/'+it.id, body).then(function(){
    toast('已放进「'+l.name+'」'+(body.remind_on?'，'+dueDayLabel(body.remind_on)+'提醒你':''));
    load(false);
  }).catch(function(e){ toast(e.message); });
}
function bindMove(it, box){
  var btn=box.querySelector('[data-nav="move"]');
  if(btn) btn.onclick=function(ev){ ev.stopPropagation(); state.moveOpen=!state.moveOpen; state.moveTarget=0; var m=gid('moveMenu'); if(m) m.hidden=!state.moveOpen; };
  Array.prototype.forEach.call(box.querySelectorAll('[data-move]'),function(b){
    b.onclick=function(){
      var l=listById(Number(b.getAttribute('data-move'))); if(!l) return;
      if(l.mode==='date'){ state.moveOpen=false; state.moveTarget=l.id; renderDetail(); var t=gid('laterText'); if(t) t.focus(); return; }
      moveToList(it, l, '');
    };
  });
  var ok=gid('laterOk');
  if(ok){
    var l=listById(state.moveTarget);
    ok.onclick=function(){ moveToList(it, l, gid('laterText').value); };
    gid('laterCancel').onclick=function(){ state.moveTarget=0; renderDetail(); };
    gid('laterText').onkeydown=function(ev){
      if(ev.key==='Enter' && !ev.isComposing && ev.keyCode!==229){ ev.preventDefault(); moveToList(it, l, gid('laterText').value); }
      else if(ev.key==='Escape'){ state.moveTarget=0; renderDetail(); }
    };
    Array.prototype.forEach.call(box.querySelectorAll('[data-later]'),function(b){ b.onclick=function(){ moveToList(it, l, b.getAttribute('data-later')); }; });
  }
}
document.addEventListener('click',function(ev){
  var m=gid('moveMenu');
  if(state.moveOpen && m && !m.contains(ev.target)){ state.moveOpen=false; m.hidden=true; }
});

/* 钉板顶部：到日期提醒条（一次一条）；「再等等」自己选推迟到哪天 */
function dueBarHTML(){
  var due=state.items.filter(isDue).sort(function(a,b){ return a.remind_on<b.remind_on?-1:(a.remind_on>b.remind_on?1:a.id-b.id); });
  if(!due.length) return '';
  var it=due[0], l=listById(it.list_id);
  return '<div class="duebar" data-due="'+it.id+'"><span aria-hidden="true">⏳</span>'+

function bindCompare(box){
  var cg=state.view.group;

      var pid=uv?Number(uv.getAttribute('data-unvote')):Number(v.closest('[data-pid]').getAttribute('data-pid'));
      var p=state.cmp.points.filter(function(x){ return x.id===pid; })[0]; if(!p) return;
      var nv=uv?'':(p.verdict===v.getAttribute('data-vote')?'':v.getAttribute('data-vote'));
      p.verdict=nv; renderBoard();
      api('PATCH','/api/compare-points/'+pid,{ verdict:nv }).catch(function(e){ toast(e.message); openCompare(cg); });
      return;
    }
    if(!a) return;
    var act=a.getAttribute('data-cact');
    if(act==='back'){ state.view={ t:'board' }; renderAll(true); }
    else if(act==='src'){ var s=a.parentNode.querySelector('.ptsrc'); if(s) s.hidden=!s.hidden; }
    else if(act==='open'){ openItem(Number(a.getAttribute('data-id'))); }

    }

      saveCmpText().then(function(){
        return api('POST','/api/compare-groups/'+cg+'/resolve',{ dest:act==='pin'?'todo':'inbox' });
      }).then(function(r){

        state.view={ t:'board' }; if(r && r.id) state.fx.flyIn=[r.id]; load(false);
      }).catch(function(e){ toast(e.message); });
    }

  if(q){ q.onkeydown=function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); q.blur(); } }; q.onblur=saveCmpText; }

}
function saveCmpText(){

/* 第四版来源头像：彩色字母方块（已知几家固定配色；其他来源取名字首字、灰底） */
var AV_KNOWN={ 'claude':['C','s-claude'], 'claudecode':['C','s-claude'], 'zcode':['Z','s-zcode'], 'obsidian':['O','s-obsidian'],
  'workbuddy':['W','s-workbuddy'], 'chatgpt':['G','s-chatgpt'], 'antigravity':['A','s-antigravity'], 'nayan':['综','s-nayan'], 'me':['纳','s-nayan'] };
function avOf(it){
  var k=String(it.source_tool||'other').toLowerCase().replace(/[^a-z0-9]/g,'');
  var hit=AV_KNOWN[k];
  if(hit) return { l:hit[0], cls:hit[1] };
  var nm=String(toolName(it)||'').trim();
  return { l:(nm?Array.from(nm)[0].toUpperCase():'·'), cls:'s-other' };
}
function avHTML(it, lg){ var a=avOf(it); return '<span class="av '+a.cls+(lg?' lg':'')+'" aria-hidden="true">'+esc(a.l)+'</span>'; }
/* 第四版时间写法：今天只写时刻；昨天带时刻；一周内写周几；更早写月日 */
function shortTime(s){
  var k=dayKey(s), t=String(s||'').slice(11,16);
  if(!k) return '';
  if(k===todayKey()) return t||'今天';
  var p=k.split('-'), d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
  var now=new Date(), today0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var diff=Math.round((today0-d)/86400000);
  if(diff===1) return '昨天'+(t?' '+t:'');
  if(diff>1 && diff<7) return '周'+['日','一','二','三','四','五','六'][d.getDay()];
  if(Number(p[0])===now.getFullYear()) return Number(p[1])+' 月 '+Number(p[2])+' 日';
  return p[0]+' 年 '+Number(p[1])+' 月 '+Number(p[2])+' 日';
}
/* 具体到分钟的时间：清单行、阅读页用（今年不写年份） */
function fullTime(s){
  var k=dayKey(s), t=String(s||'').slice(11,16);
  if(!k) return '';
  var p=k.split('-');
  return (Number(p[0])===new Date().getFullYear()?'':p[0]+' 年 ')+Number(p[1])+' 月 '+Number(p[2])+' 日'+(t?' '+t:'');
}

  var url='', cut=sr.indexOf(' | ');
  if(cut>0 && sr.slice(cut+3).indexOf('http')===0) url=sr.slice(cut+3);
  return { sr:sr, win:win, url:url, any:win||!!url };
}

/* 最近待看：钉住的在前（蓝点），其余按新到旧；可按项目筛选；只显示标题 */

var BOARD_C=2*Math.PI*17;

function boardCard(it, solo){
  var steps=it.steps||[], nDone=steps.filter(function(x){ return x.done; }).length;
  var firstOpen=-1; steps.forEach(function(x,i){ if(!x.done && firstOpen<0) firstOpen=i; });

function renderBoard(){

function openPlanSheet(){
  var t=gid('boardQuick').value.trim(), steps=NayanPlan.parsePlan(t); if(!steps) return;
  state.plan={ open:true, title:NayanPlan.planTitle(), steps:steps.map(function(x){ return { time:x.time, text:x.text }; }), text:t, src:'rule', edited:false };
  renderPlanSheet();
  var first=gid('planSheet').querySelector('.ptext'); if(first) first.focus();
  // 开了 AI：先给出按时间点拆的结果（不让人等），AI 整理好了、而且用户还没动过，再换成 AI 的版本
  if(!aiOn('plan')) return;
  aiConsent('plan').then(function(ok){
    if(!ok || !state.plan.open || state.plan.text!==t) return;
    var badge=gid('planSheet').querySelector('.badge'); if(badge) badge.textContent='AI 整理中…';
    api('POST','/api/ai/plan',{ text:t }).then(function(r){
      if(!state.plan.open || state.plan.text!==t) return;
      if(r && r.steps && r.steps.length && !state.plan.edited){
        state.plan.steps=r.steps.map(function(x){ return { time:x.time||'', text:x.text||'' }; }); state.plan.src='ai'; renderPlanSheet();
      } else { var b2=gid('planSheet').querySelector('.badge'); if(b2){ b2.textContent='按时间点拆 · 没用 AI'; b2.title=(r&&r.reason)||''; } }
    }).catch(function(){ var b3=gid('planSheet').querySelector('.badge'); if(b3) b3.textContent='按时间点拆 · 没用 AI'; });
  });
}
function closePlanSheet(){ state.plan.open=false; gid('planSheet').hidden=true; gid('planSheet').innerHTML=''; gid('boardQuick').focus(); }
function renderPlanSheet(){
  var box=gid('planSheet'), pl=state.plan;
  box.innerHTML='<div class="shead"><input class="ptitle" id="planTitle" value="'+escQ(pl.title)+'" aria-label="清单标题" maxlength="60">'+
    '<span class="badge'+(pl.src==='ai'?' win':'')+'">'+(pl.src==='ai'?'AI 整理':'按时间点拆 · 没用 AI')+'</span></div>'+
    pl.steps.map(function(x,i){
      return '<div class="prow" data-pi="'+i+'"><input class="ptime" value="'+escQ(x.time)+'" placeholder="时间" aria-label="第 '+(i+1)+' 步的时间" maxlength="5">'+
        '<input class="ptext" value="'+escQ(x.text)+'" aria-label="第 '+(i+1)+' 步" maxlength="200">'+
        '<button type="button" class="px" data-pdel="'+i+'" aria-label="删掉这一步" title="删掉这一步">×</button></div>';
    }).join('')+
    '<button type="button" class="addstep" data-padd="1">＋ 加一步</button>'+
    '<div class="sfoot"><span class="grow"></span><button type="button" class="lk" data-pact="cancel">取消</button>'+
    '<button type="button" class="tb" data-pact="plain">只记一条</button><button type="button" class="cta" data-pact="pin">钉到钉板</button></div>';
  box.hidden=false;
  box.oninput=function(ev){
    var t=ev.target; if(t.id==='planTitle'){ pl.title=t.value; return; }
    pl.edited=true;
    var row=t.closest('[data-pi]'); if(!row) return; var s=pl.steps[Number(row.getAttribute('data-pi'))];
    if(t.classList.contains('ptime')) s.time=t.value.trim(); else s.text=t.value;
  };
  box.onclick=function(ev){
    var t=ev.target.closest?ev.target:null; if(!t) return;
    var del=t.closest('[data-pdel]');
    if(del){ pl.edited=true; pl.steps.splice(Number(del.getAttribute('data-pdel')),1); renderPlanSheet(); return; }
    if(t.closest('[data-padd]')){ pl.edited=true; pl.steps.push({ time:'', text:'' }); renderPlanSheet(); var r=box.querySelectorAll('.ptext'); if(r.length) r[r.length-1].focus(); return; }
    var a=t.closest('[data-pact]'); if(!a) return;
    var act=a.getAttribute('data-pact');
    if(act==='cancel') closePlanSheet();
    else if(act==='plain'){ closePlanSheet(); boardQuickAdd(); }
    else if(act==='pin') pinPlan();
  };
  box.onkeydown=function(ev){
    if(ev.key==='Escape'){ ev.preventDefault(); closePlanSheet(); }
    else if(ev.key==='Enter' && (ev.metaKey||ev.ctrlKey) && !ev.isComposing){ ev.preventDefault(); pinPlan(); }
  };
}
/* 钉到钉板：建一条「我写的」条目（原话进原文）→ 写入步骤（时间写在步骤开头）→ 钉住 */
function pinPlan(){
  var pl=state.plan;
  var steps=pl.steps.map(function(x){ return { time:(x.time||'').trim(), text:(x.text||'').trim() }; }).filter(function(x){ return x.text; });
  if(!steps.length){ toast('至少留一步'); return; }
  var title=(pl.title||'').trim()||NayanPlan.planTitle();
  var req={ title:title, quote:pl.text, kind:'suggestion', source_tool:'me', workspace:boardProjValue() };
  var btn=gid('planSheet').querySelector('[data-pact="pin"]'); if(btn) btn.disabled=true;
  api('POST','/api/suggestions',req).then(function(created){
    return api('POST','/api/suggestions/'+created.id+'/steps',{ steps:steps.map(function(x){ return { content:NayanPlan.stepContent(x), is_cmd:false }; }) })
      .then(function(){ return api('PATCH','/api/suggestions/'+created.id,{ status:'todo' }); })
      .then(function(){ return created; });
  }).then(function(created){
    gid('boardQuick').value=''; fitBoardQuick(); paintPlanChip();
    state.plan={ open:false, title:'', steps:[], text:'', src:'rule' };
    gid('planSheet').hidden=true; gid('planSheet').innerHTML='';
    state.fx.flyIn=[created.id];
    toast('已钉到钉板：'+steps.length+' 步');
    return load(false);
  }).catch(function(e){ if(btn) btn.disabled=false; toast(e.message); });
}

/* 阅读整理快捷键：J/K 上下条 · P 钉住/取消 · E 归档并下一条（输入框内、设置页、钉板上不触发） */
window.addEventListener('keydown',function(ev){
  if(ev.metaKey||ev.ctrlKey||ev.altKey||ev.shiftKey) return;
  var a=document.activeElement;
  if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'||a.isContentEditable)) return;
  var rv=state.view.t;
  if(!(rv==='triage'||rv==='single'||rv==='inbox'||rv==='lread'||rv==='sread')||!state.sel||state.pane.mode!=='entry') return;
  if(gid('settingsScreen').classList.contains('open')) return;
  var it=findItem(state.sel); if(!it) return;
  var k=ev.key.toLowerCase();
  var aim=gid('aiMenu');
  if(k==='escape' && aim && aim.open){ ev.preventDefault(); aim.open=false; aim.querySelector('summary').focus(); return; }
  if(aim && aim.open && /^[1-4]$/.test(k)){ ev.preventDefault(); var mb0=aim.querySelectorAll('[data-act="tidy"]')[Number(k)-1]; if(mb0 && !mb0.disabled) mb0.click(); return; }
  if(k==='a' && aim){ ev.preventDefault(); aim.open=!aim.open; if(aim.open){ var f0=aim.querySelector('[data-act="tidy"]:not([disabled])'); if(f0) f0.focus(); } return; }
  /* Esc：先收起开着的菜单 / 等什么条；都没开就回到来的地方（清单、钉板、归档、搜索）。按在输入框里的 Esc 不算 */
  if(k==='escape'){
    var tg=ev.target;
    if(ev.defaultPrevented || LAYOUT.isFocus() || (tg && (tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'||tg.isContentEditable))) return;
    ev.preventDefault();
    var dm=document.querySelector('#detail details.dmenu[open]');
    if(dm){ dm.open=false; return; }
    if(state.moveOpen){ state.moveOpen=false; var mm=gid('moveMenu'); if(mm) mm.hidden=true; return; }
    if(state.moveTarget){ state.moveTarget=0; renderDetail(); return; }
    readNav(it,'back'); return;
  }
  if(k==='j'){ ev.preventDefault(); readNav(it,'next'); }
  else if(k==='k'){ ev.preventDefault(); readNav(it,'prev'); }
  else if(k==='p'){ ev.preventDefault(); patchStatus(it, grpOf(it.status)==='todo'?'inbox':'todo'); }
  else if(k==='e'){ ev.preventDefault(); if(grpOf(it.status)==='done') patchStatus(it,'inbox'); else readNav(it,'archnext'); }
  else if(k==='m' && grpOf(it.status)!=='done' && state.lists.length){ ev.preventDefault(); var mb=document.querySelector('[data-nav="move"]'); if(mb) mb.click(); }
});

function renderDetail(){

    box.innerHTML=addPaneHTML();

    } else {
    box.innerHTML='<div class="dwrap'+(paneNew?' panein':'')+'"><div class="empty">'+
      '<div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="3"/><path d="M7 9h10M7 13h6"/></svg></div>'+
      '<h2>选中一条看详情</h2>'+

      '</div></div>';
    }
    var etb=gid('emptyToBoard'); if(etb) etb.onclick=function(){ state.view={ t:'board' }; renderAll(true); };
    return;
  }
  box.innerHTML=entryHTML(it);
  if(paneNew){
    var dw=box.querySelector('.dwrap');
    if(dw) dw.classList.add('panein');
  }
  bindEntry(it);

  fitDetailTextareas();

  // ⑨ 进度条从上次的量弹簧充能到新的量（勾步骤时才有）

    var steps=it.steps||[];
    var doneN=steps.filter(function(s){ return s.done; }).length;
    var pct=steps.length?Math.round(doneN*100/steps.length):0;

    var list = gid('attList');
    if (!list || state.pane.mode !== 'entry') return;
    var pos = e.payload && e.payload.position;
    var dpr = window.devicePixelRatio || 1;
    var el = pos ? document.elementFromPoint(pos.x / dpr, pos.y / dpr) : null;
    list.classList.toggle('dropok', !!(el && el.closest && el.closest('#attList')));
  });
  window.__TAURI__.event.listen('tauri://drag-leave', function () {
    var list = gid('attList');
    if (list) list.classList.remove('dropok');
  });
}
document.addEventListener('keydown', function (e) {
  if ((e.metaKey || e.ctrlKey) && (e.key === 'f' || e.key === 'F')) {
    e.preventDefault(); goSearch(); return;
  }
  /* 空格 = 附件快速预览（悬停在附件行上时；Finder 同款手感） */
  if (e.key === ' ' && !e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey) {
    var a = document.activeElement;
    var typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable);
    if (!typing && state.pane.mode === 'entry' && state.attHover) {
      var hrow = document.querySelector('.att[data-att="' + state.attHover + '"]');
      var hpath = hrow ? hrow.getAttribute('data-path') : '';
      if (hpath && !hrow.classList.contains('miss') && TAPI) {
        e.preventDefault();
        TAPI.invoke('quick_look', { path: hpath }).catch(function (err) { toast('✗ ' + (err.message || err)); });
      }
    }
    return;
  }
  if (e.key !== 'Escape') return;
  var ss = document.getElementById('settingsScreen');
  if (ss && ss.classList.contains('open')) { e.preventDefault(); closeSettings(); return; }
  var sq = gid('sq');
  if (sq && document.activeElement === sq) {
    e.preventDefault();
    if (sq.value) { sq.value=''; state.search.q=''; paintSearch(); } else sq.blur();
    return;
  }
  var q = gid('q');
  if (document.activeElement === q) {
    e.preventDefault();
    if (q.value) { q.value=''; state.q=''; renderList(true); renderNav(); }
    q.blur();
  }
});

/* 快输：回车收进当前视图（项目视图自动带上项目） */
gid('quickInput').addEventListener('keydown',function(ev){
  if(ev.key!=='Enter') return;
  ev.preventDefault();
  var t=gid('quickInput').value.trim();
  if(!t) return;
  gid('quickInput').value='';
  // ⑯ 输入框果冻脉冲一下再收
  var qa=gid('quickAdd');
  qa.classList.remove('squish'); void qa.offsetWidth; qa.classList.add('squish');
  // 会话/项目视图下快记自动带上对应项目
  var ws='';
  if(state.view.t==='session'){
    for(var wi=0;wi<state.items.length;wi++){
      var x=state.items[wi];
      if((x.source_tool||'other')===state.view.tool && (x.session_ref||'')===state.view.session && projOf(x)){ ws=projOf(x); break; }
    }
  } else if(state.view.t==='proj' || state.view.t==='projtool'){
    ws=state.view.proj||'';
  }
  var kind=(state.view.t==='kind'&&state.view.kind==='idle')?'idle':'suggestion';
  api('POST','/api/suggestions',{ title:t, kind:kind, workspace:ws })
    .then(function(created){
      if(created&&created.id){
        state.fx.flyIn=[created.id];
        if(!state.sel){ state.sel=created.id; if(state.pane.mode==='empty') state.pane={mode:'entry'}; }
      }
      load(false);
    })
    .catch(function(err){ toast(err.message); });
});
var qTimer=null;

/* 主题：跟随系统 / 浅色 / 深色（设置 › 通用里切换；旧版存过的 light/dark 偏好照旧生效） */
var THEME_MQ=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function themePref(){
  var t=null;
  try{ t=localStorage.getItem('inbox-theme'); }catch(e){}
  if(t!=='light' && t!=='dark' && t!=='system'){ try{ t=new URLSearchParams(location.search).get('theme'); }catch(e){} }
  return (t==='light'||t==='dark')?t:'system';
}
function applyTheme(pref){
  var dark=pref==='dark' || (pref==='system' && !!(THEME_MQ && THEME_MQ.matches));
  document.body.classList.toggle('dark', dark);
}
applyTheme(themePref());
if(THEME_MQ && THEME_MQ.addEventListener) THEME_MQ.addEventListener('change',function(){ if(themePref()==='system') applyTheme('system'); });
function setTheme(pref, fromEl){
  var willDark=pref==='dark' || (pref==='system' && !!(THEME_MQ && THEME_MQ.matches));
  try{ localStorage.setItem('inbox-theme',pref); }catch(e){}
  function justApply(){ applyTheme(pref); }
  // ⑬ 从点击位置圆形揭示换肤；明暗不变、开了减弱动效或 WAAPI 不可用则直接切换
  if(willDark===document.body.classList.contains('dark') || reduceMq.matches || !fromEl){ justApply(); return; }
  try{
    var r=fromEl.getBoundingClientRect();
    var x=Math.round(r.left+r.width/2), y=Math.round(r.top+r.height/2);
    var veil=gid('veil');
    var R=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y))+40;
    veil.style.background= willDark ? '#141311' : '#f8f7f4';
    veil.getAnimations().forEach(function(a){ a.cancel(); });
    veil.style.opacity='1';
    var a=veil.animate(
      [{clipPath:'circle(0px at '+x+'px '+y+'px)'},{clipPath:'circle('+R+'px at '+x+'px '+y+'px)'}],
      {duration:450,easing:'cubic-bezier(.3,0,.2,1)'});
    a.onfinish=function(){
      justApply();
      var f=veil.animate([{opacity:1},{opacity:0}],{duration:220});
      f.onfinish=function(){ veil.style.opacity='0'; };
    };
  }catch(e){ justApply(); }
}

var aiBusy=false;

/* ---- UX-WORKBUDDY-READING-01 Step3：三模式布局（全部来源/条目通用）----
   状态 = {nav:'full'|'min', list:'on'|'off'}，专注阅读 = nav:min + list:off 的组合视图；
   切换只改 body 类（CSS 变量几何），不触碰 state.view/选择/搜索/滚动，正文不重建；
   偏好记忆 localStorage nayan-layout；进入专注前保存原偏好，退出时恢复。
   恢复入口永不位于被隐藏栏：窄栏»钮/浮层「显示列表」/浮层「退出专注」+Esc。 */
var LAYOUT=(function(){
  /* 第四版：侧栏常驻、没有中间列表——启动一律全宽侧栏；窄栏/隐藏列表的旧偏好不再恢复，
     专注阅读只从阅读页「···」临时进入（Esc 退出）。 */
  var st={nav:'full',list:'on'};
  var savedBeforeFocus=null;
  function persist(){ try{ localStorage.setItem('nayan-layout',JSON.stringify(st)); }catch(e){} }
  function apply(){
    var b=document.body;
    b.classList.toggle('nav-min',st.nav==='min');
    b.classList.toggle('list-off',st.list==='off');
    var focus=st.nav==='min'&&st.list==='off';
    b.classList.toggle('focus-read',focus);
    if(window.movePill) setTimeout(movePill,320);
  }
  function setNav(v){ st.nav=v; persist(); apply(); }
  function setList(v){ st.list=v; persist(); apply(); }
  return {
    apply:apply,
    toggleNav:function(){ setNav(st.nav==='min'?'full':'min'); },
    toggleList:function(){ setList(st.list==='off'?'on':'off'); },
    enterFocus:function(){ if(savedBeforeFocus===null) savedBeforeFocus={nav:st.nav,list:st.list}; setNav('min'); setList('off'); },
    exitFocus:function(){ if(savedBeforeFocus){ st=savedBeforeFocus; savedBeforeFocus=null; persist(); apply(); } else { setNav('full'); setList('on'); } },
    isFocus:function(){ return st.nav==='min'&&st.list==='off'; }
  };
})();
(function(){
  var c=gid('navCollapse'),e=gid('navExpand'),lt=gid('listToggle'),lr=gid('listRestore'),fb=gid('focusBtn'),fx=gid('focusExit');
  if(c) c.onclick=function(){ LAYOUT.toggleNav(); };
  if(e) e.onclick=function(){ LAYOUT.toggleNav(); };
  if(lt) lt.onclick=function(){ LAYOUT.toggleList(); };
  if(lr) lr.onclick=function(){ LAYOUT.toggleList(); };
  if(fb) fb.onclick=function(){ LAYOUT.enterFocus(); };
  if(fx) fx.onclick=function(){ LAYOUT.exitFocus(); };
  window.addEventListener('keydown',function(ev){
    if(ev.key==='Escape'&&LAYOUT.isFocus()){ LAYOUT.exitFocus(); }
  });
  /* 窄栏图标导航：与全宽导航同一 state.view 语义 */
  Array.prototype.forEach.call(document.querySelectorAll('#railNav .rn'),function(el){
    el.onclick=function(){
      var v=el.getAttribute('data-view');
      if(v){ goView(v); paintRail(); return; }
      var k=el.getAttribute('data-kind');
      if(k){ state.view={t:'kind',kind:k}; renderAll(true); }
      paintRail();
    };
  });
})();
(function(){})();
/* 窄栏选中态：视图切换点（窄栏点击/布局应用/周期刷新）刷新——renderNav 为函数声明无法
   外层包装，多点轻量重绘足够（纯 classList 切换，无请求无重建） */
function paintRail(){
  var v=state.view;
  Array.prototype.forEach.call(document.querySelectorAll('#railNav .rn'),function(el){
    var dv=el.getAttribute('data-view'),dk=el.getAttribute('data-kind');
    el.classList.toggle('on', (dv&&dv===v.t)||(dk&&v.t==='kind'&&dk===v.kind));
  });
}
LAYOUT.apply();
paintRail();

/* ---- UX-AI-CAPTURE-FIDELITY-01：代码块独立复制（详情页；所有来源共享）----
   只复制代码原文（空格/缩进/换行逐字符），不混入语言标签/按钮文字/hover 芯片。 */
document.addEventListener('click',function(ev){

  if(!b) return;
