name: 功能建议
description: 想让纳言多做什么
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的不便是什么？
      description: 先说场景和痛点，比直接说方案更有帮助。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你希望它怎么做？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过别的办法吗？
      description: 用别的工具绕过、或者纳言里现成的近似做法。
  - type: textarea
    id: context
    attributes:
      label: 其他背景（可选）
