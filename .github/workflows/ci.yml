# 持续集成：跑不需要图形界面和真实 Chrome 的套件。
# 两个不放进来的类别（本地 node scripts/test-all.mjs 仍然覆盖）：
#   - source-map：读取私有仓库的证据文件，开源仓库里没有；
#   - native-ui / real-app* / capture-walkthrough / delivery-bridge /
#     extension-real-path：需要真实 App 窗口或真实 Chrome。
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 渲染器测试用 Chrome for Testing，与本地 tests/renderer/cdp.mjs 用同一个版本，结果可以对照。
      # （CI 上真正卡住的原因是 Chrome 停发动画帧，已在 cdp.mjs 用启动参数修复。）
      - name: 装 Chrome for Testing
        # 装到 cdp.mjs 默认查找的位置（~/.cache/puppeteer），装完确认可执行文件在。
        run: |
          npx --yes @puppeteer/browsers@2 install chrome@150.0.7871.24 --path "$HOME/.cache/puppeteer"
          test -x "$HOME/.cache/puppeteer/chrome/mac_arm-150.0.7871.24/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
      - name: Rust 测试
        working-directory: app/src-tauri
        run: cargo test --locked
      - name: Node 套件（无图形界面）
        # 套件名写在一行：YAML 折叠换行会变成空格，--only 只会收到第一段
        run: node scripts/test-all.mjs --only dom,helpers,rich,rich-dom,reader-async,title-rule,plan-rule,envelope-goldens,box-overlay,trash-external,external-writers,schema-gate-consistency,mcp-ingestion,sync-ingestion
